/* ==========================================================================================
   [TUT] 대화형 튜토리얼 — 실제 전투 화면 위에서 각 요소를 가리키며 진행한다
   ========================================================================================== */
const Tut = {
  on:false, i:0, savedRun:null,

  start(){
    const T=DB.tutorial;
    Tut.savedRun=Run.data;
    const sc=DB.schools.find(s=>s.id===T.school)||DB.schools[0];
    const R=DB.balance.resource;
    Run.data={ difficulty:'train', school:sc.id, hp:R.hpDefault+sc.hpBonus, hpMax:R.hpDefault+sc.hpBonus,
      staminaMax:R.staminaMax+sc.staminaBonus, techs:sc.techs.slice(), traits:[],
      parts:0, layer:0, cleared:0, map:[], pending:null, isTutorial:true };
    Tut.on=true; Tut.i=0;
    document.getElementById('tutLayer').classList.add('on');
    Battle.start(T.enemy, Run.playerCfg(), ()=>Tut.end(), {tutorial:true});
    Tut.render();
  },

  step(){ return Tut.on?DB.tutorial.steps[Tut.i]:null; },
  allowTech(id){ const s=Tut.step(); if(!s||s.free) return true;
    if(s.allow&&s.allow.techs) return s.allow.techs.indexOf(id)>=0;
    return !s.require; },
  allowStance(id){ const s=Tut.step(); if(!s||s.free) return true;
    if(s.allow&&s.allow.stances) return s.allow.stances.indexOf(id)>=0;
    return !s.require; },
  allowBasic(id){ const s=Tut.step(); if(!s||s.free) return true;
    if(s.allow&&s.allow.basics) return s.allow.basics.indexOf(id)>=0;
    return !s.require; },

  /* 잠긴 조작을 눌렀을 때 조용히 무시하지 않고 이유를 알려 준다 */
  deny(){
    if(!Tut.on) return;
    const el=document.querySelector('#tutBox .lockmsg'); if(!el) return;
    el.textContent=DB.tutorial.lockMsg;
    el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
    clearTimeout(Tut._dt); Tut._dt=setTimeout(()=>el.classList.remove('on'),2200);
  },

  notify(ev){
    const s=Tut.step(); if(!s||!s.require) return;
    if(s.require.type===ev.type && s.require.id===ev.id) setTimeout(()=>Tut.next(),60);
  },

  /* 요구 동작을 수행할 수 없는 상태면(기력 부족·사거리 밖) 그 자리에서 조건을 맞춰 준다.
     튜토리얼이 영구히 막히는 상황을 만들지 않기 위한 안전장치다. */
  ensure(){
    const st=Tut.step(); if(!st||!st.require||!Battle.st) return;
    const a=Battle.A(DB.meta.sides.SELF);
    if(st.require.type==='tech'){
      const d=DB.techs[st.require.id]; if(!d) return;
      const need=Battle.transitionCost(a,d.stance)+Battle.effCost(a,d);
      if(a.stamina<need) a.stamina=U.clamp(need,0,a.staminaMax);
      if((d.onHit||[]).length){
        const D=DB.balance.distance;
        if(Battle.st.distance<d.range[0]||Battle.st.distance>d.range[1])
          Battle.st.distance=U.clamp(d.range[0],D.min,D.max);
      }
    } else if(st.require.type==='stance'){
      const c=Battle.transitionCost(a,st.require.id);
      if(a.stamina<c) a.stamina=U.clamp(c,0,a.staminaMax);
    }
    if(!Battle.awaitInput && !Battle.st.over){
      /* 상대 차례에서 멈춰 있으면 내 차례가 오도록 행동권을 넘겨준다 */
      const P=Battle.A(DB.meta.sides.SELF), E=Battle.A(DB.meta.sides.FOE);
      if(P.readyAt>E.readyAt){ P.readyAt=E.readyAt; Battle.loop(); }
    }
  },
  next(){
    if(Tut.i>=DB.tutorial.steps.length-1){ Tut.render(); return; }
    Tut.i++; Tut.applySetup(); Tut.render(); UI.renderBattle();
  },
  prev(){ if(Tut.i>0){ Tut.i--; Tut.render(); UI.renderBattle(); } },

  applySetup(){
    const s=Tut.step(); if(!s||!s.setup||!Battle.st) return;
    if(s.setup.foeQueue){
      const d=DB.techs[s.setup.foeQueue], st=Battle.st;
      const has=st.queue.some(q=>q.status==='pending'&&q.owner===DB.meta.sides.FOE);
      if(!has && d) st.queue.push({ seq:++st.seq, owner:DB.meta.sides.FOE, techId:d.id, name:d.name,
        line:d.line, onHit:d.onHit, resolveAt:st.tick+d.cast+2, status:'pending', range:d.range });
    }
  },

  end(){
    Tut.on=false;
    document.querySelectorAll('.tut-focus').forEach(x=>x.classList.remove('tut-focus'));
    document.getElementById('tutLayer').classList.remove('on');
    Run.data=Tut.savedRun; Tut.savedRun=null;
    UI.showScreen('title');
  },

  render(){
    if(!Tut.on) return;
    let s=Tut.step();
    /* 요구 조건이 이미 충족된 단계는 막히지 않도록 자동으로 넘긴다 */
    if(s && s.require && s.require.type==='stance' && Battle.st
       && Battle.A(DB.meta.sides.SELF).stance===s.require.id
       && Tut.i<DB.tutorial.steps.length-1){
      Tut.i++; Tut.applySetup(); s=Tut.step();
    }
    Tut.ensure();
    const box=document.getElementById('tutBox');
    const dots=DB.tutorial.steps.map((_,i)=>`<i class="${i<=Tut.i?'on':''}"></i>`).join('');
    const last=Tut.i>=DB.tutorial.steps.length-1;
    box.innerHTML=`
      <div class="tt"><span class="num">${Tut.i+1} / ${DB.tutorial.steps.length}</span>${U.esc(s.t)}</div>
      <div class="tb">${U.esc(s.b)}</div>
      ${s.steps?`<div class="steps">${s.steps.map(x=>'<div>'+x+'</div>').join('')}</div>`:''}
      ${s.hint?`<div class="hintline">${U.esc(s.hint)}</div>`:''}
      <div class="lockmsg"></div>
      <div class="tf">
        <button class="btn xs" id="tPrev" ${Tut.i===0?'disabled':''}>이전</button>
        ${s.require?`<span class="dim" style="font-size:.8em">안내된 동작을 완료하면 다음 단계로 넘어갑니다.</span>`
          :`<button class="btn xs acc" id="tNext">${last?'튜토리얼 종료':'다음'}</button>`}
        <button class="btn xs" id="tQuit">건너뛰기</button>
        <span class="tutdots">${dots}</span></div>`;
    const p=document.getElementById('tPrev'); if(p) p.onclick=Tut.prev;
    const n=document.getElementById('tNext'); if(n) n.onclick=()=>{ last?Tut.end():Tut.next(); };
    document.getElementById('tQuit').onclick=Tut.end;
    Tut.place();
  },

  /* 이번 단계에서 눌러야 하는 대상을 전부 모은다.
     설명 대상(focus)뿐 아니라 require/allow 로 허용된 조작도 함께 밝혀,
     '눌러야 하는데 어두워서 못 누르는 것처럼 보이는' 상황을 없앤다. */
  targets(st){
    const sel=[];
    if(st.focus) (Array.isArray(st.focus)?st.focus:[st.focus]).forEach(x=>sel.push(x));
    const a=st.allow||{};
    (a.techs||[]).forEach(id=>sel.push(`#techBox [data-tech="${id}"]`));
    (a.stances||[]).forEach(id=>sel.push(`[data-stance="${id}"]`));
    (a.basics||[]).forEach(id=>sel.push(`[data-act="${id}"]`));
    if(st.require&&st.require.type==='tech') sel.push('[data-act="use"]');
    const out=[];
    sel.forEach(q=>{ const el=document.querySelector(q); if(el&&out.indexOf(el)<0) out.push(el); });
    return out;
  },

  place(){
    const st=Tut.step(); if(!st) return;
    const ring=document.getElementById('tutRing'), box=document.getElementById('tutBox');
    const stage=document.getElementById('stage').getBoundingClientRect();
    document.querySelectorAll('.tut-focus').forEach(x=>x.classList.remove('tut-focus'));
    const els=Tut.targets(st);
    els.forEach(el=>el.classList.add('tut-focus'));
    if(!els.length){ ring.classList.add('hide');
      box.style.left=Math.max(12,(stage.width-box.offsetWidth)/2)+'px';
      box.style.top=(stage.height-box.offsetHeight-20)+'px'; return; }

    /* 링은 대상 전체를 감싸는 영역에 두른다 */
    let l=1e9,t=1e9,r=-1e9,bt=-1e9;
    els.forEach(el=>{ const q=el.getBoundingClientRect();
      l=Math.min(l,q.left); t=Math.min(t,q.top); r=Math.max(r,q.right); bt=Math.max(bt,q.bottom); });
    const pad=7;
    ring.classList.remove('hide');
    ring.style.left=(l-stage.left-pad)+'px'; ring.style.top=(t-stage.top-pad)+'px';
    ring.style.width=(r-l+pad*2)+'px'; ring.style.height=(bt-t+pad*2)+'px';

    const bw=box.offsetWidth||400, bh=box.offsetHeight||160;
    let top=bt-stage.top+16;
    if(top+bh>stage.height-10) top=Math.max(10, t-stage.top-bh-16);
    if(top<10) top=Math.min(stage.height-bh-10, bt-stage.top+16);
    let left=l-stage.left+(r-l)/2-bw/2;
    left=U.clamp(left,12,Math.max(12,stage.width-bw-12));
    box.style.left=left+'px'; box.style.top=Math.max(10,top)+'px';
  },
  refresh(){ if(Tut.on) requestAnimationFrame(Tut.place); }
};

/* ==========================================================================================
   [MULTIPLAYER] 방/대기실/WebSocket 클라이언트
   전투 상태는 서버가 판정하며, 클라이언트는 입력과 렌더링만 담당한다.
   ========================================================================================== */
const Net = {
  ws:null, token:'', connected:false, active:false, roomCode:'', roomStatus:'',
  players:[], error:'', notice:'', reconnectTimer:null, connectionKey:'', lastPreset:'direct',
  customBuild:null, pendingCode:'', isHost:false,

  url(){ return `${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws/${Net.roomCode}?token=${encodeURIComponent(Net.token)}`; },
  normalizeCode(value){
    return String(value||'').normalize('NFKC').toUpperCase().replace(/[\s-]/g,'').replace(/[^A-Z2-9]/g,'').slice(0,6);
  },
  adoptSession(data,status){
    clearTimeout(Net.reconnectTimer);
    const old=Net.ws;
    Net.ws=null; Net.connectionKey=''; Net.connected=false;
    if(old){ old.onopen=old.onmessage=old.onclose=old.onerror=null; try{ old.close(1000,'방 전환'); }catch(e){} }
    Net.roomCode=Net.normalizeCode(data.code);
    Net.token=String(data.token||'');
    Net.roomStatus=data.status||status;
    Net.error='';
    Net.saveSession();
    Net.connect();
    UI.renderMulti();
  },
  open(){
    try{ Net.token=sessionStorage.getItem('timeline_pvp_token')||''; }catch(e){}
    try{ Net.roomCode=sessionStorage.getItem('timeline_pvp_room')||''; }catch(e){}
    try{ Net.lastPreset=localStorage.getItem('timeline_pvp_preset')||'direct'; }catch(e){}
    try{ Net.customBuild=JSON.parse(localStorage.getItem('timeline_pvp_build_v1')||'null'); }catch(e){ Net.customBuild=null; }
    try{ Net.pendingCode=Net.normalizeCode(new URL(location.href).searchParams.get('room')||''); }catch(e){}
    if(Net.roomCode&&Net.token) Net.connect(); else Net.health();
    UI.renderMulti();
  },
  async health(){
    try{ const r=await fetch('/api/health'); Net.connected=r.ok; if(!r.ok) throw new Error(); }
    catch(e){ Net.connected=false; Net.error='게임 서버 연결 상태를 확인해 주세요.'; }
    if(App.screen==='multi') UI.renderMulti();
  },
  connect(){
    if(!Net.roomCode||!Net.token) return;
    const key=Net.roomCode+':'+Net.token;
    if(Net.ws && Net.connectionKey===key &&
       (Net.ws.readyState===WebSocket.OPEN||Net.ws.readyState===WebSocket.CONNECTING)) return;
    if(Net.ws){
      const old=Net.ws; Net.ws=null; Net.connectionKey='';
      old.onopen=old.onmessage=old.onclose=old.onerror=null;
      try{ old.close(1000,'새 세션으로 전환'); }catch(e){}
    }
    Net.error='';
    let socket;
    try{ socket=new WebSocket(Net.url()); }catch(e){ Net.error='서버에 연결할 수 없습니다.'; UI.renderMulti(); return; }
    Net.ws=socket; Net.connectionKey=key;
    socket.onopen=()=>{ if(Net.ws!==socket) return; Net.connected=true; if(App.screen==='multi') UI.renderMulti(); };
    socket.onmessage=e=>{
      if(Net.ws!==socket) return;
      try{ Net.receive(JSON.parse(e.data)); }catch(err){ Net.fail('서버 응답을 처리할 수 없습니다.'); }
    };
    socket.onclose=()=>{
      if(Net.ws!==socket) return;
      Net.ws=null; Net.connectionKey=''; Net.connected=false;
      if(Net.active){ Battle.awaitInput=false; UI.renderBattle(); }
      if(App.screen==='multi') UI.renderMulti();
      if(Net.roomCode){ clearTimeout(Net.reconnectTimer); Net.reconnectTimer=setTimeout(()=>Net.connect(),1200); }
    };
    socket.onerror=()=>{ if(Net.ws===socket) Net.fail('멀티플레이 서버 연결 상태를 확인해 주세요.'); };
  },
  send(v){ if(Net.ws&&Net.ws.readyState===WebSocket.OPEN){ Net.ws.send(JSON.stringify(v)); return true; } return false; },
  fail(msg){ Net.error=msg; if(App.screen==='multi') UI.renderMulti(); },
  receive(m){
    if(m.type==='error'){ Net.fail(m.message||'요청을 처리하지 못했습니다.'); return; }
    if(m.type==='room'){
      Net.roomCode=m.code||''; Net.roomStatus=m.status||''; Net.players=m.players||[]; Net.error='';
      Net.isHost=!!m.youAreHost;
      if(m.notice) Net.notice=m.notice;
      if(App.screen!=='battle') UI.showScreen('multi'); else UI.renderMulti(); return;
    }
    if(m.type==='state'){
      Net.roomCode=m.code; Net.roomStatus=m.status; Net.players=m.players||[]; Net.active=!m.state.over;
      Battle.st=m.state; Battle.awaitInput=!!m.yourTurn&&!m.paused&&!m.state.over;
      Battle.selected=null; Battle.empowered=false;
      DB.meta.sideLabel.P=m.you||'나'; DB.meta.sideLabel.E=m.opponent||'상대';
      if(m.state.over){ Net.showResult(m.state.winner===DB.meta.sides.SELF,m.reason); }
      else { if(App.screen!=='battle') UI.showScreen('battle'); else UI.renderBattle(); }
      return;
    }
  },
  rememberPreset(id){ Net.lastPreset=id; try{ localStorage.setItem('timeline_pvp_preset',id); }catch(e){} },
  defaultBuild(){
    const p=DB.setup.presets.find(x=>x.id===Net.lastPreset)||DB.setup.presets[0];
    return {weapon:p.weapon,techs:p.techs.slice(),sigils:p.sigils.slice(),chains:p.chains.slice(),
      traits:[],hp:p.hp,stamina:p.stamina,focus:p.focus};
  },
  saveBuild(build){
    Net.customBuild=JSON.parse(JSON.stringify(build));
    try{ localStorage.setItem('timeline_pvp_build_v1',JSON.stringify(Net.customBuild)); }catch(e){}
    if(Net.roomCode){
      Net.notice='내 덱을 저장했습니다.';
      if(!Net.send({type:'build',build:Net.customBuild})) Net.fail('서버 연결 상태를 확인해 주세요.');
    }
    UI.setupContext='single'; UI.showScreen('multi'); UI.renderMulti();
  },
  editBuild(){
    UI.setupContext='multi';
    UI.setupDraft=JSON.parse(JSON.stringify(Net.customBuild||Net.defaultBuild()));
    UI.showScreen('school');
  },
  shareURL(){
    const u=new URL(location.href); u.search=''; u.hash=''; u.searchParams.set('room',Net.roomCode); return u.toString();
  },
  async copyInvite(){
    const value=Net.shareURL();
    try{ await navigator.clipboard.writeText(value); Net.notice='입장 링크를 복사했습니다.'; }
    catch(e){
      const ta=document.createElement('textarea'); ta.value=value; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); Net.notice='입장 링크를 복사했습니다.';
    }
    UI.renderMulti();
  },
  start(){
    if(!Net.isHost||Net.players.length<2) return;
    Net.notice='게임 시작을 요청했습니다.';
    if(!Net.send({type:'start'})) Net.fail('서버 연결 상태를 확인해 주세요.');
    UI.renderMulti();
  },
  formData(kind){
    const name=(document.getElementById(kind==='join'?'mpJoinName':'mpCreateName')||{}).value||'';
    const preset=(document.getElementById(kind==='join'?'mpJoinPreset':'mpCreatePreset')||{}).value||Net.lastPreset;
    const code=kind==='join'?Net.normalizeCode((document.getElementById('mpCode')||{}).value||''):'';
    Net.rememberPreset(preset); return {name:name.trim().slice(0,18),preset,build:Net.customBuild||null,code};
  },
  formFail(kind,msg){
    const el=document.getElementById(kind==='join'?'mpJoinError':'mpCreateError');
    if(el){ el.textContent=msg; return; }
    Net.fail(msg);
  },
  clearFormError(kind){
    const el=document.getElementById(kind==='join'?'mpJoinError':'mpCreateError');
    if(el) el.textContent='';
  },
  async request(path,body){
    const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.message||'요청을 처리하지 못했습니다.');
    return data;
  },
  saveSession(){ try{ sessionStorage.setItem('timeline_pvp_token',Net.token); sessionStorage.setItem('timeline_pvp_room',Net.roomCode); }catch(e){} },
  clearSession(){ try{ sessionStorage.removeItem('timeline_pvp_token'); sessionStorage.removeItem('timeline_pvp_room'); }catch(e){} },
  async create(test){
    const d=Net.formData('create');
    Net.clearFormError('create');
    if(!d.name) return Net.formFail('create','방을 만들 이름을 입력해 주세요.');
    try{ const x=await Net.request('/api/rooms',{name:d.name,preset:d.preset,build:d.build,test:!!test});
      Net.isHost=true; Net.notice='방을 만들었습니다.'; Net.adoptSession(x,test?'playing':'waiting'); }
    catch(e){ Net.formFail('create',e.message); }
  },
  async join(){
    const d=Net.formData('join');
    Net.clearFormError('join');
    if(!d.name) return Net.formFail('join','방에 입장할 이름을 입력해 주세요.');
    if(d.code.length!==6) return Net.formFail('join','6자리 방 코드를 정확히 입력해 주세요.');
    try{ const x=await Net.request(`/api/rooms/${encodeURIComponent(d.code)}/join`,{name:d.name,preset:d.preset,build:d.build});
      Net.isHost=false; Net.notice='방에 입장했습니다. 방장이 시작할 때까지 기다려 주세요.'; Net.adoptSession(x,'waiting');
      try{ const u=new URL(location.href); u.searchParams.delete('room'); history.replaceState(null,'',u); }catch(e){} }
    catch(e){ Net.formFail('join',e.message); }
  },
  action(action){
    if(!Net.active||!Battle.awaitInput) return;
    Battle.awaitInput=false; UI.renderBattle();
    if(!Net.send({type:'action',action})) { Battle.awaitInput=true; UI.renderBattle(); }
  },
  forfeit(){ Net.send({type:'forfeit'}); },
  leave(){
    Net.send({type:'leave'}); clearTimeout(Net.reconnectTimer);
    const old=Net.ws; Net.ws=null; Net.connectionKey='';
    if(old){ old.onopen=old.onmessage=old.onclose=old.onerror=null; setTimeout(()=>old.close(1000,'방 나가기'),40); }
    Net.active=false; Net.connected=false; Net.roomCode=''; Net.roomStatus=''; Net.players=[]; Net.token=''; Net.isHost=false;
    Net.notice='방에서 나왔습니다.'; Net.clearSession(); UI.showScreen('multi'); Net.health();
  },
  showResult(won,reason){
    const why=reason==='forfeit'?'상대의 포기':(reason==='disconnect'?'상대 연결 종료':'전투 판정');
    document.getElementById('resBody').innerHTML=`<div class="h2">멀티플레이 결과</div>
      <div style="font-size:1.8em;font-weight:850;margin:16px 0;color:var(${won?'--ok':'--dang'})">${won?'승리':'패배'}</div>
      <p class="muted">${U.esc(why)}로 전투가 종료되었습니다.</p>
      <div class="rowwrap" style="margin-top:18px"><button class="btn acc" id="mpAgain">대기실로</button>
      <button class="btn" id="mpTitle">타이틀</button></div>`;
    UI.showScreen('result');
    document.getElementById('mpAgain').onclick=()=>Net.leave();
    document.getElementById('mpTitle').onclick=()=>{ Net.leave(); UI.showScreen('title'); };
  }
};

UI.renderMulti = function(){
  const b=document.getElementById('multiBody'); if(!b) return;
  if(Net.roomCode){
    const waiting=Net.roomStatus==='waiting';
    const ready=waiting&&Net.players.length>=2&&Net.isHost&&Net.connected;
    const link=Net.shareURL();
    const status=Net.error||Net.notice||(Net.players.length<2?'상대 입장을 기다리는 중입니다.':
      (Net.isHost?'두 플레이어가 입장했습니다. 준비되면 게임을 시작하세요.':'방장이 게임을 시작할 때까지 기다려 주세요.'));
    b.innerHTML=`<div class="h2">${waiting?'입장 대기방':'멀티플레이 방'}</div>
      <p class="dim">방 코드나 안전한 입장 링크를 상대에게 전달하세요. 링크에는 세션 토큰이 포함되지 않습니다.</p>
      <div class="room-code">${U.esc(Net.roomCode)}</div>
      <code class="room-link" title="${U.esc(link)}">${U.esc(link)}</code>
      <div class="invite-actions"><button class="btn sm" id="mpCopyCode">코드 복사</button>
        <button class="btn sm acc" id="mpCopyLink">입장 링크 복사</button></div>
      <div class="lobby-players">${Net.players.map((p,i)=>`<div class="lobby-player"><b>${i+1}P</b> · ${U.esc(p.name)}${p.connected===false?' · 재접속 대기':''}</div>`).join('')}</div>
      <p class="lobby-notice" aria-live="polite">${U.esc(Net.notice||'')}</p>
      <p class="net-status ${Net.error?'bad':'ok'}">${U.esc(status)}</p>
      <div class="lobby-actions">${Net.isHost&&waiting?`<button class="btn acc" id="mpStart" ${ready?'':'disabled'}>게임 시작</button>`:''}
        <button class="btn" id="mpLobbyDeck">내 덱 설정</button>
        <button class="btn dang" id="mpLeave">방 나가기</button></div>`;
    document.getElementById('mpCopyCode').onclick=async()=>{ try{ await navigator.clipboard.writeText(Net.roomCode); Net.notice='방 코드를 복사했습니다.'; }catch(e){ Net.notice='코드 복사에 실패했습니다.'; } UI.renderMulti(); };
    document.getElementById('mpCopyLink').onclick=()=>Net.copyInvite();
    const start=document.getElementById('mpStart'); if(start) start.onclick=()=>Net.start();
    document.getElementById('mpLobbyDeck').onclick=()=>Net.editBuild();
    document.getElementById('mpLeave').onclick=()=>Net.leave(); return;
  }
  const presetOpts=DB.setup.presets.map(p=>`<option value="${p.id}" ${p.id===Net.lastPreset?'selected':''}>${U.esc(p.name)} — ${U.esc(p.desc)}</option>`).join('');
  const deck=Net.customBuild;
  const deckSummary=deck?`${deck.techs.length}개 기술 · ${U.esc(DB.weapons[deck.weapon].name)}`:'저장된 덱 없음';
  const pending=Net.pendingCode;
  b.innerHTML=`<div class="h2">1 대 1 PvP</div>
    <p class="muted">각 플레이어가 자신의 덱을 정한 뒤 입장합니다. 2P가 들어와도 자동 시작되지 않으며 방장이 직접 시작합니다.</p>
    <div class="multi-grid">
      <div class="multi-panel create nm-in">
        <div class="multi-panel-head"><span>방 만들기</span><small>1P · 방장</small></div>
        <label for="mpCreateName">방장 이름</label><input id="mpCreateName" maxlength="18" autocomplete="nickname" placeholder="방장 이름">
        <label for="mpCreatePreset">저장된 덱이 없을 때 기본 구성</label><select id="mpCreatePreset">${presetOpts}</select>
        <div class="form-error" id="mpCreateError" role="alert"></div>
        <button class="btn wide acc" id="mpCreate">방 만들기</button>
        <button class="btn wide" id="mpTest" style="margin-top:9px">혼자 테스트하는 임시방</button>
      </div>
      <div class="multi-deck nm-in">
        <div class="multi-panel-head" style="justify-content:center">내 덱</div>
        <p class="dim">${deckSummary}</p>
        <button class="btn acc" id="mpDeck">덱 직접 설정</button>
        <p class="dim">설정한 덱은 이 브라우저에 저장되어 다음 접속에도 사용됩니다.</p>
      </div>
      <div class="multi-panel join nm-in">
        <div class="multi-panel-head"><span>코드 또는 링크로 입장</span><small>2P · 참가자</small></div>
        <label for="mpJoinName">참가자 이름</label><input id="mpJoinName" maxlength="18" autocomplete="nickname" placeholder="참가자 이름">
        <label for="mpJoinPreset">저장된 덱이 없을 때 기본 구성</label><select id="mpJoinPreset">${presetOpts}</select>
        <label for="mpCode">6자리 방 코드</label><input id="mpCode" value="${U.esc(pending)}" maxlength="6" autocapitalize="characters" placeholder="ABC123">
        <div class="form-error" id="mpJoinError" role="alert"></div>
        <button class="btn wide" id="mpJoin">방에 입장</button>
        <p class="dim" style="margin-top:12px">${pending?'공유 링크의 방 코드를 불러왔습니다. 이름을 입력하고 참가하세요.':'방장이 전달한 코드 또는 입장 링크를 사용하세요.'}</p>
      </div>
    </div>
    <p class="net-status ${Net.error?'bad':(Net.connected?'ok':'')}">${Net.error||(Net.connected?'서버 연결됨':'서버 연결 중…')}</p>`;
  document.getElementById('mpDeck').onclick=()=>Net.editBuild();
  document.getElementById('mpCreate').onclick=()=>Net.create(false);
  document.getElementById('mpTest').onclick=()=>Net.create(true);
  document.getElementById('mpJoin').onclick=()=>Net.join();
  document.getElementById('mpCreateName').oninput=()=>Net.clearFormError('create');
  document.getElementById('mpJoinName').oninput=()=>Net.clearFormError('join');
  document.getElementById('mpCode').oninput=e=>{ e.target.value=Net.normalizeCode(e.target.value); Net.pendingCode=e.target.value; Net.clearFormError('join'); };
  document.getElementById('mpCreateName').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); Net.create(false); } };
  document.getElementById('mpJoinName').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); Net.join(); } };
  document.getElementById('mpCode').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); Net.join(); } };
};

/* ==========================================================================================
   [BOOT]
   ========================================================================================== */
(function boot(){
  UI.applySettings();
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>UI.showScreen(b.dataset.nav));
  document.getElementById('setBack').onclick=()=>UI.showScreen(App.backTo);
  document.getElementById('cxBack').onclick=()=>UI.showScreen(App.backTo);
  document.getElementById('multiBack').onclick=()=>{ if(Net.roomCode) Net.leave(); UI.showScreen('title'); };
  document.getElementById('schoolBack').onclick=()=>{
    if(UI.setupContext==='multi'){ UI.setupContext='single'; UI.showScreen('multi'); UI.renderMulti(); }
    else UI.showScreen('title');
  };
  document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') UI.closeModal(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') UI.closeModal(); });
  window.addEventListener('resize',()=>Tut.refresh());
  /* 진행 중에 새로고침하면 확인 창을 띄운다 (브라우저 기본 문구가 사용된다) */
  window.addEventListener('beforeunload',e=>{
    const inPlay = Net.active || Tut.on || (Run.data && (App.screen==='battle'||App.screen==='map'||App.screen==='reward'));
    if(!inPlay) return;
    e.preventDefault(); e.returnValue='';
    return '';
  });
  let invite='';
  try{ invite=Net.normalizeCode(new URL(location.href).searchParams.get('room')||''); }catch(e){}
  if(invite){ Net.pendingCode=invite; UI.showScreen('multi'); Net.open(); }
  else UI.showScreen('title');
})();
</script>
</body>
</html>
