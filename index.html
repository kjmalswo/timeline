/* ==========================================================================================
   [CORE] 유틸
   ========================================================================================== */
const U = {
  clamp:(v,a,b)=> v<a?a:(v>b?b:v),
  floor:v=>Math.floor(v),
  rnd:n=>Math.floor(Math.random()*n),
  pick:a=>a[U.rnd(a.length)],
  shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=U.rnd(i+1);[r[i],r[j]]=[r[j],r[i]];}return r;},
  fmt:(t,o)=>String(t).replace(/\{(\w+)\}/g,(m,k)=>(o&&k in o)?o[k]:m),
  esc:s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
  r2:v=>Math.round(v*100)/100,
  stance:id=>DB.stances.find(s=>s.id===id)||DB.stances[0],
  line:id=>DB.lines[id]||DB.lines.none
};

/* 자세 그래프 최단 거리 — 전환 비용 계산의 기준 */
const StanceDist = (()=>{
  const ids=DB.stances.map(s=>s.id), M={};
  ids.forEach(a=>{
    M[a]={}; ids.forEach(b=>M[a][b]=Infinity); M[a][a]=0;
    const q=[a];
    while(q.length){ const c=q.shift();
      (DB.stanceGraph[c]||[]).forEach(n=>{ if(M[a][n]===Infinity){ M[a][n]=M[a][c]+1; q.push(n); } });
    }
  });
  return M;
})();

/* ==========================================================================================
   [CORE] 전투 — 양측이 동일한 actor 구조를 쓰므로 controller 만 바꾸면 PvP로 확장된다
   ========================================================================================== */
const Battle = {
  st:null, awaitInput:false, selected:null, empowered:false,

  makeActor(side,cfg){
    return {
      side, name:cfg.name,
      hp:cfg.hp, hpMax:cfg.hpMax!=null?cfg.hpMax:cfg.hp,
      stamina:cfg.stamina, staminaMax:cfg.staminaMax, staminaRegen:cfg.staminaRegen,
      focus:cfg.focus||0, focusMax:cfg.focusMax,
      stance:cfg.stance, readyAt:DB.balance.tick.start,
      statuses:{}, techs:cfg.techs.slice(),
      traits:cfg.traits||[], weapon:cfg.weapon||DB.weaponStart, chains:cfg.chains||[],
      milestones:cfg.milestones||[], sigils:cfg.sigils||[], mods:Battle.modsOf(cfg),
      controller:cfg.controller, aiProfile:cfg.aiProfile||null,
      script:cfg.script?cfg.script.slice():null, scriptAt:0,
      moveStacks:{}, moveStackTick:{}, history:[], lastDealtTick:DB.balance.tick.start
    };
  },

  /* ---------- 수정치 스택 ----------
     무기 · 단련 · 전환점은 모두 같은 형식의 mod 객체를 낸다.
     교전 시작 시 한 번 합산해 두고, 이후 모든 계산은 Battle.mod() 한 곳만 본다. */
  buildMods(sources){
    const m={};
    (sources||[]).forEach(o=>{ if(!o) return;
      for(const k in o){ if(typeof o[k]==='number') m[k]=(m[k]||0)+o[k]; } });
    return m;
  },
  modsOf(cfg){
    const src=[(DB.weapons[cfg.weapon||DB.weaponStart]||{}).mod];
    (cfg.traits||[]).forEach(id=>{ if(DB.traits[id]) src.push(DB.traits[id].mod); });
    (cfg.milestones||[]).forEach(id=>{ if(DB.milestones[id]) src.push(DB.milestones[id].mod); });
    return Battle.buildMods(src);
  },
  mod(a,key){ return (a.mods&&a.mods[key])||0; },
  traitSum(a,key){ return Battle.mod(a,key); },

  start(enemyId, playerCfg, onEnd, opt){
    opt=opt||{};
    const diff=Run.difficulty(), e=DB.enemies[enemyId], R=DB.balance.resource;

    const P=Battle.makeActor(DB.meta.sides.SELF,{
      name:DB.meta.sideLabel.P, hp:playerCfg.hp, hpMax:playerCfg.hpMax,
      stamina:R.staminaStart+0, staminaMax:playerCfg.staminaMax,
      staminaRegen:R.staminaRegenPerTick, focusMax:playerCfg.focusMax,
      focus:playerCfg.focusStart||0,
      stance:DB.stanceStart, techs:playerCfg.techs, traits:playerCfg.traits,
      weapon:playerCfg.weapon, chains:playerCfg.chains,
      sigils:playerCfg.sigils, milestones:playerCfg.milestones, controller:'human'
    });
    P.staminaRegen += Battle.traitSum(P,'staminaRegen');
    P.stamina = U.clamp(P.stamina, 0, P.staminaMax);

    const E=Battle.makeActor(DB.meta.sides.FOE,{
      name:e.name, hp:Math.round(e.hp*diff.enemyHpMult), stamina:e.stamina,
      staminaMax:e.staminaMax, staminaRegen:e.staminaRegen, focusMax:e.focusMax,
      stance:e.stance, techs:e.techs, weapon:e.weapon||DB.weaponStart, chains:e.chains||[],
      sigils:e.sigils||[], milestones:e.milestones||[],
      controller:'ai', aiProfile:e.ai, script:e.script
    });

    Battle.st={ tick:DB.balance.tick.start, distance:DB.balance.distance.start,
      actors:{P,E}, queue:[], reactions:[], log:[], seq:0,
      over:false, winner:null, finished:false, onEnd, enemyId, tutorial:!!opt.tutorial };
    Battle.awaitInput=false; Battle.selected=null; Battle.empowered=false;
    Ann.clear();
    Battle.log('start',{foe:e.name},'n');
    Battle.announce('start',{foe:e.name});
    UI.showScreen('battle');
    Battle.loop();
  },

  A:s=>Battle.st.actors[s],
  other:s=>s===DB.meta.sides.SELF?DB.meta.sides.FOE:DB.meta.sides.SELF,
  sideLabel:s=>DB.meta.sideLabel[s],

  /* 알림으로도 띄울 사건 */
  announce(key,vars,side){ if(App.settings.announce!==false) Ann.push(key,vars,side); },

  log(key,vars,cls){
    const s=Battle.st;
    if(App.settings.logDetail==='brief' && cls==='n' && !['start','win','lose','timeout'].includes(key)) return;
    s.log.push({ t:s.tick, text:U.fmt(DB.ui.log[key]||key, vars||{}), cls:cls||'n' });
  },

  /* ---------- 계산 ---------- */
  stacks:(a,k)=>a.statuses[k]||0,
  addStatus(a,k,v){ if(!DB.statuses[k])return; a.statuses[k]=(a.statuses[k]||0)+v; if(a.statuses[k]<=0) delete a.statuses[k]; },
  stripStatus(a,k){ delete a.statuses[k]; },

  effCost(a,def){ return Math.max(DB.balance.clamp.minCost, def.cost + Battle.mod(a,'cost')); },
  effRange(a,def){
    const D=DB.balance.distance;
    let lo=U.clamp(def.range[0]+Battle.mod(a,'rangeMin'),D.min,D.max);
    let hi=U.clamp(def.range[1]+Battle.mod(a,'rangeMax'),D.min,D.max);
    if(hi<lo) hi=lo;
    return [lo,hi];
  },
  effRecovery(a,def){
    return Math.max(DB.balance.clamp.minRecovery, Math.round(def.recovery)+Battle.mod(a,'recovery'));
  },

  castTimeOf(a,def){
    const st=U.stance(a.stance).mod.cast;
    const slow=1+Battle.stacks(a,'slow')*DB.statuses.slow.castPerStack;
    const tr=1+Battle.traitSum(a,'cast');
    return Math.max(DB.balance.clamp.minCast,
      Math.round(def.cast*st*slow*tr) + Battle.mod(a,'cast'));
  },
  recoveryOf(a,def){ return Battle.effRecovery(a,def); },

  /* 공격 방향 × 방어 자세 상성 배율 */
  lineMult(defender, line, attacker){
    if(!line || line==='none') return 1;
    const g=U.stance(defender.stance).guard;
    let v=g[line]!=null?g[line]:1;
    const amp=attacker?Battle.mod(attacker,'lineAmp'):0;   /* 전환점: 상성 차이를 증폭한다 */
    if(amp) v=1+(v-1)*(1+amp);
    return Math.max(0,v);
  },
  dealtMult(a,foe){
    let m=U.stance(a.stance).mod.dealt
      * (1+Battle.stacks(a,'power')*DB.statuses.power.dealtPerStack)
      * (1+Battle.mod(a,'dealt'));
    if(foe && Battle.stacks(foe,'exposed')>0) m*=(1+Battle.traitSum(a,'vsExposed'));
    return m;
  },
  takenMult(a){
    return U.stance(a.stance).mod.taken
      * (1+Battle.stacks(a,'weak')*DB.statuses.weak.takenPerStack
          + Battle.stacks(a,'exposed')*DB.statuses.exposed.takenPerStack)
      * (1+Battle.traitSum(a,'taken'));
  },
  transitionCost(a,to){
    if(a.stance===to) return 0;
    const T=DB.balance.transition;
    const steps=StanceDist[a.stance][to];
    const poise=Battle.stacks(a,'poise')*DB.statuses.poise.transitionPerStack;
    const disc=Battle.mod(a,'transitionDiscount');
    return Math.max(1, steps*T.costPerStep + poise - disc);
  },
  canUse(a,def){
    if(def.stance!=='rear' && a.stance==='rear' && def.stance!=='rear') { /* 후방 제약은 자세 바꾸기으로 해소 */ }
    return true;
  },

  /* ---------- 압박 ---------- */
  pressureIdle:side=>DB.balance.pressure.enabled?(Battle.st.tick-Battle.A(side).lastDealtTick):0,
  pressureAmount:side=>Battle.stacks(Battle.A(side), DB.balance.pressure.status),
  markActivity(reason, side){
    const P=DB.balance.pressure; if(!P.resetOn[reason]||!side) return;
    const a=Battle.A(side); a.lastDealtTick=Battle.st.tick;
    if(Battle.stacks(a,P.status)>0) Battle.stripStatus(a,P.status);
  },
  pressureTick(side){
    const P=DB.balance.pressure; if(!P.enabled) return;
    const a=Battle.A(side), idle=Battle.pressureIdle(side);
    if(idle<P.idleTicksBeforeStart) return;
    if((idle-P.idleTicksBeforeStart)%P.stackEveryTicks!==0) return;
    if(Battle.stacks(a,P.status)>=P.maxStacks) return;
    const before=Battle.stacks(a,P.status);
    Battle.addStatus(a,P.status,P.stacksPerApply);
    const cls=side===DB.meta.sides.SELF?'s':'f';
    if(before===0){ Battle.log('pressureStart',{side:Battle.sideLabel(side)},cls);
      Battle.announce('pressure',{v:Battle.stacks(a,P.status)},side); }
    Battle.log('pressure',{side:Battle.sideLabel(side),v:Battle.stacks(a,P.status)},cls);
  },

  /* ---------- 시간 ---------- */
  tickForward(dt){
    const s=Battle.st;
    for(let i=0;i<dt;i++){
      s.tick++;
      for(const side of [DB.meta.sides.SELF,DB.meta.sides.FOE]){
        const a=Battle.A(side);
        a.stamina=U.clamp(a.stamina + a.staminaRegen*U.stance(a.stance).mod.staminaRegen, 0, a.staminaMax);
        a.focus=U.clamp(a.focus+DB.balance.resource.focusRegenPerTick,0,a.focusMax);
        Battle.pressureTick(side);
        const bl=Battle.stacks(a,'bleed');
        if(bl>0){
          const d=bl*DB.statuses.bleed.perTickDamagePerStack;
          a.hp=Math.max(0,a.hp-d);
          Battle.markActivity('statusDamage', Battle.other(side));
          Battle.log('bleed',{side:Battle.sideLabel(side),v:d}, side===DB.meta.sides.SELF?'s':'f');
        }
        for(const k in DB.statuses){ const dc=DB.statuses[k].decayPerTick; if(dc>0&&a.statuses[k]) Battle.addStatus(a,k,-dc); }
      }
      s.reactions=s.reactions.filter(r=>r.until>s.tick);
      if(Battle.checkEnd()) return;
    }
  },
  resolveDue(){
    const s=Battle.st; let g=0;
    while(!s.over && g++<DB.balance.loop.maxIterations){
      const due=s.queue.filter(q=>q.status==='pending'&&q.resolveAt<=s.tick)
                       .sort((a,b)=>a.resolveAt-b.resolveAt||a.seq-b.seq);
      if(!due.length) break;
      Battle.resolveEntry(due[0]);
    }
  },
  advanceTo(target){
    const s=Battle.st; Battle.resolveDue(); if(s.over) return;
    let g=0;
    while(s.tick<target && !s.over && g++<DB.balance.loop.maxIterations){
      let next=target;
      for(const q of s.queue) if(q.status==='pending'&&q.resolveAt>s.tick&&q.resolveAt<next) next=q.resolveAt;
      Battle.tickForward(next-s.tick);
      if(s.over) return;
      Battle.resolveDue();
    }
  },

  resolveEntry(q){
    const s=Battle.st; q.status='resolved';
    const lbl=Battle.sideLabel(q.owner), cls=q.owner===DB.meta.sides.SELF?'s':'f';
    const needRange=(q.onHit||[]).length>0;
    if(needRange && DB.balance.combat.missOnRangeFail){
      if(s.distance<q.range[0]||s.distance>q.range[1]){
        Battle.log('miss',{side:lbl,tech:q.name,dist:DB.balance.distance.labels[s.distance]},'n');
        Battle.announce('miss',{tech:q.name,dist:DB.balance.distance.labels[s.distance]},q.owner);
        return;
      }
    }
    Battle.log('resolve',{side:lbl,tech:q.name},cls);
    Battle.announce('resolve',{tech:q.name},q.owner);
    if((q.onHit||[]).some(e=>e.k==='damage')) Battle.markActivity('attackResolvedInRange', q.owner);
    const sg=Battle.sigilBonus(q);
    if(sg.names.length){
      Battle.log('sigil',{side:lbl,name:sg.names.join(' · ')},cls);
      Battle.announce('sigil',{name:sg.names.join(' · ')},q.owner);
    }
    Battle.applyEffects(q.owner, q.onHit||[], q.line, sg);
    if(sg.focus){ const me=Battle.A(q.owner); me.focus=U.clamp(me.focus+sg.focus,0,me.focusMax); }
    if(sg.bleed) Battle.addStatus(Battle.A(Battle.other(q.owner)),'bleed',sg.bleed);
  },

  /* ---------- 시간축 각인 ----------
     '무엇을 쓰는가'가 아니라 '몇 틱에 터지는가'를 보고 조건에 맞는 각인을 모은다. */
  sigilBonus(q){
    const s=Battle.st, a=Battle.A(q.owner);
    const out={ damage:0, focus:0, bleed:0, names:[] };
    if(!a.sigils||!a.sigils.length) return out;
    const sameTick=s.queue.filter(x=>x.owner===q.owner&&x.resolveAt===q.resolveAt
      &&(x.onHit||[]).some(e=>e.k==='damage')).length;
    a.sigils.forEach(id=>{
      const g=DB.sigils[id]; if(!g) return;
      let ok=false;
      switch(g.cond){
        case 'tickParity': ok=(q.resolveAt%2)===g.v; break;
        case 'tickBefore': ok=q.resolveAt<g.v; break;
        case 'tickAfter': ok=q.resolveAt>=g.v; break;
        case 'castAtMost': ok=(q.cast||0)<=g.v; break;
        case 'castAtLeast': ok=(q.cast||0)>=g.v; break;
        case 'sameTick': ok=sameTick>=g.v; break;
        case 'distanceAt': ok=s.distance===g.v; break;
      }
      if(!ok) return;
      out.damage+=g.bonus.damage||0; out.focus+=g.bonus.focus||0; out.bleed+=g.bonus.bleed||0;
      out.names.push(g.name);
    });
    return out;
  },

  applyEffects(owner, effects, line, bonus){
    const s=Battle.st, me=Battle.A(owner), foe=Battle.A(Battle.other(owner));
    const lm=Battle.sideLabel(owner), lf=Battle.sideLabel(Battle.other(owner));
    const cm=owner===DB.meta.sides.SELF?'s':'f', cf=owner===DB.meta.sides.SELF?'f':'s';
    for(const ef of effects){
      if(s.over) return;
      switch(ef.k){
        case 'damage':{
          let base=ef.v;
          if(ef.bonusFoeHpBelow && foe.hp<=foe.hpMax*ef.bonusFoeHpBelow.ratio) base*=ef.bonusFoeHpBelow.mult;
          base += Battle.stacks(foe,'mark')*DB.statuses.mark.flatPerStack;
          if(bonus&&bonus.damage) base += bonus.damage;
          const lmul=Battle.lineMult(foe, line, me);
          if(line && line!=='none' && lmul!==1){
            Battle.log('multi',{side:lf,line:U.line(line).name,stance:U.stance(foe.stance).name,v:U.r2(lmul)},'n');
            s.lastMultNote=`${U.line(line).name} 대 ${U.stance(foe.stance).name} <span class="mult ${lmul>1?'up':'dn'}">${U.r2(lmul)}배</span>`;
          } else s.lastMultNote='';
          let d=base*Battle.dealtMult(me,foe)*Battle.takenMult(foe)*lmul*DB.balance.damage.globalScale;
          d=Math.max(DB.balance.damage.minimum,U.floor(d));
          Battle.dealDamage(foe,d,!!ef.pierce,owner);
          if(Battle.stacks(me,'power')>0&&DB.statuses.power.consumeOnHit) Battle.stripStatus(me,'power');
          if(Battle.stacks(foe,'mark')>0&&DB.statuses.mark.consumeOnHit) Battle.stripStatus(foe,'mark');
          break; }
        case 'heal':{ const t=ef.t==='foe'?foe:me; t.hp=U.clamp(t.hp+ef.v,0,t.hpMax);
          Battle.log('heal',{side:ef.t==='foe'?lf:lm,v:ef.v}, ef.t==='foe'?cf:cm); break; }
        case 'status':{ const t=ef.t==='foe'?foe:me;
          let v=ef.v;
          if(ef.s==='guard'&&ef.t!=='foe') v=Math.round(v*(1+Battle.traitSum(me,'guardGain')));
          Battle.addStatus(t,ef.s,v);
          Battle.log(ef.s==='guard'?'guard':'status',
            {side:ef.t==='foe'?lf:lm, st:DB.statuses[ef.s].name, v}, ef.t==='foe'?cf:cm); break; }
        case 'strip':{ const t=ef.t==='foe'?foe:me;
          if(t.statuses[ef.s]){ Battle.stripStatus(t,ef.s);
            Battle.log('strip',{side:ef.t==='foe'?lf:lm,st:DB.statuses[ef.s].name}, ef.t==='foe'?cf:cm); } break; }
        case 'move':{ const D=DB.balance.distance, b=s.distance;
          s.distance=U.clamp(s.distance+ef.v,D.min,D.max);
          if(b!==s.distance) Battle.log('move',{v:D.labels[s.distance]},'n'); break; }
        case 'stamina':{ const t=ef.t==='foe'?foe:me; t.stamina=U.clamp(t.stamina+ef.v,0,t.staminaMax); break; }
        case 'focus':{ const t=ef.t==='foe'?foe:me; t.focus=U.clamp(t.focus+ef.v,0,t.focusMax); break; }
        case 'delayQueue': case 'cancelQueue': case 'hasten':{
          const tgt=ef.t==='foe'?Battle.other(owner):owner;
          const list=s.queue.filter(q=>q.status==='pending'&&q.owner===tgt)
                            .sort((a,b)=>a.resolveAt-b.resolveAt).slice(0,ef.n||1);
          const tl=Battle.sideLabel(tgt), tc=tgt===DB.meta.sides.SELF?'s':'f';
          if(ef.k==='delayQueue'){ list.forEach(q=>q.resolveAt+=ef.v);
            if(list.length) Battle.log('delayQueue',{side:tl,v:ef.v},tc); }
          else if(ef.k==='hasten'){ list.forEach(q=>q.resolveAt=Math.max(s.tick,q.resolveAt-ef.v));
            if(list.length) Battle.log('hasten',{side:tl,v:ef.v},tc); }
          else list.forEach(q=>{ q.status='cancelled'; Battle.log('cancelled',{side:tl,tech:q.name},tc);
            Battle.announce('cancelled',{tech:q.name},tgt); });
          break; }
        case 'reaction':
          s.reactions.push({ owner, until:s.tick+ef.window, absorb:ef.absorb||0,
            reduce:ef.reduce||0, trigger:ef.trigger, effects:ef.effects||[] });
          break;
      }
      Battle.checkEnd();
    }
  },

  dealDamage(target,dmg,pierce,fromSide){
    const s=Battle.st, lbl=Battle.sideLabel(target.side);
    const cls=target.side===DB.meta.sides.SELF?'s':'f';
    const rx=s.reactions.filter(r=>r.owner===target.side&&r.trigger==='onDamaged'&&r.until>s.tick);
    if(rx.length){
      const r=rx[0];
      if(r.reduce>0) dmg=U.floor(dmg*(1-r.reduce));
      if(r.absorb>0){ const u=Math.min(r.absorb,dmg); dmg-=u; r.absorb-=u; }
      Battle.log('reaction',{side:lbl},cls);
      Battle.announce('reaction',{},target.side);
      s.reactions=s.reactions.filter(x=>x!==r);
      if(r.effects.length) Battle.applyEffects(target.side, r.effects.map(e=>Object.assign({},e)), null);
      if(s.over) return;
    }
    if(!pierce){ const g=Battle.stacks(target,'guard');
      if(g>0){ const u=Math.min(g,dmg); Battle.addStatus(target,'guard',-u); dmg-=u; } }
    dmg=Math.max(DB.balance.damage.minimum,U.floor(dmg));
    target.hp=Math.max(0,target.hp-dmg);
    if(dmg>0) Battle.markActivity('damageDealt', fromSide||Battle.other(target.side));
    Battle.log('damage',{side:lbl,v:dmg},cls);
    if(dmg>0) Battle.announce('damage',{v:dmg,extra:s.lastMultNote||''},target.side);
    s.lastMultNote='';
    UI.flash(target.side);
    Battle.checkEnd();
  },

  /* ---------- 행동 ---------- */
  changeStance(side,to){
    const a=Battle.A(side); if(a.stance===to) return false;
    const c=Battle.transitionCost(a,to);
    if(a.stamina<c) return false;
    a.stamina-=c; a.stance=to;
    Battle.log('stance',{side:Battle.sideLabel(side),v:U.stance(to).name}, side===DB.meta.sides.SELF?'s':'f');
    return true;
  },

  useTech(side, techId, empowered){
    const s=Battle.st, a=Battle.A(side), def=DB.techs[techId];
    if(!def || a.techs.indexOf(techId)<0) return false;
    if(a.stance!==def.stance){ if(!Battle.changeStance(side,def.stance)) return false; }
    const emp = empowered && def.empower && DB.balance.empower.enabled;
    const cost=Battle.effCost(a,def), fcost=emp?def.empower.focus:0;
    if(a.stamina<cost||a.focus<fcost) return false;
    a.stamina-=cost; a.focus-=fcost;

    const onPlay = emp&&def.empower.onPlay?def.empower.onPlay:(def.onPlay||[]);
    const onHit  = emp&&def.empower.onHit ?def.empower.onHit :(def.onHit||[]);
    if(onPlay.length) Battle.applyEffects(side,onPlay,null);
    if(s.over) return true;

    const name=def.name+(emp?' (강화)':'');
    if(onHit.length){
      const cast=Battle.castTimeOf(a,def);
      s.queue.push({ seq:++s.seq, owner:side, techId, name, line:def.line, onHit, cast,
        resolveAt:s.tick+cast, status:'pending', range:Battle.effRange(a,def) });
      Battle.log('queue',{side:Battle.sideLabel(side),tech:name,at:s.tick+cast}, side===DB.meta.sides.SELF?'s':'f');
      Battle.announce('queue',{tech:name,at:s.tick+cast},side);
      if(cast===0) Battle.resolveDue();
    }else Battle.log('resolve',{side:Battle.sideLabel(side),tech:name}, side===DB.meta.sides.SELF?'s':'f');

    const fromStance=def.stance;
    a.stance=def.to;
    a.readyAt=s.tick+Battle.recoveryOf(a,def);
    Battle.fireChains(side, fromStance, def.to);
    return true;
  },

  /* 연계 — 이번 기술이 만든 자세 경로와 일치하는 연계를 발동시킨다 */
  fireChains(side, from, to){
    const a=Battle.A(side); if(!a.chains||!a.chains.length) return;
    a.chains.forEach(id=>{
      const c=DB.chains[id]; if(!c||c.from!==from||c.to!==to) return;
      Battle.log('chain',{side:Battle.sideLabel(side),name:c.name}, side===DB.meta.sides.SELF?'s':'f');
      Battle.announce('chain',{name:c.name},side);
      Battle.applyEffects(side, c.effects.map(e=>Object.assign({},e)), null);
    });
  },

  basic(side,id){
    const s=Battle.st,a=Battle.A(side),B=DB.balance.basic,D=DB.balance.distance;
    const lbl=Battle.sideLabel(side),cls=side===DB.meta.sides.SELF?'s':'f';
    if(id===B.wait.id){
      a.stamina=U.clamp(a.stamina+B.wait.staminaGain,0,a.staminaMax);
      a.focus=U.clamp(a.focus+B.wait.focusGain,0,a.focusMax);
      a.readyAt=s.tick+B.wait.recovery; Battle.log('wait',{side:lbl},cls); return true;
    }
    const cfg = id===B.approach.id?B.approach:(id===B.retreat.id?B.retreat:null);
    if(!cfg) return false;
    const cost=Battle.moveCost(a,cfg);
    if(a.stamina<cost) return false;
    a.stamina-=cost;
    if(cfg.escalationPerUse){ a.moveStacks[cfg.id]=(a.moveStacks[cfg.id]||0)+1; a.moveStackTick[cfg.id]=s.tick; }
    s.distance=U.clamp(s.distance+cfg.move,D.min,D.max);
    a.readyAt=s.tick+cfg.recovery;
    Battle.log(id,{side:lbl},cls);
    if(cost>cfg.staminaCost) Battle.log('retreatCost',{side:lbl,v:cost},cls);
    Battle.log('move',{v:D.labels[s.distance]},'n');
    return true;
  },
  moveCost(a,cfg){
    if(!cfg.escalationPerUse) return cfg.staminaCost;
    const s=Battle.st,last=a.moveStackTick[cfg.id];
    let st=a.moveStacks[cfg.id]||0;
    if(last!=null&&cfg.escalationDecayTicks>0) st=Math.max(0, st-Math.floor((s.tick-last)/cfg.escalationDecayTicks));
    a.moveStacks[cfg.id]=st;
    return cfg.staminaCost+Math.min(cfg.escalationMax, st*cfg.escalationPerUse);
  },
  note(side,key){ const a=Battle.A(side),L=DB.ai.stall.historyLength;
    a.history.push(key); if(a.history.length>L) a.history.shift(); },

  /* ---------- 종료 ---------- */
  finishByTimeout(){
    const s=Battle.st,P=Battle.A(DB.meta.sides.SELF),E=Battle.A(DB.meta.sides.FOE);
    s.over=true; Battle.log('timeout',{},'n'); Battle.announce('timeout',{});
    s.winner=(P.hp/P.hpMax)>=(E.hp/E.hpMax)?DB.meta.sides.SELF:DB.meta.sides.FOE;
    Battle.log(s.winner===DB.meta.sides.SELF?'win':'lose',{},'n');
  },
  checkEnd(){
    const s=Battle.st; if(s.over) return true;
    const P=Battle.A(DB.meta.sides.SELF),E=Battle.A(DB.meta.sides.FOE);
    if(P.hp<=0||E.hp<=0){ s.over=true;
      s.winner=(E.hp<=0&&P.hp>0)?DB.meta.sides.SELF:DB.meta.sides.FOE;
      Battle.log(s.winner===DB.meta.sides.SELF?'win':'lose',{},'n');
      Battle.announce(s.winner===DB.meta.sides.SELF?'win':'lose',{}); return true; }
    if(s.tick>DB.balance.tick.maxTickGuard){ Battle.finishByTimeout(); return true; }
    return false;
  },
  finish(state){
    const s=state||Battle.st; if(!s||s.finished) return;
    s.finished=true; const cb=s.onEnd; s.onEnd=null;
    if(cb) cb(s.winner===DB.meta.sides.SELF, s.actors[DB.meta.sides.SELF].hp);
  },

  loop(){
    const s=Battle.st; let guard=0;
    const done=()=>{ UI.renderBattle(); setTimeout(()=>Battle.finish(s), DB.balance.loop.aiDelayMs); };
    const step=()=>{
      if(Battle.st!==s) return;
      if(s.over){ done(); return; }
      if(guard++>DB.balance.loop.maxIterations){ Battle.finishByTimeout(); done(); return; }
      const P=Battle.A(DB.meta.sides.SELF),E=Battle.A(DB.meta.sides.FOE);
      const active=(P.readyAt<=E.readyAt)?DB.meta.sides.SELF:DB.meta.sides.FOE;
      Battle.advanceTo(Battle.A(active).readyAt);
      if(s.over){ done(); return; }
      if(Battle.A(active).controller==='human'){ Battle.awaitInput=true; UI.renderBattle(); return; }
      UI.renderBattle();
      const d=App.settings.aiSpeed==='fast'?DB.balance.loop.aiDelayFastMs:DB.balance.loop.aiDelayMs;
      setTimeout(()=>{ if(Battle.st!==s) return; AI.act(active); step(); }, App.settings.animations?d:0);
    };
    step();
  },

  humanAct(fn){
    if(!Battle.awaitInput) return;
    if(fn()===false) return;
    Battle.awaitInput=false; Battle.selected=null; Battle.empowered=false;
    Battle.loop();
  }
};

/* ==========================================================================================
   [AI] 점수 기반 선택 — 가중치는 DB.ai.profiles, 자세 상성까지 평가한다
   ========================================================================================== */
const AI = {
  act(side){
    const a=Battle.A(side);
    if(a.script){ return AI.runScript(side); }
    const w=DB.ai.profiles[a.aiProfile]||DB.ai.profiles.master;
    const noise=Run.difficulty().aiNoise;
    let best=null,bs=-Infinity;
    for(const o of AI.options(side)){
      const sc=AI.score(side,o,w)*(1+(Math.random()*2-1)*noise);
      if(sc>bs){ bs=sc; best=o; }
    }
    if(!best) best={kind:'basic',id:DB.balance.basic.wait.id};
    if(best.kind==='tech'){ Battle.note(side,'tech'); Battle.useTech(side,best.id,best.emp); }
    else { Battle.note(side,best.id); Battle.basic(side,best.id); }
  },

  /* 대본형 — 튜토리얼 상대 */
  runScript(side){
    const a=Battle.A(side), s=Battle.st;
    let guard=0;
    while(guard++<a.script.length+1){
      const id=a.script[a.scriptAt % a.script.length]; a.scriptAt++;
      if(id==='wait'){ Battle.basic(side,DB.balance.basic.wait.id); return; }
      const def=DB.techs[id];
      const need=Battle.transitionCost(a,def.stance)+Battle.effCost(a,def);
      const rg=Battle.effRange(a,def);
      const inR=s.distance>=rg[0]&&s.distance<=rg[1];
      if(a.stamina>=need && (inR||!(def.onHit||[]).length)){ Battle.useTech(side,id,false); return; }
      if(!inR && (def.onHit||[]).length){
        const mid=Math.round((rg[0]+rg[1])/2);
        if(s.distance>mid && Battle.basic(side,DB.balance.basic.approach.id)) return;
        if(s.distance<mid && Battle.basic(side,DB.balance.basic.retreat.id)) return;
      }
    }
    Battle.basic(side,DB.balance.basic.wait.id);
  },

  options(side){
    const a=Battle.A(side),B=DB.balance.basic,D=DB.balance.distance,s=Battle.st;
    const out=[{kind:'basic',id:B.wait.id}];
    if(s.distance>D.min && a.stamina>=Battle.moveCost(a,B.approach)) out.push({kind:'basic',id:B.approach.id});
    if(s.distance<D.max && a.stamina>=Battle.moveCost(a,B.retreat)) out.push({kind:'basic',id:B.retreat.id});
    a.techs.forEach(id=>{
      const def=DB.techs[id]; if(!def) return;
      const tc=Battle.transitionCost(a,def.stance);
      if(a.stamina>=tc+Battle.effCost(a,def)) out.push({kind:'tech',id,def,emp:false,tc});
      if(def.empower && a.stamina>=tc+Battle.effCost(a,def) && a.focus>=def.empower.focus)
        out.push({kind:'tech',id,def,emp:true,tc});
    });
    return out;
  },

  incoming(side){
    const s=Battle.st,f=Battle.other(side);
    return s.queue.filter(q=>q.status==='pending'&&q.owner===f&&q.resolveAt<=s.tick+DB.ai.incomingLookahead);
  },
  threat(side, stanceOverride){
    const a=Battle.A(side), keep=a.stance;
    if(stanceOverride) a.stance=stanceOverride;
    let t=0;
    AI.incoming(side).forEach(q=>{ const m=Battle.lineMult(a,q.line);
      (q.onHit||[]).forEach(e=>{ if(e.k==='damage') t+=e.v*m; }); });
    a.stance=keep; return t;
  },
  evadeValue(side,nd){
    const s=Battle.st; let saved=0;
    AI.incoming(side).forEach(q=>{
      const now=s.distance>=q.range[0]&&s.distance<=q.range[1];
      const nxt=nd>=q.range[0]&&nd<=q.range[1];
      (q.onHit||[]).forEach(e=>{ if(e.k!=='damage') return;
        if(now&&!nxt) saved+=e.v; if(!now&&nxt) saved-=e.v; });
    });
    return saved;
  },
  stallPenalty(side,key,w){
    const S=DB.ai.stall; if(S.appliesTo.indexOf(key)<0) return 0;
    return Battle.A(side).history.filter(h=>h===key).length*S.penaltyPerRepeat*w.wStall;
  },
  estimate(side,effects,line){
    const me=Battle.A(side),foe=Battle.A(Battle.other(side));
    let dmg=0,heal=0,guard=0,status=0,sta=0,foc=0,move=0,ctrl=0;
    for(const ef of (effects||[])){
      switch(ef.k){
        case 'damage':{ let b=ef.v;
          if(ef.bonusFoeHpBelow&&foe.hp<=foe.hpMax*ef.bonusFoeHpBelow.ratio) b*=ef.bonusFoeHpBelow.mult;
          b+=Battle.stacks(foe,'mark')*DB.statuses.mark.flatPerStack;
          let d=b*Battle.dealtMult(me,foe)*Battle.takenMult(foe)*Battle.lineMult(foe,line,me)*DB.balance.damage.globalScale;
          if(!ef.pierce) d=Math.max(0,d-Battle.stacks(foe,'guard'));
          dmg+=d; break; }
        case 'heal': heal+=ef.v; break;
        case 'status':
          if(ef.s==='guard') guard+=ef.v;
          else if(ef.t==='foe') status+=ef.v*(ef.s==='bleed'?DB.statuses.bleed.perTickDamagePerStack:1);
          else if(ef.s==='weak') status-=ef.v; else status+=ef.v;
          break;
        case 'stamina': sta+=(ef.t==='foe'?-ef.v:ef.v); break;
        case 'focus': foc+=ef.v; break;
        case 'move': move+=ef.v; break;
        case 'delayQueue': case 'cancelQueue': case 'hasten': ctrl+=DB.ai.incomingLookahead; break;
        case 'reaction': guard+=(ef.absorb||0)+(ef.reduce||0)*DB.ai.incomingLookahead; break;
      }
    }
    return {dmg,heal,guard,status,sta,foc,move,ctrl};
  },

  score(side,o,w){
    const s=Battle.st,a=Battle.A(side),foe=Battle.A(Battle.other(side));
    const B=DB.balance.basic,D=DB.balance.distance,PA=DB.ai.pressureAversion;
    const press=Battle.pressureAmount(side);
    let sc=0;

    if(o.kind==='basic'){
      if(o.id===B.wait.id){
        sc+=B.wait.staminaGain*w.wStamina+B.wait.focusGain*w.wFocus;
        sc-=B.wait.recovery*w.wTempo;
        sc-=AI.threat(side)*w.wRisk*(B.wait.recovery/DB.ai.incomingLookahead);
        sc-=Math.abs(s.distance-w.prefDist)*DB.ai.distancePenaltyPerStep;
        sc-=press*B.wait.recovery*w.wPressure*PA.waitMult;
      }else{
        const cfg=o.id===B.approach.id?B.approach:B.retreat;
        const nd=U.clamp(s.distance+cfg.move,D.min,D.max);
        sc+=AI.evadeValue(side,nd)*w.wEvade;
        sc-=Math.abs(nd-w.prefDist)*DB.ai.distancePenaltyPerStep*w.wRangeFit;
        sc-=cfg.recovery*w.wTempo+Battle.moveCost(a,cfg)*w.wStamina;
        sc-=press*cfg.recovery*w.wPressure*(o.id===B.retreat.id?PA.retreatMult:1);
        a.techs.forEach(id=>{ const d=DB.techs[id];
          if(!d||!(d.onHit||[]).some(e=>e.k==='damage')) return;
          const rg=Battle.effRange(a,d);
          if(nd>=rg[0]&&nd<=rg[1]) sc+=w.wRangeFit; });
      }
      sc-=AI.stallPenalty(side,o.id,w);
      return sc;
    }

    const def=o.def, emp=o.emp;
    const onPlay=emp&&def.empower.onPlay?def.empower.onPlay:(def.onPlay||[]);
    const onHit =emp&&def.empower.onHit ?def.empower.onHit :(def.onHit||[]);
    const est=AI.estimate(side,[...onPlay,...onHit],def.line);
    const keep=a.stance; a.stance=def.stance;
    const cast=Battle.castTimeOf(a,def); a.stance=keep;
    const rec=Battle.recoveryOf(a,def);
    const nd=U.clamp(s.distance+est.move,D.min,D.max);
    const rgT=Battle.effRange(a,def);
    const willHit=onHit.length===0||(nd>=rgT[0]&&nd<=rgT[1]);

    if(onHit.length&&!willHit) sc-=w.wRangeFit*2; else if(onHit.length) sc+=w.wRangeFit;
    sc+=(willHit?est.dmg:0)*w.wDamage;
    /* 막기는 다가오는 위협만큼만 값을 매긴다 */
    const GV=DB.ai.guardValue, thr=AI.threat(side);
    const gv=Math.min(est.guard*GV.cap, thr) + Math.max(0,est.guard-thr)*GV.idleRatio;
    sc+=est.heal*w.wDamage*0.8+gv*w.wGuard+est.status*w.wStatus;
    sc+=est.sta*w.wStamina+est.foc*w.wFocus;
    sc+=est.ctrl*w.wStatus*(AI.threat(side)>0?1.4:0.25);
    sc+=AI.evadeValue(side,nd)*w.wEvade*0.6;
    sc-=(Battle.effCost(a,def)+o.tc*w.wTrans+(emp?def.empower.focus*1.2:0))*w.wStamina;
    sc-=rec*w.wTempo+cast*w.wTempo*0.35;
    sc-=press*(rec+cast)*w.wPressure*PA.techMult;
    if(press>0&&willHit&&est.dmg>0) sc+=press*w.wPressure;
    /* 사용 후 자세가 상대 예고에 얼마나 약점되는지 */
    const after=AI.threat(side,def.to), now=AI.threat(side,a.stance);
    sc-=(after-now)*w.wStanceSafe;
    if(willHit&&est.dmg>=foe.hp) sc+=w.wKill;
    if(a.hp/a.hpMax<DB.ai.lowHpRatio) sc+=est.guard*w.wGuard*DB.ai.lowHpGuardBonus;
    return sc;
  }
};

/* ==========================================================================================
   [RUN] 진행 관리
   ========================================================================================== */
const Run = {
  data:null,
  difficulty(){
    return DB.difficulties.find(d=>d.id===(Run.data?Run.data.difficulty:App.settings.difficulty))
        || DB.difficulties.find(d=>d.id===DB.difficultyDefault);
  },

  /* 초기 빌드 구성 결과로 진행을 시작한다 */
  createFromSetup(d){
    const SU=DB.setup, R=DB.balance.resource;
    const hp=SU.base.hp + d.hp*SU.step.hp;
    Run.data={
      difficulty:App.settings.difficulty, school:'custom',
      hp, hpMax:hp,
      staminaMax:SU.base.stamina + d.stamina*SU.step.stamina,
      focusMax:SU.base.focus + d.focus*SU.step.focus,
      techs:d.techs.slice(), traits:d.traits.slice(), weapon:d.weapon,
      chains:d.chains.slice(), sigils:d.sigils.slice(), milestones:[],
      parts:DB.map.supply.startParts, layer:0, cleared:0,
      map:Run.genMap(), pending:null
    };
    Run.save();
  },

  create(schoolId){
    const sc=DB.schools.find(s=>s.id===schoolId)||DB.schools[0], R=DB.balance.resource;
    Run.data={
      difficulty:App.settings.difficulty, school:sc.id,
      hp:R.hpDefault+sc.hpBonus, hpMax:R.hpDefault+sc.hpBonus,
      staminaMax:R.staminaMax+sc.staminaBonus,
      techs:sc.techs.slice(), traits:[], weapon:sc.weapon||DB.weaponStart, chains:[],
      sigils:[], milestones:[],
      parts:DB.map.supply.startParts, layer:0, cleared:0,
      map:Run.genMap(), pending:null
    };
    Run.save();
  },

  genMap(){
    return DB.map.layers.map((L,li)=>{
      const nodes=[],used={};
      for(let i=0;i<L.count;i++){
        const type=L.types[i%L.types.length], def=DB.map.nodeTypes[type];
        let enemy=null;
        if(def.pool.length){
          const fresh=def.pool.filter(x=>!used[x]);
          enemy=U.pick(fresh.length?fresh:def.pool); used[enemy]=true;
        }
        nodes.push({type,enemy,done:false,li,i});
      }
      return nodes;
    });
  },

  /* 단련 반영 최종 능력치 */
  /* 단련과 전환점을 모두 합산한 최종 능력치 */
  stat(key,base){
    let v=base;
    (Run.data.traits||[]).forEach(id=>{ const t=DB.traits[id]; if(t&&t.mod[key]!=null) v+=t.mod[key]; });
    (Run.data.milestones||[]).forEach(id=>{ const t=DB.milestones[id]; if(t&&t.mod[key]!=null) v+=t.mod[key]; });
    return v;
  },
  slotCap(stanceId){
    const S=DB.balance.slots; let c=S.perStanceBase;
    (Run.data.traits||[]).forEach(id=>{ const t=DB.traits[id]; if(t&&t.mod.slot===stanceId) c++; });
    return Math.min(S.perStanceMax,c);
  },
  techsOf(stanceId){ return Run.data.techs.filter(id=>DB.techs[id]&&DB.techs[id].stance===stanceId); },

  playerCfg(){
    const d=Run.data;
    return { hp:d.hp, hpMax:Run.stat('hpMax',d.hpMax),
      staminaMax:Run.stat('staminaMax',d.staminaMax),
      focusMax:Run.stat('focusMax',Run.data.focusMax||DB.balance.resource.focusMax),
      focusStart:Run.stat('focusStart',DB.balance.resource.focusStart),
      techs:d.techs, traits:d.traits, weapon:d.weapon||DB.weaponStart, chains:d.chains||[],
      sigils:d.sigils||[], milestones:d.milestones||[] };
  },

  enter(node){
    Run.data.pending={node};
    if(['battle','elite','boss'].includes(node.type)){
      Battle.start(node.enemy, Run.playerCfg(), (won,hp)=>Run.afterBattle(won,hp,node));
    } else if(node.type==='rest') UI.renderRest(node);
    else if(node.type==='turn') UI.renderTurn(node);
    else UI.renderSupply(node);
  },

  afterBattle(won,hpLeft,node){
    if(!Run.data||!Run.data.pending||Run.data.pending.node!==node) return;
    Run.data.hp=Math.max(1,hpLeft);
    if(!won){ UI.renderResult(false); return; }
    Run.heal(Math.round(Run.stat('hpMax',Run.data.hpMax)*DB.balance.resource.postBattleHealRatio));
    const S=DB.map.supply;
    Run.data.parts += node.type==='elite'?S.partsPerElite:(node.type==='boss'?S.partsPerBoss:S.partsPerBattle);
    if(node.type==='boss'){ UI.renderResult(true); return; }
    UI.renderReward(node);
  },

  advance(node){
    node.done=true; Run.data.layer=node.li+1; Run.data.cleared++; Run.data.pending=null;
    Run.save(); UI.closeModal(); UI.showScreen('map');
  },

  rollTechs(n){
    const owned={}; Run.data.techs.forEach(id=>owned[id]=true);
    const pool=Object.keys(DB.techs).filter(id=>!owned[id]);
    return U.shuffle(pool).slice(0,n);
  },
  rollTraits(n){
    const owned={}; (Run.data.traits||[]).forEach(id=>owned[id]=true);
    const pool=Object.keys(DB.traits).filter(id=>{
      if(owned[id]) return false;
      const t=DB.traits[id];
      if(t.mod.slot) return Run.slotCap(t.mod.slot)<DB.balance.slots.perStanceMax;
      return true;
    });
    return U.shuffle(pool).slice(0,n);
  },

  rollChains(n){
    const owned={}; (Run.data.chains||[]).forEach(id=>owned[id]=true);
    return U.shuffle(Object.keys(DB.chains).filter(id=>!owned[id])).slice(0,n);
  },
  rollWeapons(n){
    const cur=Run.data.weapon||DB.weaponStart;
    return U.shuffle(Object.keys(DB.weapons).filter(id=>id!==cur)).slice(0,n);
  },
  rollSigils(n){
    const owned={}; (Run.data.sigils||[]).forEach(id=>owned[id]=true);
    return U.shuffle(Object.keys(DB.sigils).filter(id=>!owned[id])).slice(0,n);
  },
  addSigil(id){
    Run.data.sigils=Run.data.sigils||[];
    if(Run.data.sigils.indexOf(id)<0) Run.data.sigils.push(id);
    Run.save();
  },
  dropSigil(id){ Run.data.sigils=(Run.data.sigils||[]).filter(x=>x!==id); Run.save(); },
  addMilestone(id){
    Run.data.milestones=Run.data.milestones||[];
    if(Run.data.milestones.indexOf(id)<0) Run.data.milestones.push(id);
    Run.data.hp=U.clamp(Run.data.hp,1,Run.stat('hpMax',Run.data.hpMax));
    Run.save();
  },
  rollMilestones(n){
    const owned={}; (Run.data.milestones||[]).forEach(id=>owned[id]=true);
    return U.shuffle(Object.keys(DB.milestones).filter(id=>!owned[id])).slice(0,n);
  },

  addChain(id){
    Run.data.chains=Run.data.chains||[];
    if(Run.data.chains.indexOf(id)<0) Run.data.chains.push(id);
    Run.save();
  },
  dropChain(id){ Run.data.chains=(Run.data.chains||[]).filter(x=>x!==id); Run.save(); },
  setWeapon(id){ Run.data.weapon=id; Run.save(); },

  addTech(id){ if(Run.data.techs.indexOf(id)<0) Run.data.techs.push(id); Run.save(); },
  dropTech(id){ Run.data.techs=Run.data.techs.filter(x=>x!==id); Run.save(); },
  addTrait(id){ if((Run.data.traits||[]).indexOf(id)<0) Run.data.traits.push(id);
    Run.data.hp=U.clamp(Run.data.hp,1,Run.stat('hpMax',Run.data.hpMax)); Run.save(); },
  heal(v){ Run.data.hp=U.clamp(Run.data.hp+v,0,Run.stat('hpMax',Run.data.hpMax)); Run.save(); },

  save(){ try{ localStorage.setItem(DB.meta.storageKey,JSON.stringify(Run.data)); }catch(e){} },
  load(){ try{ const r=localStorage.getItem(DB.meta.storageKey); if(!r) return false;
    Run.data=JSON.parse(r); return !!Run.data; }catch(e){ return false; } },
  clear(){ try{ localStorage.removeItem(DB.meta.storageKey); }catch(e){} Run.data=null; },
  hasSave(){ try{ return !!localStorage.getItem(DB.meta.storageKey); }catch(e){ return false; } }
};

/* ==========================================================================================
   [UI] 렌더링
   ========================================================================================== */
const App = { settings:Object.assign({},DB.settingsDefault), screen:'title', backTo:'title' };

/* ==========================================================================================
   [ANN] 중앙 알림 — 전투 흐름의 분기점을 화면 한가운데에 굵게 띄운다.
   기록(로그)은 남기기 위한 것이고, 알림은 지금 무슨 일이 일어났는지 놓치지 않게 하기 위한 것이다.
   ========================================================================================== */
const Ann = {
  el(){ return document.getElementById('ann'); },
  clear(){ const e=Ann.el(); if(e) e.innerHTML=''; },
  push(key, vars, side){
    const A=DB.ui.announce, t=A.tpl[key]; if(!t) return;
    const box=Ann.el(); if(!box) return;
    const kind = (key==='damage' && side===DB.meta.sides.FOE) ? 'dmg-self' : t.kind;
    const who = side ? `<span class="who ${side===DB.meta.sides.SELF?'s':'f'}">${U.esc(DB.meta.sideLabel[side])}</span>` : '';
    const txt = U.fmt(t.text, vars||{});
    const big = key==='damage';
    const d=document.createElement('div');
    d.className='ann-item '+kind;
    d.innerHTML=`${who}<span class="${big?'big':''}">${txt}</span>${vars&&vars.extra?`<span class="sm">${vars.extra}</span>`:''}`;
    box.appendChild(d);
    while(box.children.length>A.maxStack) box.removeChild(box.firstChild);
    setTimeout(()=>{ d.classList.add('out'); setTimeout(()=>{ if(d.parentNode) d.parentNode.removeChild(d); }, 300); },
      A.durationMs);
  }
};

const UI = {
  showScreen(id){
    App.screen=id;
    if(id!=='battle') Ann.clear();   /* 전투를 벗어나면 남은 알림을 지운다 */
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    const el=document.getElementById('screen-'+id); if(el) el.classList.add('active');
    ({title:UI.renderTitle, settings:UI.renderSettings, map:UI.renderMap, multi:UI.renderMulti,
      battle:UI.renderBattle, school:UI.renderSchool, codex:UI.renderCodex}[id]||function(){})();
  },
  applySettings(){
    document.body.classList.toggle('no-anim',!App.settings.animations);
    document.documentElement.style.setProperty('--fs',(15*App.settings.fontScale).toFixed(2)+'px');
  },
  modal(h){ document.getElementById('modalBox').innerHTML=h; document.getElementById('modal').classList.add('on'); },
  closeModal(){ document.getElementById('modal').classList.remove('on'); },
  flash(side){
    if(!App.settings.animations) return;
    const el=document.getElementById(side===DB.meta.sides.SELF?'selfPanel':'foePanel');
    if(!el) return; el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit');
  },
  sym(st,cls){ return `<i class="sty sty-${st.sym} ${cls||''}"></i>`; },
  stanceChip(id,extra){
    const s=U.stance(id);
    return `<span class="stance-badge" style="color:var(${s.color})" title="${U.esc(s.desc)}">${UI.sym(s)}${U.esc(s.name)}${extra||''}</span>`;
  },

  /* ---------- 타이틀 ---------- */
  renderTitle(){
    const r=document.getElementById('titleRule');
    if(!r.dataset.d){ for(let i=0;i<5;i++){ const d=document.createElement('i');
      d.style.left=(6+i*22)+'%'; r.appendChild(d); } r.dataset.d='1'; }
    const m=document.getElementById('titleMenu'); m.innerHTML='';
    DB.ui.menu.forEach(o=>{
      const b=document.createElement('button');
      b.className='btn wide'+(o.id==='newrun'?' acc':''); b.textContent=o.label;
      b.disabled=!!o.disabled||(o.id==='continue'&&!Run.hasSave());
      b.onclick=()=>UI.menu(o.id); m.appendChild(b);
    });
    document.getElementById('titleFoot').textContent=
      `${DB.meta.version} · ${DB.meta.build} · ${DB.meta.footer}`;
  },
  menu(id){
    if(id==='newrun'){
      UI.setupContext='single';
      if(Run.hasSave()){
        UI.modal(`<div class="h2">새 게임</div><p class="muted">진행 중인 기록이 있습니다. 새 게임을 시작하면 기존 기록이 사라집니다.</p>
          <div class="rowwrap" style="margin-top:15px"><button class="btn dang" id="mkY">새로 시작</button>
          <button class="btn" id="mkN">취소</button></div>`);
        document.getElementById('mkY').onclick=()=>{ UI.closeModal(); Run.clear(); UI.showScreen('school'); };
        document.getElementById('mkN').onclick=UI.closeModal;
      } else UI.showScreen('school');
    }
    else if(id==='continue'){ if(Run.load()) UI.showScreen('map'); }
    else if(id==='tutorial') Tut.start();
    else if(id==='multi'){ UI.showScreen('multi'); Net.open(); }
    else if(id==='codex'){ App.backTo='title'; UI.showScreen('codex'); }
    else if(id==='settings'){ App.backTo='title'; UI.showScreen('settings'); }
  },

  /* ---------- 초기 빌드 구성 ----------
     구성 점수를 나눠 써서 시작 구성을 직접 조립한다. 프리셋은 시작점일 뿐 언제든 바꿀 수 있다. */
  setupDraft:null,
  setupContext:'single',
  techCost(id){
    const S=DB.setup.cost, t=DB.techs[id];
    return t.tier==='rare'?S.techRare:(t.tier==='common'?S.techCommon:S.techBase);
  },
  setupSpent(d){
    const S=DB.setup.cost;
    let v=S.weapon[d.weapon]||0;
    d.techs.forEach(id=>v+=UI.techCost(id));
    v+=d.sigils.length*S.sigil + d.chains.length*S.chain + d.traits.length*S.trait;
    v+=d.hp*S.hpStep + d.stamina*S.staminaStep + d.focus*S.focusStep;
    return v;
  },
  setupLoad(preset){
    UI.setupDraft = preset
      ? { weapon:preset.weapon, techs:preset.techs.slice(), sigils:preset.sigils.slice(),
          chains:preset.chains.slice(), traits:[], hp:preset.hp, stamina:preset.stamina, focus:preset.focus }
      : { weapon:DB.weaponStart, techs:[], sigils:[], chains:[], traits:[], hp:0, stamina:0, focus:0 };
  },

  renderSchool(){
    const SU=DB.setup, S=SU.cost;
    if(!UI.setupDraft) UI.setupLoad(null);
    const d=UI.setupDraft;
    const spent=UI.setupSpent(d), left=SU.points-spent;
    const can=c=>left>=c;
    const ok = d.techs.length>=SU.minTechs && d.techs.length<=SU.maxTechs && left>=0;

    let h=`<div class="ptbar">
      <span class="pt ${left<0?'over':''}">구성 점수 <b>${left}</b> <span class="dim">/ ${SU.points}</span></span>
      <span class="tag ${d.techs.length<SU.minTechs?'t-dang':'t-ok'}">기술 ${d.techs.length} / 최소 ${SU.minTechs}</span>
      <span class="tag t-key n">${U.esc(DB.weapons[d.weapon].name)}</span>
      <span class="tag t-side n">각인 ${d.sigils.length}</span>
      <span class="tag t-acc n">연계 ${d.chains.length}</span>
      <div style="flex:1"></div>
      <button class="btn sm" id="suReset">비우기</button>
      <button class="btn acc" id="suGo" ${ok?'':'disabled'}>이 구성으로 시작</button></div>

      <div class="card-box nm"><div class="h2">추천 구성</div>
        <p class="dim" style="margin-bottom:10px">원하는 구성을 불러온 뒤 자유롭게 수정할 수 있습니다. 특정 추천 구성에 제한되지 않습니다.</p>
        <div class="rowwrap">${SU.presets.map(x=>`<button class="btn" data-preset="${x.id}">${U.esc(x.name)} <span class="dim">— ${U.esc(x.desc)}</span></button>`).join('')}</div></div>

      <div class="card-box nm"><div class="h2">무기 · 하나만</div>
        <div class="techrow">${Object.keys(DB.weapons).map(id=>{
          const c=S.weapon[id]||0, on=d.weapon===id;
          const dis=!on&&!can(c-(S.weapon[d.weapon]||0));
          return `<div class="pick ${on?'on':''} ${dis?'dis':''}" data-w="${id}">
            <span class="cost">${c}점</span>${UI.optCard('weapon',id)}</div>`;}).join('')}</div></div>

      <div class="card-box nm"><div class="h2">시작 기술 · ${SU.minTechs}~${SU.maxTechs}장</div>
        <p class="dim" style="margin-bottom:10px">자세마다 기술 슬롯 제한이 있습니다. 어떤 자세를 중심으로 구성할지 선택해 주세요.</p>`;
    DB.stances.forEach(st=>{
      const ids=Object.keys(DB.techs).filter(id=>DB.techs[id].stance===st.id);
      const mine=d.techs.filter(id=>DB.techs[id].stance===st.id).length;
      h+=`<div class="secthead" style="margin:12px 0 8px"><span style="color:var(${st.color})">${UI.sym(st)}</span>
        <span>${U.esc(st.name)} · ${mine} / ${DB.balance.slots.perStanceBase}</span><span class="ln"></span></div>
        <div class="techrow">${ids.map(id=>{
          const c=UI.techCost(id), on=d.techs.indexOf(id)>=0;
          const full=mine>=DB.balance.slots.perStanceBase&&!on;
          const dis=!on&&(!can(c)||full||d.techs.length>=SU.maxTechs);
          return `<div class="pick ${on?'on':''} ${dis?'dis':''}" data-t="${id}">
            <span class="cost">${c}점</span>${UI.techCard(id,{mini:true,cls:'mini'})}</div>`;}).join('')}</div>`;
    });
    h+=`</div>

      <div class="card-box nm"><div class="h2">시간축 각인 · 각 ${S.sigil}점</div>
        <p class="dim" style="margin-bottom:10px">기술의 종류가 아니라 발동 시점에 따라 보너스를 받습니다. 최대 ${DB.sigilSlots}개까지 선택할 수 있습니다.</p>
        <div class="techrow">${Object.keys(DB.sigils).map(id=>{
          const on=d.sigils.indexOf(id)>=0;
          const dis=!on&&(!can(S.sigil)||d.sigils.length>=DB.sigilSlots);
          return `<div class="pick ${on?'on':''} ${dis?'dis':''}" data-g="${id}">
            <span class="cost">${S.sigil}점</span>${UI.optCard('sigil',id)}</div>`;}).join('')}</div></div>

      <div class="card-box nm"><div class="h2">연계 · 각 ${S.chain}점</div>
        <p class="dim" style="margin-bottom:10px">특정 자세 전환 경로에 보너스를 부여합니다. 최대 ${DB.chainSlots}개까지 선택할 수 있습니다.</p>
        <div class="techrow">${Object.keys(DB.chains).map(id=>{
          const on=d.chains.indexOf(id)>=0;
          const dis=!on&&(!can(S.chain)||d.chains.length>=DB.chainSlots);
          return `<div class="pick ${on?'on':''} ${dis?'dis':''}" data-c="${id}">
            <span class="cost">${S.chain}점</span>${UI.optCard('chain',id)}</div>`;}).join('')}</div></div>

      <div class="card-box nm"><div class="h2">단련 · 각 ${S.trait}점</div>
        <div class="techrow">${Object.keys(DB.traits).map(id=>{
          const on=d.traits.indexOf(id)>=0, dis=!on&&!can(S.trait);
          return `<div class="pick ${on?'on':''} ${dis?'dis':''}" data-r="${id}">
            <span class="cost">${S.trait}점</span>${UI.optCard('trait',id)}</div>`;}).join('')}</div></div>

      <div class="card-box nm"><div class="h2">기본 능력치</div>
        ${[['hp','체력',SU.step.hp,S.hpStep,SU.maxStep.hp,SU.base.hp],
           ['stamina','기력',SU.step.stamina,S.staminaStep,SU.maxStep.stamina,SU.base.stamina],
           ['focus','집중',SU.step.focus,S.focusStep,SU.maxStep.focus,SU.base.focus]]
          .map(([k,nm,step,cost,mx,base])=>`<div class="stepper" style="margin-bottom:8px">
            <span class="nm">${nm}</span>
            <button class="btn xs" data-s="${k}" data-d="-1" ${d[k]<=0?'disabled':''}>-</button>
            <span class="val">${base+d[k]*step}</span>
            <button class="btn xs" data-s="${k}" data-d="1" ${(d[k]>=mx||!can(cost))?'disabled':''}>+</button>
            <span class="hint">한 단계 +${step} · ${cost}점 · 최대 ${mx}단계 (현재 ${d[k]}단계)</span></div>`).join('')}
      </div>`;

    const schoolTitle=document.getElementById('schoolTitle');
    if(schoolTitle) schoolTitle.textContent=UI.setupContext==='multi'?'멀티플레이 덱 설정':'초기 빌드 구성';
    if(UI.setupContext==='multi') h=h.replace('이 구성으로 시작','브라우저에 저장');
    const body=document.getElementById('schoolBody'); body.innerHTML=h;
    const re=()=>UI.renderSchool();
    body.querySelectorAll('[data-preset]').forEach(el=>el.onclick=()=>{
      UI.setupLoad(SU.presets.find(x=>x.id===el.dataset.preset)); re(); });
    const toggle=(arr,id,cap)=>{ const i=arr.indexOf(id);
      if(i>=0) arr.splice(i,1); else { if(cap&&arr.length>=cap) return; arr.push(id); } re(); };
    body.querySelectorAll('[data-w]').forEach(el=>el.onclick=()=>{
      if(el.classList.contains('dis')) return; d.weapon=el.dataset.w; re(); });
    body.querySelectorAll('[data-t]').forEach(el=>el.onclick=()=>{
      if(el.classList.contains('dis')) return; toggle(d.techs,el.dataset.t,SU.maxTechs); });
    body.querySelectorAll('[data-g]').forEach(el=>el.onclick=()=>{
      if(el.classList.contains('dis')) return; toggle(d.sigils,el.dataset.g,DB.sigilSlots); });
    body.querySelectorAll('[data-c]').forEach(el=>el.onclick=()=>{
      if(el.classList.contains('dis')) return; toggle(d.chains,el.dataset.c,DB.chainSlots); });
    body.querySelectorAll('[data-r]').forEach(el=>el.onclick=()=>{
      if(el.classList.contains('dis')) return; toggle(d.traits,el.dataset.r); });
    body.querySelectorAll('[data-s]').forEach(el=>el.onclick=()=>{
      if(el.disabled) return; d[el.dataset.s]+= +el.dataset.d; re(); });
    document.getElementById('suReset').onclick=()=>{ UI.setupLoad(null); re(); };
    document.getElementById('suGo').onclick=()=>{
      if(UI.setupContext==='multi') Net.saveBuild(d);
      else { Run.createFromSetup(d); UI.showScreen('map'); }
    };
  },

      h+=`<div class="set-row"><div class="lab"><b>${U.esc(s.label)}</b><span>${U.esc(s.hint)}</span></div>`;

  /* ---------- 기술 카드 ---------- */
  techCard(id,opt){
    opt=opt||{};
    const d=DB.techs[id], ln=U.line(d.line), D=DB.balance.distance;
    const a=opt.actor, s=Battle.st;
    const ref=a||{weapon:(Run.data&&Run.data.weapon)||DB.weaponStart,traits:(Run.data&&Run.data.traits)||[],
      statuses:{},stance:d.stance};
    const cast=a?Battle.castTimeOf(a,d):d.cast, rec=Battle.effRecovery(ref,d);
    const rg=Battle.effRange(ref,d);
    let bar=''; const total=Math.min(cast+rec,12);
    for(let i=0;i<total;i++) bar+=`<i class="${i<cast?'cast':'rec'}"></i>`;
    let dots=''; for(let i=D.min;i<=D.max;i++){
      const on=i>=rg[0]&&i<=rg[1], cur=s&&s.distance===i;
      dots+=`<i class="${on?'on':''} ${cur?'cur':''}" title="${U.esc(D.labels[i])}"></i>`; }

    const tc=a?Battle.transitionCost(a,d.stance):0;
    let mult='';
    if(opt.showMult && s && d.line!=='none'){
      const m=Battle.lineMult(Battle.A(DB.meta.sides.FOE),d.line);
      mult=`<span class="tc-mult ${m>1.01?'up':(m<0.99?'dn':'')}" title="상대 ${U.esc(U.stance(Battle.A(DB.meta.sides.FOE).stance).name)} 자세 기준 피해 배율">${m.toFixed(2)}배</span>`;
    }
    const emp=d.empower&&!opt.mini?`<div class="tc-emp">집중 ${d.empower.focus} — ${U.esc(d.empower.text)}</div>`:'';
    const block=opt.block?`<div class="tc-block">${U.esc(opt.block)}</div>`:'';
    const good=opt.good?`<div class="tc-good">${U.esc(opt.good)}</div>`:'';
    return `<div class="tech line-${d.line} ${opt.cls||''}" data-tech="${id}" ${opt.attrs||''}>
      ${good}<div class="tc-line" style="background:linear-gradient(90deg,var(${ln.css}),color-mix(in srgb,var(${ln.css}) 48%,transparent))"></div>
      <div class="tc-body">
        <div class="tc-top">
          <div style="flex:1">
            <div class="tc-name">${U.esc(d.name)}</div>
            <div class="tc-sub"><span style="color:var(${ln.css})">${U.esc(ln.name)}</span>
              <span style="color:var(${U.stance(d.stance).color})">${U.esc(U.stance(d.stance).name)}</span>
              ${tc>0?`<span class="tag t-warn n" style="padding:1px 6px">전환 ${tc}</span>`:''}</div>
          </div>
          <div class="tc-cost" title="기술 자체의 기력 비용">${Battle.effCost(ref,d)}</div>
        </div>
        <div class="tc-sub" style="gap:9px">
          <span class="tbar" style="color:var(${ln.css})">${bar}<span class="tb-lab">준비 ${cast}틱 · 빈틈 ${rec}틱</span></span>
        </div>
        <div class="costline">기력 <b>${Battle.effCost(ref,d)+tc}</b>${tc>0?` <span style="color:var(--warn)">(자세 바꾸기 ${tc} 포함)</span>`:''}</div>
        <div class="tc-sub"><span class="rdots">${dots}</span>
          <span style="color:var(--ink-4)">${rg[0]===D.min&&rg[1]===D.max?'전 거리':U.esc(D.labels[rg[0]]+(rg[0]!==rg[1]?'~'+D.labels[rg[1]]:''))}</span>${mult}</div>
        <div class="tc-text">${U.esc(d.text)}</div>
        ${block}${emp}
        <div class="tc-foot"><span class="tc-to">사용 후 ${UI.sym(U.stance(d.to))} ${U.esc(U.stance(d.to).name)}</span></div>
      </div></div>`;
  }
};

/* ---------- 전투: 패널 ---------- */
UI.panel = function(side){
  const a=Battle.A(side), s=Battle.st, isSelf=side===DB.meta.sides.SELF;
  /* 선택한 기술이 가져갈 기력을 게이지 위에 빗금으로 미리 보여준다 */
  let costBar='', costNote='';
  if(isSelf && Battle.selected && DB.techs[Battle.selected]){
    const d=DB.techs[Battle.selected];
    const need=Battle.transitionCost(a,d.stance)+d.cost;
    if(need>0 && a.staminaMax>0){
      const use=Math.min(need,a.stamina);
      const right=(a.stamina/a.staminaMax*100), w=(use/a.staminaMax*100);
      costBar=`<span class="ghostcost" style="left:${(right-w).toFixed(1)}%;width:${w.toFixed(1)}%"></span>`;
      costNote=` <span style="color:var(--dang)">− ${need}</span>`;
    }
  }
  const sts=Object.keys(a.statuses).map(k=>
    `<span class="tag ${DB.statuses[k].tag}" title="${U.esc(DB.statuses[k].desc)}">${U.esc(DB.statuses[k].name)} ${a.statuses[k]}</span>`).join('');
  const rx=s.reactions.filter(r=>r.owner===side).length
    ? `<span class="tag t-acc">반응 대기</span>` : '';
  const P=DB.balance.pressure, pr=Battle.pressureAmount(side);
  const left=Math.max(0,P.idleTicksBeforeStart-Battle.pressureIdle(side));
  const ptag = !P.enabled?'' : (pr>0
    ? `<span class="tag t-dang" title="${U.esc(P.desc)}">약점 ${pr} · 받는 피해 +${Math.round(pr*DB.statuses.exposed.takenPerStack*100)}%</span>`
    : `<span class="tag t-key n" title="${U.esc(P.desc)}">${U.esc(P.name)}까지 ${left}틱</span>`);
  return `
    <div class="pl-row">
      <span class="tag ${isSelf?'t-acc':'t-high'}">${U.esc(a.name)}</span>
      ${UI.stanceChip(a.stance)}
      <span class="pl-hp">${a.hp} <small>/ ${a.hpMax}</small></span>
    </div>
    <div class="gauge g-hp ${isSelf?'self':''} big"><i style="width:${(a.hp/a.hpMax*100).toFixed(1)}%"></i></div>
    <div class="duo">
      <div><div class="bar-lab"><span>기력</span><b>${Math.floor(a.stamina)} / ${a.staminaMax}${costNote}</b></div>
        <div class="gauge g-sta"><i style="width:${(a.stamina/a.staminaMax*100).toFixed(1)}%"></i>${costBar}</div></div>
      <div><div class="bar-lab"><span>집중</span><b>${a.focus} / ${a.focusMax}</b></div>
        <div class="gauge g-foc"><i style="width:${a.focusMax?(a.focus/a.focusMax*100).toFixed(1):0}%"></i></div></div>
    </div>
    <div class="st-row">${sts}${rx}${ptag}
      <span class="tag t-key n">행동 가능 ${a.readyAt}틱</span></div>`;
};

/* ---------- 전투: 시간축 ---------- */
UI.timeline = function(){
  const s=Battle.st, W=DB.ui.window, D=DB.balance.distance, TK=DB.balance.tick;
  const t0=s.tick, t1=s.tick+W, pos=t=>U.clamp((t-t0)/W*100,0,100);
  const intent=Run.difficulty().intent;
  const selfA=Battle.A(DB.meta.sides.SELF), foeA=Battle.A(DB.meta.sides.FOE);

  let axis='';
  for(let t=t0;t<=t1;t++){
    const mj=(t%DB.ui.majorEvery)===0; if(!mj&&t!==t0) continue;
    const p=pos(t), sh=p<3?'0':(p>97?'-100%':'-50%');
    axis+=`<div class="tl-tk ${mj?'mj':''}" style="left:${p}%;transform:translateX(${sh})">${t}</div>`;
  }

  let ghost=null;
  if(Battle.selected && DB.techs[Battle.selected]){
    const d=DB.techs[Battle.selected], keep=selfA.stance;
    selfA.stance=d.stance; const cast=Battle.castTimeOf(selfA,d); selfA.stance=keep;
    const mv=(d.onPlay||[]).filter(e=>e.k==='move').reduce((x,e)=>x+e.v,0);
    const nd=U.clamp(s.distance+mv,D.min,D.max);
    const rgG=Battle.effRange(selfA,d);
    ghost={ at:s.tick+cast, ready:s.tick+Battle.recoveryOf(selfA,d), name:d.name, line:d.line,
      hasHit:(d.onHit||[]).length>0, inRange:nd>=rgG[0]&&nd<=rgG[1], nd, range:rgG };
  }

  const lane=side=>{
    const cls=side===DB.meta.sides.SELF?'self':'foe';
    const me=Battle.A(side);
    let h=`<div class="tl-lab">${side===DB.meta.sides.SELF?DB.ui.laneSelf:DB.ui.laneFoe}</div>`;
    if(side===DB.meta.sides.SELF&&ghost&&ghost.hasHit&&ghost.at<=t1)
      h+=`<div class="tl-ent ghost" style="left:${pos(ghost.at)}%;color:var(${U.line(ghost.line).css})"
            title="선택한 기술의 예상 발동 시각">${U.esc(ghost.name)} 예정</div>`;
    s.queue.filter(q=>q.status==='pending'&&q.owner===side).forEach(q=>{
      if(q.resolveAt>t1) return;
      const ln=U.line(q.line), foe=Battle.A(Battle.other(side));
      const raw=(q.onHit||[]).filter(e=>e.k==='damage').reduce((x,e)=>x+e.v,0);
      const show=(side===DB.meta.sides.SELF||intent==='full');
      const est=raw?U.floor(raw*Battle.dealtMult(me,foe)*Battle.takenMult(foe)*Battle.lineMult(foe,q.line)*DB.balance.damage.globalScale):0;
      const inR=s.distance>=q.range[0]&&s.distance<=q.range[1];
      h+=`<div class="tl-ent ${cls}" style="left:${pos(q.resolveAt)}%;color:var(${ln.css})"
        title="${U.esc(q.name)} · ${U.esc(ln.name)} · 발동 ${q.resolveAt}틱 · ${inR?'현재 사거리 내':'현재 사거리 밖'}">
        ${U.esc(q.name)}${show&&est?` <b>${est}</b>`:''}${inR?'':' <span style="opacity:.6">밖</span>'}</div>`;
    });
    if(me.readyAt<=t1) h+=`<div class="tl-rdy ${cls}" style="left:${pos(me.readyAt)}%"
      title="${DB.meta.sideLabel[side]} 다음 행동 가능"></div>`;
    if(side===DB.meta.sides.SELF&&ghost&&ghost.ready<=t1)
      h+=`<div class="tl-rdy ghost" style="left:${pos(ghost.ready)}%" title="선택한 기술 사용 시 다음 행동 가능"></div>`;
    return h;
  };

  /* 거리 트랙 — 왼쪽이 나, 오른쪽 원이 상대. 사이가 벌어질수록 상대가 멀어진다. */
  let cells='';
  for(let i=D.min;i<=D.max;i++){
    const inG=ghost&&i>=ghost.range[0]&&i<=ghost.range[1];
    cells+=`<span class="cell ${inG?'reach':(i<=s.distance?'gap':'')}" title="${U.esc(D.labels[i])}">${U.esc(D.labels[i])}</span>`;
  }
  const pct=(s.distance-D.min)/(D.max-D.min);
  const track=`<div class="track"><span class="cap">거리</span>
    <div class="trk"><div class="cells">${cells}</div>
      <span class="gapline" style="left:26px;width:calc(${(pct*100).toFixed(1)}% - 26px)"></span>
      <span class="tok me" title="나">나</span>
      <span class="tok foe" style="left:calc(${(pct*100).toFixed(1)}% - ${(pct*26).toFixed(0)}px)" title="상대">상대</span></div>
    <span class="now">칸 <b>${s.distance}</b> · ${U.esc(D.labels[s.distance])}</span>
    ${ghost?`<span class="tag ${ghost.inRange?'t-ok':'t-dang'}">${ghost.inRange?'현재 사거리 내':'현재 사거리 밖'}</span>`:''}</div>`;

  const leftT=Math.max(0,TK.maxTickGuard-s.tick);
  const lead=(selfA.hp/selfA.hpMax)>=(foeA.hp/foeA.hpMax)?'내가 우세':'상대가 우세';
  return `
    <div class="tl-top">
      <span class="tl-now"><small>현재</small>${s.tick}틱</span>
      <span class="tag ${leftT<=TK.warnRemaining?'t-dang':'t-key'}" title="제한 시간에 도달하면 남은 체력 비율이 높은 쪽이 승리합니다.">제한 ${leftT}틱 · ${lead}</span>
    </div>
    ${track}
    <div class="tl-grid">
      <div class="tl-lane">${lane(DB.meta.sides.FOE)}</div>
      <div class="tl-axis">${axis}</div>
      <div class="tl-lane">${lane(DB.meta.sides.SELF)}</div>
      <div class="tl-head"></div>
    </div>`;
};

/* ---------- 전투: 자세 링 ---------- */
UI.ring = function(){
  const a=Battle.A(DB.meta.sides.SELF), s=Battle.st;
  const inc=s.queue.filter(q=>q.status==='pending'&&q.owner===DB.meta.sides.FOE
    && (q.onHit||[]).some(e=>e.k==='damage'));
  let nodes='';
  DB.stances.forEach(st=>{
    const cur=a.stance===st.id, cost=Battle.transitionCost(a,st.id);
    const can=cur||a.stamina>=cost;
    let thr='';
    if(inc.length){
      const keep=a.stance; a.stance=st.id;
      let t=0; inc.forEach(q=>{ const m=Battle.lineMult(a,q.line);
        (q.onHit||[]).forEach(e=>{ if(e.k==='damage') t+=e.v*m; }); });
      let base=0; inc.forEach(q=>(q.onHit||[]).forEach(e=>{ if(e.k==='damage') base+=e.v; }));
      a.stance=keep;
      const ratio=base?t/base:1;
      thr=`<span class="sn-thr ${ratio>1.01?'bad':(ratio<0.99?'good':'')}" title="예고된 상대 공격을 이 자세로 받을 때의 피해 배율입니다.">${ratio.toFixed(2)}</span>`;
    }
    nodes+=`<div class="snode ${cur?'cur':''} ${can?'':'no'}" data-stance="${st.id}"
      title="${U.esc(st.desc)}">
      ${thr}<div class="sn-sym" style="${cur?`color:var(${st.color})`:''}">${UI.sym(st)}</div>
      <div class="sn-name">${U.esc(st.name)}</div>
      <div class="sn-cost">${cur?'현재':(can?`기력 ${cost}`:`기력 ${cost}`)}</div></div>`;
  });
  return `<div class="ring-head"><span class="tag t-key n" title="자세 전환에는 시간이 들지 않습니다. 전환한 뒤 바로 기술을 사용할 수 있습니다.">자세 바꾸기</span></div>
    <div class="ring-row">${nodes}</div>`;
};

/* ---------- 전투: 기술 목록 ---------- */
UI.techs = function(){
  const a=Battle.A(DB.meta.sides.SELF), foe=Battle.A(DB.meta.sides.FOE), st=Battle.st;
  const BR=DB.ui.blockReason;
  const groups=DB.stances.map(x=>({st:x, ids:a.techs.filter(id=>DB.techs[id]&&DB.techs[id].stance===x.id)}))
    .filter(g=>g.ids.length);
  groups.sort((x,y)=> (y.st.id===a.stance?1:0)-(x.st.id===a.stance?1:0));

  /* 가장 빨리 발동하면서 사거리에 드는 공격을 '유리한 수'로 표시한다 */
  const inc=st.queue.filter(q=>q.status==='pending'&&q.owner===DB.meta.sides.FOE
    &&(q.onHit||[]).some(e=>e.k==='damage')).sort((p,q)=>p.resolveAt-q.resolveAt)[0];
  let bestId=null, bestScore=-1;
  a.techs.forEach(id=>{
    const d=DB.techs[id]; if(!d||!(d.onHit||[]).some(e=>e.k==='damage')) return;
    const tc=Battle.transitionCost(a,d.stance);
    if(a.stamina < tc+Battle.effCost(a,d)) return;
    const mv=(d.onPlay||[]).filter(e=>e.k==='move').reduce((x,e)=>x+e.v,0);
    const nd=U.clamp(st.distance+mv,DB.balance.distance.min,DB.balance.distance.max);
    const rgB=Battle.effRange(a,d);
    if(nd<rgB[0]||nd>rgB[1]) return;
    const keep=a.stance; a.stance=d.stance; const cast=Battle.castTimeOf(a,d); a.stance=keep;
    if(inc && st.tick+cast > inc.resolveAt) return;          // 상대보다 늦으면 제외
    const raw=(d.onHit||[]).filter(e=>e.k==='damage').reduce((x,e)=>x+e.v,0);
    const est=raw*Battle.dealtMult(a,foe)*Battle.takenMult(foe)*Battle.lineMult(foe,d.line)
              *DB.balance.damage.globalScale;
    if(est>bestScore){ bestScore=est; bestId=id; }
  });

  let h='';
  groups.forEach(g=>{
    const cur=g.st.id===a.stance;
    const tc=Battle.transitionCost(a,g.st.id);
    h+=`<div class="secthead" style="margin:${cur?'0':'12px'} 0 7px">
      <span style="color:var(${g.st.color})">${UI.sym(g.st)}</span>
      <span>${U.esc(g.st.name)}${cur?' · 지금 자세':` · 바꾸기 기력 ${tc}`}</span>
      <span class="ln"></span></div><div class="techrow">`;
    g.ids.forEach(id=>{
      const d=DB.techs[id], need=tc+Battle.effCost(a,d);
      let block='';
      if(!Tut.allowTech(id)&&Tut.on) block=BR.locked;
      else if(!Battle.awaitInput) block=BR.turn;
      else if(a.stamina<need) block=U.fmt(BR.stamina,{need,have:Math.floor(a.stamina)});
      const can=!block;
      h+=UI.techCard(id,{ actor:a, mini:!cur, showMult:App.settings.showMultiplier, block,
        good: id===bestId?'유리한 수':'',
        cls:(can?'':'no')+(Battle.selected===id?' sel':'')+(cur?'':' mini')+(id===bestId?' best':'') });
    });
    h+=`</div>`;
  });
  return h;
};

/* ---------- 전투: 지금 상황 요약 ---------- */
UI.brief = function(){
  const st=Battle.st, a=Battle.A(DB.meta.sides.SELF), foe=Battle.A(DB.meta.sides.FOE);
  const B=DB.ui.brief, D=DB.balance.distance;
  const turn=Battle.awaitInput?`<span class="chip" style="color:var(--self)">${B.yourTurn}</span>`
                              :`<span class="chip" style="color:var(--foe)">${B.foeTurn}</span>`;
  const inc=st.queue.filter(q=>q.status==='pending'&&q.owner===DB.meta.sides.FOE
    &&(q.onHit||[]).some(e=>e.k==='damage')).sort((p,q)=>p.resolveAt-q.resolveAt)[0];
  if(!inc) return `<div class="brief"><span class="hd">지금 상황</span>${turn}
    <span class="sep">·</span><span class="muted">${U.esc(B.none)}</span></div>`;

  const raw=(inc.onHit||[]).filter(e=>e.k==='damage').reduce((x,e)=>x+e.v,0);
  const calc=(stance)=>{ const keep=a.stance; a.stance=stance;
    const v=U.floor(raw*Battle.dealtMult(foe,a)*Battle.takenMult(a)*Battle.lineMult(a,inc.line)
      *DB.balance.damage.globalScale); a.stance=keep; return v; };
  const now=calc(a.stance);
  let bestS=null,bestV=now;
  DB.stances.forEach(x=>{ if(x.id===a.stance) return;
    if(a.stamina<Battle.transitionCost(a,x.id)) return;
    const v=calc(x.id); if(v<bestV){ bestV=v; bestS=x; } });
  const inR=st.distance>=inc.range[0]&&st.distance<=inc.range[1];
  const dir = st.distance<inc.range[0]?'좁히면':(st.distance>inc.range[1]?'벌리면':
    (inc.range[1]<D.max?'벌리면':'좁히면'));

  let h=`<div class="brief"><span class="hd">지금 상황</span>${turn}<span class="sep">·</span>
    <span class="th ${now>=a.hp*0.4?'hot':''}">${U.fmt(B.incoming,{tech:U.esc(inc.name),in:Math.max(0,inc.resolveAt-st.tick),dmg:now})}</span>`;
  if(bestS) h+=`<span class="sep">·</span><span class="adv">${U.fmt(B.safeStance,{stance:U.esc(bestS.name),dmg:bestV})}</span>`;
  if(inR) h+=`<span class="sep">·</span><span class="adv">${U.fmt(B.outrange,{dir})}</span>`;
  h+=`</div>`;
  return h;
};

/* ---------- 전투: 판정 미리보기 ---------- */
UI.projection = function(){
  const s=Battle.st, a=Battle.A(DB.meta.sides.SELF), foe=Battle.A(DB.meta.sides.FOE), D=DB.balance.distance;
  if(!Battle.selected||!DB.techs[Battle.selected])
    return `<div class="proj"><span class="dim">기술을 선택하면 예상 발동 시점과 피해가 여기에 표시됩니다.</span></div>`;
  const d=DB.techs[Battle.selected];
  const tc=Battle.transitionCost(a,d.stance);
  const keep=a.stance; a.stance=d.stance;
  const cast=Battle.castTimeOf(a,d); a.stance=keep;
  const rec=Battle.recoveryOf(a,d);
  const mv=(d.onPlay||[]).filter(e=>e.k==='move').reduce((x,e)=>x+e.v,0);
  const nd=U.clamp(s.distance+mv,D.min,D.max);
  const rgP=Battle.effRange(a,d);
  const hasHit=(d.onHit||[]).length>0, inR=nd>=rgP[0]&&nd<=rgP[1];
  const raw=(d.onHit||[]).filter(e=>e.k==='damage').reduce((x,e)=>x+e.v,0);
  const lm=Battle.lineMult(foe,d.line);
  const est=raw?U.floor(raw*Battle.dealtMult(a,foe)*Battle.takenMult(foe)*lm*DB.balance.damage.globalScale):0;
  const g=Battle.stacks(foe,'guard');
  const p=[`<b>${U.esc(d.name)}</b>`];
  if(tc>0) p.push(`<span class="sep">·</span> 전환 기력 <b>${tc}</b>`);
  p.push(`<span class="sep">·</span> 기력 <b>${d.cost+tc}</b>`);
  if(hasHit) p.push(`<span class="sep">·</span> 발동 <b>${s.tick+cast}틱</b>`);
  p.push(`<span class="sep">·</span> 다음 행동 <b>${s.tick+rec}틱</b>`);
  if(mv!==0) p.push(`<span class="sep">·</span> 거리 <b>${U.esc(D.labels[nd])}</b>`);
  if(hasHit) p.push(`<span class="sep">·</span> <span class="${inR?'ok':'bad'}">${inR?'사거리 내':'사거리 밖 — 빗나갑니다'}</span>`);
  if(est>0) p.push(`<span class="sep">·</span> 예상 피해 <b>${est}</b>${lm!==1?` <span class="${lm>1?'bad':'ok'}">(${U.esc(U.line(d.line).name)} 대 ${U.esc(U.stance(foe.stance).name)} ${lm.toFixed(2)}배)</span>`:''}${g>0?` <span class="dim">· 상대 막기 ${g}</span>`:''}`);
  p.push(`<span class="sep">·</span> 사용 후 ${UI.stanceChip(d.to)}`);
  return `<div class="proj">${p.join(' ')}</div>`;
};

/* ---------- 전투: 조작 ---------- */
UI.actions = function(){
  const s=Battle.st,a=Battle.A(DB.meta.sides.SELF),B=DB.balance.basic,D=DB.balance.distance;
  const on=Battle.awaitInput;
  let h='';
  if(Battle.selected&&DB.techs[Battle.selected]){
    const d=DB.techs[Battle.selected];
    const canE=d.empower&&a.focus>=d.empower.focus;
    h+=`<button class="btn acc" data-act="use">사용</button>`;
    if(d.empower) h+=`<button class="btn" data-act="useEmp" ${canE?'':'disabled'}>${DB.balance.empower.label} (집중 ${d.empower.focus})</button>`;
    h+=`<button class="btn sm" data-act="unsel">선택 해제</button><span style="width:6px"></span>`;
  }
  const ap=Battle.moveCost(a,B.approach), rt=Battle.moveCost(a,B.retreat);
  h+=`<button class="btn" data-act="wait" title="${U.esc(B.wait.desc)}">${B.wait.name} <span class="dim">+${B.wait.recovery}틱</span></button>`;
  h+=`<button class="btn" data-act="approach" title="${U.esc(B.approach.desc)}" ${s.distance>D.min&&a.stamina>=ap?'':'disabled'}>${B.approach.name} <span class="dim">기력 ${ap}</span></button>`;
  h+=`<button class="btn" data-act="retreat" title="${U.esc(B.retreat.desc)}" ${s.distance<D.max&&a.stamina>=rt?'':'disabled'}>${B.retreat.name} <span class="dim">기력 ${rt}</span></button>`;
  h+=`<div style="flex:1"></div>
    <button class="btn sm" data-act="codex">규칙</button>
    <button class="btn sm dang" data-act="quit">전투 포기</button>`;
  return h;
};

UI.renderBattle = function(){
  const s=Battle.st; if(!s) return;
  document.getElementById('foePanel').innerHTML=UI.panel(DB.meta.sides.FOE);
  document.getElementById('selfPanel').innerHTML=UI.panel(DB.meta.sides.SELF);
  document.getElementById('tlBox').innerHTML=UI.timeline();
  document.getElementById('ringBox').innerHTML=UI.ring();
  document.getElementById('techBox').innerHTML=UI.techs();
  document.getElementById('briefBox').innerHTML=UI.brief();
  document.getElementById('projBox').innerHTML=UI.projection();
  document.getElementById('actBox').innerHTML=UI.actions();

  const a=Battle.A(DB.meta.sides.SELF);
  document.getElementById('techBox').querySelectorAll('[data-tech]').forEach(el=>{
    el.onclick=()=>{
      if(!Battle.awaitInput) return;
      if(el.classList.contains('no')){ if(Tut.on&&!Tut.allowTech(el.dataset.tech)) Tut.deny(); return; }
      const id=el.dataset.tech;
      Battle.selected = Battle.selected===id?null:id;
      Battle.empowered=false; UI.renderBattle();
    };
  });
  document.getElementById('ringBox').querySelectorAll('[data-stance]').forEach(el=>{
    el.onclick=()=>{
      if(!Battle.awaitInput||el.classList.contains('cur')) return;
      if(el.classList.contains('no')) return;
      const id=el.dataset.stance;
      if(!Tut.allowStance(id)){ Tut.deny(); return; }
      if(Net.active){ Net.action({kind:'stance',id}); Battle.selected=null; return; }
      if(Battle.changeStance(DB.meta.sides.SELF,id)){ Battle.selected=null; UI.renderBattle(); Tut.notify({type:'stance',id}); }
    };
  });
  const ab=document.getElementById('actBox');
  ab.querySelectorAll('[data-act]').forEach(b=>{
    const act=b.dataset.act;
    if(act==='quit'){ b.onclick=UI.quitBattle; return; }
    if(act==='codex'){ b.onclick=()=>{ App.backTo='battle'; UI.showScreen('codex'); }; return; }
    if(act==='unsel'){ b.onclick=()=>{ Battle.selected=null; UI.renderBattle(); }; return; }
    if(!on_(act)){
      if(Tut.on && Battle.awaitInput) b.classList.add('tutlock');  /* 눌러서 안내를 볼 수 있게 남겨 둔다 */
      else b.disabled=true;
    }
    b.onclick=()=>{
      if(!Battle.awaitInput) return;
      if(act==='use'||act==='useEmp'){
        const id=Battle.selected;
        if(!Tut.allowTech(id)){ Tut.deny(); return; }
        if(Net.active){ Net.action({kind:'tech',id,empowered:act==='useEmp'}); return; }
        Battle.humanAct(()=>Battle.useTech(DB.meta.sides.SELF,id,act==='useEmp'));
        Tut.notify({type:'tech',id});
      }else{
        if(!Tut.allowBasic(act)){ Tut.deny(); return; }
        if(Net.active){ Net.action({kind:'basic',id:act}); return; }
        Battle.humanAct(()=>Battle.basic(DB.meta.sides.SELF,act));
        Tut.notify({type:'basic',id:act});
      }
    };
  });
  function on_(act){
    if(!Battle.awaitInput) return false;
    if(['use','useEmp'].includes(act)) return Tut.allowTech(Battle.selected);
    return Tut.allowBasic(act);
  }

  const log=document.getElementById('logBox');
  log.innerHTML=s.log.slice(-90).map(l=>
    `<p class="lg-${l.cls}"><span class="lg-t">${l.t}</span>${U.esc(l.text)}</p>`).join('');
  log.scrollTop=log.scrollHeight;
  Tut.refresh();
};

UI.optCard = function(kind, id, attrs, extra){
  const map={ weapon:DB.weapons, chain:DB.chains, trait:DB.traits,
              sigil:DB.sigils, milestone:DB.milestones };
  const o=map[kind][id]; if(!o) return '';
  const head={ weapon:'무기', chain:'연계', trait:'단련', sigil:'각인', milestone:'전환점' }[kind];
  let sub='';
  if(kind==='chain'){
    const f=U.stance(o.from), t=U.stance(o.to);
    sub=`<div class="tc-sub"><span style="color:var(${f.color})">${UI.sym(f)} ${U.esc(f.name)}</span>
      <span style="color:var(--ink-4)">에서</span>
      <span style="color:var(${t.color})">${UI.sym(t)} ${U.esc(t.name)}</span></div>`;
  }
  const bar={ weapon:'--acc', chain:'--L-side', trait:'--warn', sigil:'--L-low', milestone:'--L-high' }[kind];
  const wide = kind==='weapon'||kind==='milestone';
  return `<div class="tech ${wide?'':'mini'}" ${attrs||''} style="width:${wide?214:196}px">
    <div class="tc-line" style="background:var(${bar})"></div>
    <div class="tc-body">
      <div class="tc-top"><div style="flex:1">
        <div class="tc-name">${U.esc(o.name)}</div>
        <div class="tc-sub"><span>${head}</span>${extra?`<span style="color:var(--ok)">${U.esc(extra)}</span>`:''}</div>
      </div></div>
      ${sub}
      <div class="tc-text">${U.esc(o.desc)}</div>
    </div></div>`;
};
