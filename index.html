<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101522">
  <title>TIMELINE — 두뇌 서바이벌</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0e15;--panel:#121824;--panel2:#171f2e;--line:#283449;--text:#f2f5fa;--muted:#9aa8bc;--blue:#77a7ff;--gold:#f3c76a;--red:#ff7483;--green:#64d7b0;--radius:18px;font-family:Inter,"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#26344a 0,#111722 42%,var(--bg) 78%);color:var(--text);min-height:100vh}button,input,select{font:inherit}button{color:inherit;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.screen{display:none;min-height:100vh;padding:clamp(20px,5vw,54px) 18px}.screen.active{display:flex;align-items:center;justify-content:center}.wrap{width:min(980px,100%);margin:auto}.hero{text-align:center;margin:0 auto 34px}.hero h1{font-size:clamp(2.8rem,9vw,6.4rem);letter-spacing:.16em;margin:.28em 0 .1em;text-shadow:0 8px 40px #000}.hero h1 span{color:var(--gold)}.hero p{color:var(--muted);letter-spacing:.1em;font-size:.9rem}.panel{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(145deg,rgba(26,35,51,.96),rgba(16,22,33,.96));box-shadow:0 22px 80px #0005}.home-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,.72fr);gap:16px;max-width:980px;margin:auto;align-items:stretch}.home-panel{padding:clamp(20px,4vw,34px);max-width:none;margin:0}.profile-panel{padding:clamp(20px,4vw,34px);display:flex;flex-direction:column;justify-content:center}.profile-panel .field{margin:0}.field{display:grid;gap:8px;margin-bottom:18px}.home-section-title{font-size:.95rem;margin:0 0 14px;color:#e1e8f2}.field label,.label{font-size:.78rem;font-weight:800;color:#c4cedc}.input,select{width:100%;border:1px solid #35435a;border-radius:12px;background:#0e1420;color:var(--text);padding:13px 14px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}.divider{border:0;border-top:1px solid var(--line);margin:26px 0}.btn{border:1px solid #3a4962;border-radius:12px;padding:12px 16px;background:#202b3c;font-weight:800;transition:transform .15s,border-color .15s,background .15s}.btn:hover:not(:disabled){transform:translateY(-1px);border-color:#7895c2}.btn.primary{background:var(--gold);border-color:var(--gold);color:#17130b}.btn.blue{background:#315da7;border-color:#4779cd}.btn.ghost{background:transparent}.btn.danger{color:var(--red)}.btn.block{width:100%}.hint{font-size:.8rem;line-height:1.6;color:var(--muted)}.home-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.topline{display:flex;align-items:center;gap:14px;margin-bottom:18px}.topline h2{font-size:1.05rem;letter-spacing:.06em;margin:0}.grow{flex:1}.room-code{font-size:clamp(1.8rem,6vw,3rem);font-weight:900;letter-spacing:.28em;text-align:center;color:var(--gold);margin:12px 0}.center{text-align:center}.lobby{max-width:760px;padding:clamp(20px,4vw,34px);margin:auto}.lobby-sub{color:var(--muted);text-align:center;margin:0 0 22px}.roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:18px 0 24px}.seat{display:flex;align-items:center;gap:10px;padding:12px;background:#0d1420;border:1px solid var(--line);border-radius:12px;min-height:54px}.seat-name{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.seat-meta{margin-left:auto;color:var(--muted);font-size:.72rem}.seat-meta.offline{color:var(--red)}.lobby-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.arena{width:min(1080px,100%);margin:auto}.arena-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.round-chip{display:inline-flex;align-items:center;border:1px solid var(--line);background:#111a28;border-radius:999px;padding:7px 11px;font-size:.78rem;font-weight:850;color:var(--gold)}.timer{font-variant-numeric:tabular-nums;font-size:1.1rem;font-weight:900;color:var(--gold);min-width:48px;text-align:right}.timer.urgent{color:var(--red)}.arena-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px}.challenge{padding:clamp(20px,4vw,34px);min-height:400px}.challenge h2{font-size:clamp(1.5rem,4vw,2.3rem);margin:0 0 8px}.prompt{font-size:1rem;line-height:1.75;color:#d4deeb;max-width:720px}.stage-note{color:var(--muted);font-size:.78rem;margin-top:12px}.private-card,.study-card{margin:22px 0;padding:16px;border-radius:13px;border:1px solid #4d4260;background:#241e31}.private-card strong{color:#dbb6ff}.study-card{text-align:center;border-color:#4b5f7e;background:#111e31}.study-sequence{font-size:clamp(1.4rem,6vw,3.5rem);letter-spacing:.16em;font-variant-numeric:tabular-nums;font-weight:900;color:#fff;padding:15px 0 5px}.answer-box{margin-top:24px}.answer-box[hidden],.private-card[hidden],.study-card[hidden],.result-box[hidden],.waiting-box[hidden]{display:none}.answer-row{display:flex;gap:9px;margin-top:10px}.answer-row .input{max-width:250px}.candidate-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:14px}.candidate{padding:13px;text-align:left;border:1px solid var(--line);border-radius:12px;background:#111a28}.candidate.selected{border-color:var(--gold);background:#2a271e}.candidate small{display:block;color:var(--muted);font-size:.72rem;margin-top:4px}.waiting-box{margin-top:22px;padding:16px;background:#0d1420;border:1px solid var(--line);border-radius:12px;color:#cbd6e5}.result-box{margin-top:20px;padding:17px;border:1px solid #695a37;background:#211d14;border-radius:13px}.result-box h3{margin:0 0 9px;color:var(--gold)}.result-box ul{margin:0;padding-left:20px;color:#d7deea;line-height:1.8}.side-panel{padding:17px;height:max-content}.side-panel h3{font-size:.8rem;letter-spacing:.1em;color:var(--muted);margin:0 0 12px}.score-list{display:grid;gap:8px}.score-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;background:#0d1420}.score-row.me{border:1px solid #4d6591}.score-row.out{opacity:.48}.rank{color:var(--gold);font-weight:900;font-size:.78rem}.score-name{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.83rem}.score-points{font-weight:900;font-variant-numeric:tabular-nums}.score-sub{grid-column:2/4;color:var(--muted);font-size:.68rem;margin-top:-5px}.roster-status{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:.72rem;color:var(--muted);line-height:1.6}.finish-card{padding:clamp(25px,6vw,55px);text-align:center;max-width:700px;margin:auto}.finish-card h1{font-size:clamp(2rem,6vw,3.6rem);margin:10px 0}.finish-rank{display:grid;gap:8px;max-width:420px;margin:24px auto}.toast{position:fixed;z-index:10;left:50%;bottom:20px;transform:translate(-50%,18px);opacity:0;pointer-events:none;padding:11px 16px;border:1px solid #43516a;border-radius:12px;background:#182132;box-shadow:0 10px 40px #0008;transition:.2s;max-width:calc(100vw - 30px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.connection{font-size:.74rem;color:var(--green)}.connection.offline{color:var(--red)}
    @media(max-width:760px){.home-layout{grid-template-columns:1fr}.arena-grid{grid-template-columns:1fr}.side-panel{order:2}.score-list{grid-template-columns:repeat(2,minmax(0,1fr))}.challenge{min-height:0}.roster{grid-template-columns:1fr}.arena-head{flex-wrap:wrap}.arena-head .grow{flex-basis:10px}.form-row,.home-actions{grid-template-columns:1fr}.candidate-list{grid-template-columns:1fr 1fr}.screen{align-items:flex-start!important;padding-top:max(20px,env(safe-area-inset-top))!important;padding-bottom:max(20px,env(safe-area-inset-bottom))!important}}
  .strategy-board{margin:18px 0;padding:14px;border:1px solid #31435b;border-radius:14px;background:#0b1421}.strategy-market{display:flex;flex-wrap:wrap;gap:8px;margin:9px 0 13px}.strategy-tile{min-width:42px;padding:8px 12px;border:1px solid #b68b4c;border-radius:9px;background:#20202a;color:#f2c46d;text-align:center;font-weight:800}.strategy-log{margin:0;padding-left:20px;color:#aebbd0;font-size:.86rem;line-height:1.7}
  .chat-panel{width:min(1200px,100%);margin:16px auto 0;padding:18px}.chat-panel h3{margin:0 0 12px}.chat-messages{height:170px;overflow:auto;padding:10px 12px;margin-bottom:12px;border:1px solid #27364b;border-radius:11px;background:#09111d}.chat-line{padding:5px 0;color:#d7e1ef;font-size:.88rem;line-height:1.45;overflow-wrap:anywhere}.chat-line strong{color:#f2c46d;margin-right:7px}.chat-line time{color:#718198;font-size:.72rem;margin-right:8px}.result-note{color:#c6d2e2;line-height:1.55}.chat-panel .answer-row{grid-template-columns:minmax(0,1fr) auto}
  </style>
</head>
<body>
  <main id="app">
    <section id="home" class="screen active">
      <div class="wrap">
        <header class="hero"><h1><span>TIMELINE</span></h1></header>
        <div class="home-layout">
        <div class="panel home-panel">
          <h2 class="home-section-title">새 방 만들기</h2>
          <div class="form-row">
            <div class="field"><label for="maxPlayers">방 최대 인원</label><select id="maxPlayers" class="input"></select></div>
            <div class="field"><button id="createRoom" class="btn primary block">만들기</button></div>
          </div>
          <hr class="divider">
          <h2 class="home-section-title">코드로 참가</h2>
          <div class="field"><label for="roomCodeInput">초대 코드</label><input id="roomCodeInput" class="input" maxlength="6" autocomplete="off" placeholder="예: 4K8T2M" style="text-transform:uppercase;letter-spacing:.2em"></div>
          <button id="joinRoom" class="btn blue block">참가</button>
        </div>
        <div class="panel profile-panel">
          <h2 class="home-section-title">플레이어 정보</h2>
          <div class="field"><label for="playerName">닉네임</label><input id="playerName" class="input" maxlength="18" autocomplete="nickname"><p class="hint" style="margin:0">방을 만들거나 참가할 때 공통으로 사용합니다.</p></div>
        </div>
        </div>
      </div>
    </section>

    <section id="lobby" class="screen">
      <div class="panel lobby">
        <div class="topline"><button class="btn ghost small" data-home>나가기</button><span class="grow"></span><span id="connectionLobby" class="connection">연결 중</span></div>
        <div class="center label">대기실</div><div id="lobbyCode" class="room-code">------</div>
        <p id="lobbySub" class="lobby-sub">참가자를 기다리는 중</p>
        <div id="roster" class="roster"></div>
        <div class="lobby-actions"><button id="copyCode" class="btn">초대 코드 복사</button><button id="startGame" class="btn primary" hidden>게임 시작</button></div>
        <p id="lobbyHint" class="hint center" style="margin-top:18px"></p>
      </div>
    </section>

    <section id="arena" class="screen">
      <div class="arena">
        <header class="arena-head"><span id="roundChip" class="round-chip">1라운드</span><span class="grow"></span><span id="connectionArena" class="connection">연결 중</span><span id="timer" class="timer">--</span></header>
        <div class="arena-grid">
          <article class="panel challenge">
            <h2 id="challengeTitle">문제 준비 중</h2><p id="challengePrompt" class="prompt"></p><div id="strategyBoard" class="strategy-board" hidden></div>
            <div id="privateCard" class="private-card" hidden><strong id="privateHeading">나만의 단서</strong><p id="privateText" style="margin:8px 0 0;line-height:1.65"></p></div>
            <div id="studyCard" class="study-card" hidden><div class="label">순서를 기억하세요</div><div id="studySequence" class="study-sequence"></div></div>
            <div id="answerBox" class="answer-box" hidden></div>
            <div id="waitingBox" class="waiting-box" hidden></div>
            <div id="resultBox" class="result-box" hidden></div>
          </article>
          <aside class="panel side-panel"><h3 id="scoreHeading">현재 승점</h3><div id="scoreList" class="score-list"></div><div id="roomStatus" class="roster-status"></div></aside>
        </div>
        <section class="panel chat-panel"><h3>공개 대화</h3><div id="chatMessages" class="chat-messages" aria-live="polite"></div><div class="answer-row"><input id="chatInput" class="input" maxlength="240" autocomplete="off" placeholder="메시지"><button id="sendChat" class="btn">전송</button></div></section>
      </div>
    </section>

    <section id="finished" class="screen">
      <div class="panel finish-card"><h1 id="winnerName">우승자</h1><div id="finishRank" class="finish-rank"></div><button id="backHome" class="btn primary">타이틀로 돌아가기</button></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
  (() => {
    const $ = selector => document.querySelector(selector);
    const screens = ['home','lobby','arena','finished'];
    const home = $('#home'), nameInput = $('#playerName'), roomInput = $('#roomCodeInput');
    let session = null, snapshot = null, socket = null, reconnectTimer = null, clockTimer = null;
    let reconnectDelay = 700, lastSeq = -1, chosenAnswer = null, chosenPhaseId = null, toastTimer = null;
    const savedName = localStorage.getItem('timeline.playerName');
    if (savedName) nameInput.value = savedName;
    for (let n=2;n<=8;n++) { const option=document.createElement('option'); option.value=String(n); option.textContent=`${n}명`; $('#maxPlayers').append(option); }
    try { const saved = sessionStorage.getItem('timeline.roomSession'); if (saved) { session=JSON.parse(saved); if (session?.code&&session?.token) connect(); else session=null; } } catch { session=null; }

    function showScreen(id) { for (const item of screens) $('#'+item).classList.toggle('active',item===id); }
    function toast(message) { const node=$('#toast'); node.textContent=message; node.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>node.classList.remove('show'),2800); }
    function setConnection(connected) { for (const id of ['connectionLobby','connectionArena']) { const node=$('#'+id); node.textContent=connected?'연결됨':'재접속 중'; node.classList.toggle('offline',!connected); } }
    async function api(path, body) {
      const response=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
      const data=await response.json().catch(()=>({message:'서버 응답을 읽을 수 없습니다.'}));
      if (!response.ok) throw new Error(data.message||'요청을 처리하지 못했습니다.');
      return data;
    }
    function validName() { const name=nameInput.value.trim(); if (!name) { toast('닉네임을 입력해 주세요.'); nameInput.focus(); return null; } localStorage.setItem('timeline.playerName',name); return name; }
    async function createRoom() {
      const name=validName(); if (!name) return;
      $('#createRoom').disabled=true;
      try { const result=await api('/api/rooms',{name,maxPlayers:Number($('#maxPlayers').value)}); enterRoom({...result,name}); }
      catch(error) { toast(error.message); $('#createRoom').disabled=false; }
    }
    async function joinRoom() {
      const name=validName(); if (!name) return;
      const code=roomInput.value.trim().toUpperCase(); if (!/^[A-HJ-NP-Z2-9]{6}$/.test(code)) { toast('초대 코드를 확인해 주세요.'); roomInput.focus(); return; }
      $('#joinRoom').disabled=true;
      try { const result=await api(`/api/rooms/${encodeURIComponent(code)}/join`,{name}); enterRoom({...result,name}); }
      catch(error) { toast(error.message); $('#joinRoom').disabled=false; }
    }
    function enterRoom(data) {
      session={code:data.code,token:data.token,playerId:data.playerId,name:data.name};
      sessionStorage.setItem('timeline.roomSession',JSON.stringify(session)); lastSeq=-1; reconnectDelay=700; snapshot=null; connect();
    }
    function connect() {
      if (!session) return;
      clearTimeout(reconnectTimer);
      const scheme=location.protocol==='https:'?'wss:':'ws:';
      const next=new WebSocket(`${scheme}//${location.host}/ws/${encodeURIComponent(session.code)}?token=${encodeURIComponent(session.token)}`);
      socket=next;
      next.addEventListener('open',()=>{ if(socket!==next)return; reconnectDelay=700; setConnection(true); next.send(JSON.stringify({type:'sync',lastSeq})); });
      next.addEventListener('message',event=>{ if(socket!==next)return; try { handleMessage(JSON.parse(event.data)); } catch { toast('오류가 발생했습니다.'); } });
      next.addEventListener('close',()=>{ if(socket!==next)return; setConnection(false); if(session) { reconnectTimer=setTimeout(connect,reconnectDelay); reconnectDelay=Math.min(5000,reconnectDelay*1.7); } });
      next.addEventListener('error',()=>next.close());
    }
    function send(message) { if(socket?.readyState!==WebSocket.OPEN) { toast('재접속 후 다시 시도해 주세요.'); return false; } socket.send(JSON.stringify(message)); return true; }
    function handleMessage(message) {
      if (message.type==='error') { chosenAnswer=null; toast(message.message||'요청을 처리하지 못했습니다.'); if(snapshot?.game) renderGame(snapshot); return; }
      if (!['room','state'].includes(message.type)) return;
      const sequence=message.game?.seq??message.seq;
      if (sequence!=null && sequence<lastSeq) return;
      snapshot=message; if(sequence!=null) lastSeq=sequence;
      if(message.status==='closed') { if(socket)socket.close(1000,'방 종료'); socket=null; session=null; sessionStorage.removeItem('timeline.roomSession'); showScreen('home'); toast('방이 닫혔습니다.'); return; }
      if (message.status==='waiting') renderLobby(message);
      else if (message.game?.phase==='finished' || message.status==='finished') renderFinish(message);
      else renderGame(message);
    }
    function escapeHtml(value) { return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); }
    function renderLobby(data) {
      showScreen('lobby'); $('#lobbyCode').textContent=data.code; const connected=(data.players||[]).filter(player=>player.connected).length;
      $('#lobbySub').textContent=`${data.players.length}/${data.maxPlayers}명 · 접속 ${connected}명`;
      const rows=(data.players||[]).map(player=>`<div class="seat"><span class="seat-name">${escapeHtml(player.name)}${player.id===data.hostId?' · 방장':''}</span><span class="seat-meta ${player.connected?'':'offline'}">${player.connected?'접속':'오프라인'}</span></div>`);
      $('#roster').innerHTML=rows.join(''); const canStart=data.isHost&&data.players.length>=2&&data.players.every(player=>player.connected);
      $('#startGame').hidden=!data.isHost; $('#startGame').disabled=!canStart;
      $('#lobbyHint').hidden=!data.isHost||canStart; $('#lobbyHint').textContent='2명 이상 · 전원 접속 후 시작';
      setConnection(socket?.readyState===WebSocket.OPEN);
    }
    function renderChat(messages) {
      const box=$('#chatMessages'); if(!box)return;
      const rows=(messages||[]).slice(-60).map(message=>{
        const time=new Date(Number(message.at)||Date.now()).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
        return '<div class="chat-line"><time>'+escapeHtml(time)+'</time><strong>'+escapeHtml(message.name)+'</strong>'+escapeHtml(message.text)+'</div>';
      });
      box.innerHTML=rows.join('')||'<div class="chat-line" style="color:#718198">대화 없음</div>';
      box.scrollTop=box.scrollHeight;
    }
    function sendChat() {
      const input=$('#chatInput'), text=input.value.trim();
      if(!text)return;
      if(send({type:'chat',text}))input.value='';
    }
    function renderGame(data) {
      const game=data.game; if(!game)return; showScreen('arena');
      if(game.you?.submitted) chosenAnswer=game.you.answer??null;
      else if(chosenPhaseId!==game.phaseId) { chosenAnswer=null; chosenPhaseId=game.phaseId; }
      $('#roundChip').textContent=game.stage==='final'?'결승 '+game.finalIndex+'/'+(game.finalRoundCount||3):game.round+'라운드';
      $('#challengeTitle').textContent='문제 유형 · '+(game.title||'확인 중');
      $('#challengePrompt').textContent=game.prompt||'';
      const privateCard=$('#privateCard'); privateCard.hidden=!game.privateInfo;
      if(game.privateInfo) { $('#privateHeading').textContent=game.privateInfo.heading||'내 단서'; $('#privateText').textContent=game.privateInfo.text||''; }
      const study=$('#studyCard'); study.hidden=game.phase!=='study'; $('#studySequence').textContent=game.studySequence||'';
      const board=$('#strategyBoard'); board.hidden=game.type!=='strategy';
      if(game.type==='strategy') {
        const market=(game.market||[]).map(card=>'<span class="strategy-tile">'+Number(card.value)+'</span>').join('');
        const history=(game.moves||[]).map(move=>'<li>'+escapeHtml(move.name)+' · '+escapeHtml(move.value)+'</li>').join('');
        board.innerHTML='<div class="label">남은 타일</div><div class="strategy-market">'+market+'</div><div class="label">선택 기록</div><ol class="strategy-log">'+history+'</ol>';
      }
      renderAnswer(game); renderChat(data.chat||[]);
      const waiting=$('#waitingBox');
      const waitingForTurn=game.phase==='turn'&&!game.yourTurn;
      waiting.hidden=!(waitingForTurn||(game.phase==='answer'&&game.you?.submitted));
      if(waitingForTurn) waiting.textContent='차례: '+(game.turnPlayerName||'참가자')+' · '+game.turnNumber+'/'+game.turnCount;
      else if(!waiting.hidden) waiting.textContent='제출 완료 · 답 대기';
      const result=$('#resultBox'); result.hidden=!game.result;
      if(game.result) result.innerHTML='<h3>'+escapeHtml(game.result.headline)+'</h3>'+
        (game.result.subline?'<p class="result-note">'+escapeHtml(game.result.subline)+'</p>':'')+
        '<ul>'+(game.result.lines||[]).map(line=>'<li>'+escapeHtml(line.text)+'</li>').join('')+'</ul>';
      $('#scoreHeading').textContent=game.stage==='final'?'결승 점수':'점수';
      const ranked=[...(data.players||[])].sort((a,b)=>game.stage==='final'?b.finalScore-a.finalScore||b.score-a.score:b.score-a.score);
      $('#scoreList').innerHTML=ranked.map((player,index)=>'<div class="score-row '+(player.id===data.youId?'me ':'')+(player.eliminated?'out':'')+'"><span class="rank">'+String(index+1).padStart(2,'0')+'</span><span class="score-name">'+escapeHtml(player.name)+(player.id===data.youId?' (나)':'')+(player.team?' · '+escapeHtml(player.team)+'팀':'')+'</span><span class="score-points">'+(game.stage==='final'?player.finalScore:player.score)+'</span><span class="score-sub">'+(player.eliminated?player.eliminatedRound+'라운드 탈락':game.stage==='final'?'본선 '+player.score+'점 · 이번 결승 '+player.finalScore+'점':'이번 라운드 '+(player.roundPoints>=0?'+':'')+player.roundPoints+'점')+'</span></div>').join('');
      const active=(data.players||[]).filter(player=>!player.eliminated);
      $('#roomStatus').textContent='생존 '+active.length+'명';
      $('#timer').classList.toggle('urgent',Number(game.deadlineAt)-Date.now()<5000);
      setConnection(socket?.readyState===WebSocket.OPEN); updateTimer(game.deadlineAt);
    }
    function renderAnswer(game) {
      const box=$('#answerBox'); box.replaceChildren();
      const canAnswer=(game.phase==='answer'&&!game.you?.submitted)||(game.phase==='turn'&&game.yourTurn);
      box.hidden=!canAnswer; if(box.hidden)return;
      if(game.inputKind==='choice') {
        const list=document.createElement('div'); list.className='candidate-list';
        for(const option of game.options||[]) {
          const button=document.createElement('button'); button.type='button';
          button.className='candidate '+(chosenAnswer===option.value?'selected':'');
          button.innerHTML=escapeHtml(option.label)+'<small>선택</small>';
          button.addEventListener('click',()=>{chosenAnswer=option.value; renderAnswer(game);});
          list.append(button);
        }
        box.append(list);
        const submit=document.createElement('button'); submit.type='button'; submit.className='btn primary';
        submit.style.marginTop='12px'; submit.textContent='제출'; submit.disabled=!chosenAnswer;
        submit.addEventListener('click',()=>submitAnswer(chosenAnswer)); box.append(submit);
        return;
      }

      if(game.inputKind==='strategy') {
        const list=document.createElement('div'); list.className='candidate-list';
        for(const card of game.market||[]) {
          const button=document.createElement('button'); button.type='button'; button.className='candidate';
          button.textContent='타일 '+card.value+' 가져가기';
          button.addEventListener('click',()=>submitAnswer(card.id)); list.append(button);
        }
        box.append(list); return;
      }

      if(game.inputKind==='indianPoker') {
        const row=document.createElement('div'); row.className='answer-row';
        const guess=document.createElement('input'); guess.className='input'; guess.type='number';
        guess.min='2'; guess.max='14'; guess.step='1'; guess.inputMode='numeric'; guess.placeholder='예상 2~14';
        guess.autocomplete='off';
        const wager=document.createElement('input'); wager.className='input'; wager.type='number';
        wager.min='0'; wager.max='5'; wager.step='1'; wager.inputMode='numeric'; wager.placeholder='베팅 0~5';
        wager.autocomplete='off';
        const submit=document.createElement('button'); submit.type='button'; submit.className='btn primary'; submit.textContent='제출';
        submit.addEventListener('click',()=>submitAnswer({guess:guess.value,wager:wager.value}));
        row.append(guess,wager,submit); box.append(row); return;
      }

      if(game.inputKind==='bid') {
        const row=document.createElement('div'); row.className='answer-row';
        const bid=document.createElement('input'); bid.className='input'; bid.type='number';
        bid.min='0'; bid.max='10'; bid.step='1'; bid.inputMode='numeric'; bid.placeholder='입찰액';
        bid.autocomplete='off';
        const submit=document.createElement('button'); submit.type='button'; submit.className='btn primary'; submit.textContent='봉인 입찰';
        submit.addEventListener('click',()=>submitAnswer({bid:bid.value}));
        row.append(bid,submit); box.append(row); return;
      }

      const row=document.createElement('div'); row.className='answer-row';
      const input=document.createElement('input'); input.className='input'; input.id='answerInput';
      input.type='text'; input.autocomplete='off'; input.placeholder=game.placeholder||'답';
      input.maxLength=game.maxLength||4; input.inputMode=game.inputKind==='text'?'text':'numeric';
      input.value=typeof chosenAnswer==='string'?chosenAnswer:'';
      input.addEventListener('input',()=>{chosenAnswer=input.value;});
      const submit=document.createElement('button'); submit.type='button'; submit.className='btn primary';
      submit.textContent='답 제출'; submit.addEventListener('click',()=>submitAnswer(input.value));
      row.append(input,submit); box.append(row);
      input.addEventListener('keydown',event=>{if(event.key==='Enter')submitAnswer(input.value);});
    }
    function submitAnswer(answer) {
      if(!snapshot?.game)return;
      const game=snapshot.game;
      const canAnswer=(game.phase==='answer'&&!game.you?.submitted)||(game.phase==='turn'&&game.type==='strategy'&&game.yourTurn);
      if(!canAnswer)return;
      if(answer==null||String(answer).trim()==='') { toast('답을 입력하거나 선택하세요.'); return; }
      if(game.inputKind==='memory'&&!/^\d{16}$/.test(String(answer).replace(/\s/g,''))) { toast('16자리 숫자를 입력해 주세요.'); return; }
      if(game.type==='stateInference'&&!/^[01]{8}$/.test(String(answer).trim())) { toast('8비트를 입력해 주세요.'); return; }
      if(game.inputKind==='number'&&!/^-?\d{1,4}$/.test(String(answer).trim())) { toast('정수를 입력해 주세요.'); return; }
      if(game.inputKind==='indianPoker') {
        const guess=Number(answer.guess), wager=Number(answer.wager);
        if(!Number.isInteger(guess)||guess<2||guess>14||!Number.isInteger(wager)||wager<0||wager>5) { toast('예상 2~14, 베팅 0~5를 입력해 주세요.'); return; }
      }
      if(game.inputKind==='bid'&&!/^\d{1,2}$/.test(String(answer.bid??''))) { toast('입찰액을 입력해 주세요.'); return; }
      const payload=typeof answer==='object'?answer:String(answer).trim();
      if(!send({type:'action',phaseId:game.phaseId,actionId:crypto.randomUUID(),answer:payload}))return;
      const button=$('#answerBox button'); if(button)button.disabled=true;
    }
    function updateTimer(deadline) {
      clearInterval(clockTimer); const draw=()=>{const remaining=Math.max(0,Math.ceil((Number(deadline)-Date.now())/1000)); $('#timer').textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;}; draw(); clockTimer=setInterval(draw,250);
    }
    function renderFinish(data) {
      clearInterval(clockTimer); showScreen('finished'); const winner=data.players.find(player=>player.id===data.game.winnerId); $('#winnerName').textContent=winner?.name||'우승자';
      
      const ranked=[...data.players].sort((a,b)=>b.finalScore-a.finalScore||b.score-a.score);
      $('#finishRank').innerHTML=ranked.map((player,index)=>`<div class="score-row ${player.id===data.game.winnerId?'me':''}"><span class="rank">${String(index+1).padStart(2,'0')}</span><span class="score-name">${escapeHtml(player.name)}</span><span class="score-points">${player.finalScore}점</span></div>`).join('');
    }
    $('#createRoom').addEventListener('click',createRoom); $('#joinRoom').addEventListener('click',joinRoom);
    $('#sendChat').addEventListener('click',sendChat); $('#chatInput').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();sendChat();}});
    roomInput.addEventListener('input',()=>roomInput.value=roomInput.value.toUpperCase()); roomInput.addEventListener('keydown',event=>{if(event.key==='Enter')joinRoom();});
    $('#startGame').addEventListener('click',()=>send({type:'start'}));
    $('#copyCode').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(snapshot?.code||'');toast('초대 코드를 복사했습니다.');}catch{toast(`초대 코드: ${snapshot?.code||''}`);}});
    $('#backHome').addEventListener('click',()=>{if(socket)socket.close(1000,'완료');socket=null;session=null;snapshot=null;sessionStorage.removeItem('timeline.roomSession');$('#createRoom').disabled=false;$('#joinRoom').disabled=false;showScreen('home');});
    document.querySelectorAll('[data-home]').forEach(button=>button.addEventListener('click',()=>{if(snapshot?.status==='waiting')send({type:'leave'});if(socket)socket.close(1000,'나가기');socket=null;session=null;sessionStorage.removeItem('timeline.roomSession');$('#createRoom').disabled=false;$('#joinRoom').disabled=false;showScreen('home');}));
  })();
  </script>
</body>
</html>
