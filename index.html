<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE TIMELINE</title>
<style>
/* ============================================================================
   NEUMORPHIC LIGHT THEME — 토큰
   ============================================================================ */
:root{
  /* 사용자 지정 5색 팔레트 */
  --p-soft:#b8b8d1;
  --p-deep:#5b5f97;
  --p-yellow:#ffc145;
  --p-white:#fffffb;
  --p-coral:#ff6b6c;

  --bg:var(--p-white); --sf:var(--p-soft); --sf-2:var(--p-white);
  --ink:var(--p-deep); --ink-2:var(--p-deep); --ink-3:var(--p-deep); --ink-4:var(--p-soft);
  --line:var(--p-soft); --sh-d:rgba(91,95,151,.34); --sh-l:var(--p-white);
  --acc:var(--p-yellow); --acc-soft:color-mix(in srgb,var(--p-yellow) 42%,var(--p-white));
  --ok:var(--p-deep); --warn:var(--p-yellow); --dang:var(--p-coral);

  /* 진영별 색조 */
  --self:var(--p-deep); --self-bg:color-mix(in srgb,var(--p-soft) 76%,var(--p-white));
  --self-sd:rgba(91,95,151,.38); --self-sl:var(--p-white);
  --foe:var(--p-coral); --foe-bg:color-mix(in srgb,var(--p-coral) 42%,var(--p-white));
  --foe-sd:rgba(255,107,108,.34); --foe-sl:var(--p-white);

  /* 공격 방향 색 */
  --L-high:var(--p-coral); --L-mid:var(--p-deep); --L-low:var(--p-yellow);
  --L-side:var(--p-soft); --L-none:var(--p-deep);

  /* 자원 색 */
  --c-hp:var(--p-coral); --c-hp2:var(--p-coral);
  --c-sta:var(--p-deep); --c-sta2:var(--p-soft);
  --c-foc:var(--p-yellow); --c-foc2:var(--p-yellow);
  --c-time:var(--p-deep);

  --r-s:8px; --r-m:14px; --r-l:22px;
  --fs:15px; --t:190ms; --e:cubic-bezier(.33,.9,.32,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(1200px 620px at 18% -8%, #fffffb 0%, rgba(255,255,251,0) 62%),
                   radial-gradient(1000px 520px at 108% 112%, #fffffb 0%, rgba(255,255,251,0) 58%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"Pretendard","Noto Sans KR","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:var(--fs);line-height:1.6;letter-spacing:-.012em;overflow:hidden;
  font-variant-numeric:tabular-nums;
}
body.no-anim *{transition:none !important;animation:none !important}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
#stage{position:relative;flex:1;overflow:hidden}

/* ---------- 기본 뉴모피즘 ---------- */
.nm{background:var(--sf);border-radius:var(--r-m);box-shadow:5px 5px 12px var(--sh-d),-5px -5px 12px var(--sh-l)}
.nm-in{background:var(--sf);border-radius:var(--r-m);box-shadow:inset 4px 4px 9px var(--sh-d),inset -4px -4px 9px var(--sh-l)}
.nm-sm{background:var(--sf);border-radius:var(--r-s);box-shadow:2px 2px 5px var(--sh-d),-2px -2px 5px var(--sh-l)}

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{background:var(--sf);border-radius:var(--r-m);padding:11px 19px;font-weight:650;letter-spacing:.01em;
  box-shadow:5px 5px 11px var(--sh-d),-5px -5px 11px var(--sh-l);color:var(--ink);white-space:nowrap;
  transition:box-shadow var(--t) var(--e),transform var(--t) var(--e),color var(--t) var(--e)}
.btn:hover:not(:disabled){box-shadow:3px 3px 7px var(--sh-d),-3px -3px 7px var(--sh-l);transform:translateY(1px)}
.btn:active:not(:disabled){box-shadow:inset 4px 4px 9px var(--sh-d),inset -4px -4px 9px var(--sh-l);transform:translateY(2px)}
.btn:disabled{color:var(--ink-4);box-shadow:2px 2px 5px var(--sh-d),-2px -2px 5px var(--sh-l);cursor:not-allowed}
.btn.on{box-shadow:inset 4px 4px 9px var(--sh-d),inset -4px -4px 9px var(--sh-l);color:var(--acc)}
.btn.sm{padding:7px 13px;font-size:.85em;border-radius:var(--r-s)}
.btn.xs{padding:4px 10px;font-size:.78em;border-radius:var(--r-s)}
.btn.wide{width:100%;text-align:center}
.btn.acc{color:var(--acc)}
.btn.tutlock{color:var(--ink-4);opacity:.55;box-shadow:2px 2px 5px var(--sh-d),-2px -2px 5px var(--sh-l)}
.btn.dang{color:var(--dang)}

/* ---------- 태그 ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:.72em;font-weight:700;letter-spacing:.03em;color:var(--ink-2);white-space:nowrap;
  background:var(--sf);box-shadow:2px 2px 4px var(--sh-d),-2px -2px 4px var(--sh-l)}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8}
.tag.n::before{display:none}
.tag.in{box-shadow:inset 2px 2px 4px var(--sh-d),inset -2px -2px 4px var(--sh-l)}
.tag.t-high{color:var(--L-high)} .tag.t-mid{color:var(--L-mid)}
.tag.t-low{color:var(--L-low)} .tag.t-side{color:var(--L-side)} .tag.t-none{color:var(--L-none)}
.tag.t-key{color:var(--ink-2)} .tag.t-warn{color:var(--warn)} .tag.t-dang{color:var(--dang)}
.tag.t-ok{color:var(--ok)} .tag.t-acc{color:var(--acc)}

/* ---------- 화면 ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.active{display:flex;animation:fade var(--t) var(--e)}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;gap:9px;padding:12px 16px 6px;flex-wrap:wrap}
.topbar .grow{flex:1}
.page{flex:1;overflow-y:auto;padding:4px 16px 20px;scrollbar-width:thin}
.page::-webkit-scrollbar{width:8px}
.page::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.card-box{padding:17px 19px;margin-bottom:14px}
.h2{font-size:1.02em;font-weight:800;letter-spacing:.04em;margin-bottom:10px;display:flex;align-items:center;gap:9px}
.h2::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--acc);opacity:.85}
.h3{font-size:.8em;font-weight:800;letter-spacing:.1em;color:var(--ink-3);margin:14px 0 8px}
.muted{color:var(--ink-2)} .dim{color:var(--ink-3);font-size:.86em}
.rowwrap{display:flex;gap:10px;flex-wrap:wrap}
.center{text-align:center}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
ul.bul{list-style:none} ul.bul li{position:relative;padding-left:16px;margin:6px 0}
ul.bul li::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.6}

/* ---------- 타이틀 ---------- */
#screen-title{align-items:center;justify-content:center;gap:30px;padding:24px}
.title-mark{text-align:center}
.title-mark h1{font-size:clamp(34px,7vw,62px);font-weight:800;letter-spacing:.13em;margin-left:.13em;
  text-shadow:2px 2px 4px var(--sh-d),-2px -2px 4px var(--sh-l)}
.title-mark .sub{color:var(--ink-3);font-size:.8em;letter-spacing:.34em;margin-top:8px}
.title-rule{width:min(400px,76vw);height:14px;border-radius:999px;margin:20px auto 0;position:relative;overflow:hidden;
  box-shadow:inset 3px 3px 6px var(--sh-d),inset -3px -3px 6px var(--sh-l)}
.title-rule i{position:absolute;top:4px;height:6px;width:6px;border-radius:999px;background:var(--acc);opacity:.5}
.menu{display:flex;flex-direction:column;gap:12px;width:min(330px,82vw)}
.title-foot{color:var(--ink-3);font-size:.75em;letter-spacing:.09em;text-align:center}

/* ---------- 게이지 ---------- */
.gauge{height:12px;border-radius:999px;overflow:hidden;position:relative;
  box-shadow:inset 3px 3px 6px var(--sh-d),inset -3px -3px 6px var(--sh-l)}
.gauge>i{display:block;height:100%;border-radius:999px;transition:width 400ms var(--e)}
.g-hp>i{background:linear-gradient(90deg,var(--c-hp2),var(--c-hp))}
.g-hp.self>i{background:linear-gradient(90deg,#5b5f97,var(--self))}
.g-sta>i{background:linear-gradient(90deg,var(--c-sta2),var(--c-sta))}
.g-foc>i{background:linear-gradient(90deg,var(--c-foc2),var(--c-foc))}
.gauge.big{height:16px}
.bar-lab{font-size:.7em;letter-spacing:.07em;color:var(--ink-3);margin-bottom:3px;font-weight:700;
  display:flex;justify-content:space-between;gap:6px}
.bar-lab b{color:var(--ink-2)}

/* ---------- 자세 기호 ---------- */
.sty{display:inline-block;width:0;height:0;vertical-align:middle;flex:none}
.sty-up{border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid currentColor}
.sty-down{border-left:6px solid transparent;border-right:6px solid transparent;border-top:10px solid currentColor}
.sty-square{width:10px;height:10px;background:currentColor;border-radius:2px}
.sty-diag{width:9px;height:9px;background:currentColor;transform:rotate(45deg);border-radius:2px}
.sty-ring{width:11px;height:11px;border:3px solid currentColor;border-radius:50%;background:transparent}

/* ============================================================================
   전투 화면
   ============================================================================ */
#screen-battle.active{display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;height:100%;gap:0;overflow:hidden}

/* 적 패널 */
.duobar{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 14px 6px}
@media(max-width:760px){
  .duobar{grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px 5px}
  .panel{padding:9px 10px;gap:6px}
  .panel .duo{grid-template-columns:1fr;gap:5px}
  .pl-name{font-size:.94em}.pl-hp{font-size:.86em}
  .stance-badge{padding:3px 8px;font-size:.72em}
}
.ringwrap{padding:0 14px 8px}
.panel{padding:11px 14px;display:flex;flex-direction:column;gap:7px;flex:1;min-width:0;
  border-radius:var(--r-m);position:relative;overflow:hidden}
.panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.panel.p-self{background:var(--self-bg);
  box-shadow:5px 5px 12px var(--self-sd),-5px -5px 12px var(--self-sl)}
.panel.p-self::before{background:var(--self)}
.panel.p-foe{background:var(--foe-bg);
  box-shadow:5px 5px 12px var(--foe-sd),-5px -5px 12px var(--foe-sl)}
.panel.p-foe::before{background:var(--foe)}
.panel.p-self .gauge,.panel.p-foe .gauge{box-shadow:inset 3px 3px 6px rgba(91,95,151,.12),inset -2px -2px 5px rgba(255,255,251,.75)}
.pl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pl-name{font-weight:800;letter-spacing:.03em;font-size:1.02em}
.pl-hp{margin-left:auto;font-weight:800;font-size:.95em}
.pl-hp small{color:var(--ink-3);font-weight:600}
.st-row{display:flex;gap:5px;flex-wrap:wrap;min-height:18px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:9px}

/* 자세 배지 */
.stance-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;
  font-size:.78em;font-weight:800;letter-spacing:.04em;
  box-shadow:inset 2px 2px 5px var(--sh-d),inset -2px -2px 5px var(--sh-l)}
.stance-badge .sty{margin-right:1px}

/* ---------- 시간축 ---------- */
.tlwrap{padding:4px 14px 8px}
.tl{padding:10px 14px 8px;background:linear-gradient(180deg,#fffffb,#fffffb)}
.tl-lane{background:linear-gradient(180deg,#fffffb,#fffffb)}
.tl-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tl-now{font-size:1.06em;font-weight:800;letter-spacing:.02em}
.tl-now small{color:var(--ink-3);font-weight:600;font-size:.72em;letter-spacing:.08em;margin-right:5px}
.tl-grid{position:relative}
.tl-lane{position:relative;height:34px;border-radius:10px;overflow:hidden;
  box-shadow:inset 3px 3px 7px var(--sh-d),inset -3px -3px 7px var(--sh-l)}
.tl-lane+.tl-axis{margin:5px 0}
.tl-axis{position:relative;height:20px}
.tl-tk{position:absolute;top:0;font-size:.66em;color:var(--ink-4);text-align:center}
.tl-tk::after{content:"";display:block;width:1px;height:5px;background:var(--line);margin:2px auto 0}
.tl-tk.mj{color:var(--ink-3);font-weight:700}
.tl-lab{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:.64em;letter-spacing:.11em;
  color:var(--ink-4);font-weight:800;pointer-events:none;z-index:1}
.tl-ent{position:absolute;top:5px;height:26px;border-radius:7px;display:flex;align-items:center;gap:5px;
  padding:0 9px 0 10px;font-size:.74em;font-weight:750;white-space:nowrap;z-index:3;cursor:help;
  background:var(--sf);box-shadow:2px 2px 5px var(--sh-d),-2px -2px 5px var(--sh-l);
  transform:translateX(-50%);transition:left 380ms var(--e)}
.tl-ent::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;background:currentColor}
.tl-ent.ghost{background:transparent;box-shadow:none;border:1px dashed currentColor;opacity:.8;font-weight:600}
.tl-ent.ghost::before{display:none}
.tl-ent b{font-weight:850}
.tl-rdy{position:absolute;top:-2px;bottom:-2px;width:3px;border-radius:2px;z-index:4;transition:left 380ms var(--e)}
.tl-rdy.self{background:var(--self)} .tl-rdy.foe{background:var(--foe)}
.tl-rdy.ghost{background:var(--ink-4);opacity:.6}
.tl-head{position:absolute;top:0;bottom:0;left:0;width:2px;background:var(--ink);opacity:.3;z-index:5;border-radius:2px}

/* 거리 트랙 — 두 사람 사이의 간격을 공간으로 보여 준다 */
.track{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.track .cap{font-size:.68em;letter-spacing:.09em;color:var(--ink-4);font-weight:800}
.trk{position:relative;flex:1;min-width:240px;height:46px;border-radius:10px;padding:0 6px;
  box-shadow:inset 3px 3px 7px var(--sh-d),inset -3px -3px 7px var(--sh-l);display:flex;align-items:center}
.trk .cells{display:flex;width:100%;gap:4px}
.trk .cell{flex:1;height:34px;border-radius:7px;position:relative;
  display:flex;align-items:flex-end;justify-content:center;font-size:.6em;font-weight:800;
  color:var(--ink-3);padding-bottom:3px;background:rgba(255,255,251,.4)}
.trk .cell.reach{background:var(--acc-soft);color:var(--acc)}
.trk .cell.gap{background:rgba(255,255,251,.55)}
.trk .tok{position:absolute;top:1px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-size:.58em;font-weight:850;transition:left 380ms var(--e);z-index:2;
  background:var(--sf);box-shadow:3px 3px 6px var(--sh-d),-3px -3px 6px var(--sh-l)}
.trk .tok.me{color:var(--self);left:2px}
.trk .tok.foe{color:var(--foe)}
.trk .gapline{position:absolute;top:50%;height:2px;border-radius:2px;background:var(--ink-4);opacity:.35;
  transition:all 380ms var(--e);z-index:1}
.track .now{font-weight:800;font-size:.86em}
.track .now b{color:var(--acc)}

/* 거리 표시 */
.dist{display:flex;align-items:center;gap:5px;margin-left:auto}
.dist .cap{font-size:.68em;letter-spacing:.09em;color:var(--ink-4);font-weight:800;margin-right:3px}
.dist i{width:17px;height:17px;border-radius:5px;position:relative;
  box-shadow:inset 2px 2px 4px var(--sh-d),inset -2px -2px 4px var(--sh-l);transition:all var(--t) var(--e)}
.dist i.on{background:var(--acc);box-shadow:2px 2px 4px var(--sh-d),-2px -2px 4px var(--sh-l)}
.dist i.rng{background:var(--acc-soft)}

/* ---------- 자기 패널 + 자세 링 ---------- */
.ring{padding:9px 12px 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ring-head{flex:none}
.ring-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ring-row{display:flex;gap:7px;flex-wrap:wrap;flex:1}
.snode{flex:1;min-width:76px;padding:7px 6px 8px;border-radius:10px;text-align:center;cursor:pointer;position:relative;
  background:var(--sf);box-shadow:3px 3px 7px var(--sh-d),-3px -3px 7px var(--sh-l);
  transition:box-shadow var(--t) var(--e),transform var(--t) var(--e),opacity var(--t) var(--e)}
.snode:hover:not(.cur):not(.no){transform:translateY(-2px)}
.snode.cur{box-shadow:inset 3px 3px 7px var(--sh-d),inset -3px -3px 7px var(--sh-l);cursor:default}
.snode.cur .sn-name{color:var(--acc)}
.snode.no{opacity:.45;cursor:not-allowed}
.sn-sym{height:12px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);margin-bottom:3px}
.snode.cur .sn-sym{color:var(--acc)}
.sn-name{font-size:.8em;font-weight:800;letter-spacing:.03em}
.sn-cost{font-size:.66em;color:var(--ink-4);font-weight:700;margin-top:2px}
.sn-thr{position:absolute;top:4px;right:5px;font-size:.6em;font-weight:800;padding:1px 4px;border-radius:4px}
.sn-thr.bad{color:var(--dang)} .sn-thr.good{color:var(--ok)}

/* ---------- 기술 카드 ---------- */
.techwrap{padding:0 14px 10px;min-height:0;overflow:hidden;display:grid;
  grid-template-columns:minmax(0,1fr) 258px;gap:12px}
.techcol{min-width:0;min-height:0;overflow-y:auto;padding-right:4px;display:flex;flex-direction:column;gap:4px}
.techcol::-webkit-scrollbar{width:8px}
.techcol::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.btfoot{display:flex;flex-direction:column;gap:8px;padding:0 14px 12px}
.techrow{display:flex;gap:11px;flex-wrap:wrap;align-content:flex-start}
.tech{
  --card-accent:var(--L-none);--card-bg:#fffffb;
  width:194px;flex:0 0 194px;padding:0;border-radius:13px;cursor:pointer;position:relative;overflow:hidden;
  border:1px solid color-mix(in srgb,var(--card-accent) 30%,var(--line));
  background:linear-gradient(145deg,color-mix(in srgb,var(--card-accent) 10%,#fffffb) 0%,var(--card-bg) 58%,#fffffb 100%);
  box-shadow:4px 5px 11px rgba(91,95,151,.38),-3px -3px 8px rgba(255,255,251,.72);
  transition:transform var(--t) var(--e),box-shadow var(--t) var(--e),opacity var(--t) var(--e),border-color var(--t) var(--e)}
.tech.line-high{--card-accent:var(--L-high);--card-bg:#fffffb}
.tech.line-mid{--card-accent:var(--L-mid);--card-bg:#fffffb}
.tech.line-low{--card-accent:var(--L-low);--card-bg:#fffffb}
.tech.line-side{--card-accent:var(--L-side);--card-bg:#fffffb}
.tech.line-none{--card-accent:var(--L-none);--card-bg:#fffffb}
.tech::after{content:"";position:absolute;inset:6px 0 auto;height:36px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,251,.28),transparent)}
.tech:hover:not(.no){transform:translateY(-3px);border-color:var(--card-accent);
  box-shadow:6px 9px 16px rgba(91,95,151,.4),-3px -3px 8px rgba(255,255,251,.7)}
.tech.sel{transform:translateY(-1px);border-color:var(--acc);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 70%,transparent),5px 7px 14px rgba(91,95,151,.38)}
.tech.no{opacity:.48;filter:saturate(.45);cursor:not-allowed}.tech.no:hover{transform:none}
.tech.mini{width:184px;flex-basis:184px}
.tc-line{height:6px;width:100%;position:relative;z-index:1;box-shadow:0 1px 3px rgba(91,95,151,.22)}
.tc-body{padding:10px 11px 11px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:2}
.tc-top{display:flex;align-items:flex-start;gap:8px}
.tc-name{font-weight:850;font-size:1em;letter-spacing:.015em;flex:1;line-height:1.25;color:#5b5f97}
.tc-cost{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;
  font-size:.78em;font-weight:900;color:#fffffb;background:var(--card-accent);
  box-shadow:0 3px 7px color-mix(in srgb,var(--card-accent) 38%,transparent),inset 0 1px 1px rgba(255,255,251,.3)}
.tc-sub{display:flex;align-items:center;gap:6px;font-size:.69em;font-weight:800;color:#5b5f97;
  letter-spacing:.035em;flex-wrap:wrap}
.tc-sub>span{white-space:nowrap}
/* 미니 시간 막대: 준비(진한) + 빈틈(연한) */
.tbar{display:flex;gap:2px;align-items:center;padding:4px 6px;border-radius:6px;background:rgba(255,255,251,.34)}
.tbar i{width:7px;height:10px;border-radius:2px;background:#5b5f97;opacity:.27}
.tbar i.cast{background:var(--card-accent);opacity:.95}
.tbar i.rec{background:#5b5f97;opacity:.42}
.tbar .tb-lab{font-size:.93em;color:#5b5f97;margin-left:3px;font-weight:800}
/* 사거리 점 */
.rdots{display:flex;gap:3px;padding:3px 5px;border-radius:5px;background:rgba(255,255,251,.3)}
.rdots i{width:9px;height:9px;border-radius:3px;background:#b8b8d1}
.rdots i.on{background:var(--card-accent)}
.rdots i.cur{box-shadow:0 0 0 2px var(--card-bg),0 0 0 3px #5b5f97}
.tc-text{font-size:.79em;color:#5b5f97;line-height:1.5;min-height:42px;padding:7px 8px;
  border-left:3px solid var(--card-accent);border-radius:3px 7px 7px 3px;background:rgba(255,255,251,.34)}
.tc-foot{display:flex;align-items:center;gap:6px;border-top:1px solid color-mix(in srgb,var(--card-accent) 23%,var(--line));
  padding-top:7px;font-size:.71em}
.tc-to{display:inline-flex;align-items:center;gap:4px;color:#5b5f97;font-weight:800}
.tc-emp{font-size:.72em;color:#5b5f97;border-top:1px solid rgba(255,107,108,.3);padding:6px 7px 0;line-height:1.45}
.tc-mult{margin-left:auto;font-weight:900;padding:1px 5px;border-radius:5px;background:rgba(255,255,251,.35)}
.tc-mult.up{color:var(--dang)} .tc-mult.dn{color:var(--ok)}

.secthead{display:flex;align-items:center;gap:8px;font-size:.73em;font-weight:800;letter-spacing:.09em;color:var(--ink-3)}
.secthead .ln{flex:1;height:1px;background:var(--line)}

/* 지금 상황 요약 */
.brief{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:9px 13px;border-radius:var(--r-m);
  box-shadow:inset 3px 3px 7px var(--sh-d),inset -3px -3px 7px var(--sh-l);font-size:.85em}
.brief .hd{font-size:.78em;font-weight:850;letter-spacing:.08em;color:var(--ink-3)}
.brief .th{font-weight:800}
.brief .th.hot{color:var(--dang)}
.brief .adv{color:var(--ok);font-weight:800}
.brief .sep{color:var(--ink-4)}
.brief .chip{padding:2px 9px;border-radius:999px;font-weight:800;font-size:.9em;
  box-shadow:2px 2px 4px var(--sh-d),-2px -2px 4px var(--sh-l)}

/* 기력 소모 미리보기 */
.gauge .ghostcost{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,
  rgba(91,95,151,.55) 0 5px, rgba(91,95,151,.2) 5px 10px);border-radius:999px}
.costline{display:flex;align-items:center;gap:6px;font-size:.72em;font-weight:750;color:var(--ink-3)}
.costline b{color:var(--ink-2)}

/* 카드 잠금 사유 */
.tc-block{font-size:.73em;font-weight:850;color:#5b5f97;background:rgba(255,107,108,.09);
  border:1px solid rgba(255,107,108,.22);border-radius:6px;padding:5px 7px}
.tc-good{position:absolute;top:9px;right:48px;font-size:.65em;font-weight:900;padding:2px 7px;border-radius:999px;
  color:#fffffb;background:var(--ok);box-shadow:0 3px 7px rgba(91,95,151,.28);z-index:4}
.tech.best:not(.sel){box-shadow:0 0 0 2px var(--ok),4px 6px 12px rgba(91,95,151,.38)}
.tech.best:hover:not(.no):not(.sel){box-shadow:0 0 0 2px var(--ok),6px 9px 16px rgba(91,95,151,.42)}

/* 판정 미리보기 */
.proj{padding:10px 13px;border-radius:var(--r-m);display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:.83em;
  box-shadow:inset 3px 3px 7px var(--sh-d),inset -3px -3px 7px var(--sh-l)}
.proj b{font-weight:850} .proj .sep{color:var(--ink-4)}
.proj .ok{color:var(--ok);font-weight:750} .proj .bad{color:var(--dang);font-weight:750}

/* 기록 */
.side{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden}
.log{flex:1;overflow-y:auto;padding:9px 11px;background:#fffffb;font-size:.78em;line-height:1.6;border-radius:var(--r-m);min-height:90px;
  box-shadow:inset 4px 4px 9px var(--sh-d),inset -4px -4px 9px var(--sh-l)}
.log p{padding:2px 0;border-bottom:1px solid rgba(184,184,209,.45)}
.log p:last-child{border-bottom:0}
.log .lg-s{color:var(--self)} .log .lg-f{color:var(--foe)} .log .lg-n{color:var(--ink-3)}
.log .lg-t{color:var(--ink-4);font-size:.9em;margin-right:5px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

@media(min-width:901px){
  #screen-battle.active{grid-template-rows:auto auto auto minmax(190px,1fr) auto}
  .duobar{padding:9px 14px 5px}
  .tlwrap{padding-bottom:6px}
  .tl-lane{height:38px}
  .tl-ent{top:6px}
  .ringwrap{padding-bottom:7px}
  .techwrap{grid-template-columns:minmax(0,1fr) clamp(260px,24vw,340px);gap:14px}
  .techcol{padding:5px 8px 12px 3px}
  .techrow{display:flex;gap:11px}
  .tech{width:194px;flex:0 0 194px}
  .tech.mini{width:184px;flex-basis:184px}
  .side{padding-bottom:4px}
  .log{font-size:.82em;line-height:1.68;background:#fffffb}
  .btfoot{padding-top:8px;border-top:1px solid rgba(184,184,209,.7)}
  .acts .btn{min-height:42px}
}
@media(max-width:900px){
  .techwrap{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(92px,24vh)}
  .tech,.tech.mini{width:calc(50% - 6px);min-width:150px}
  .tl{padding:9px 10px 7px}
  .ring{gap:9px}
}
/* 좁은 화면에서는 고정 높이 배분 대신 화면 전체를 스크롤시킨다 */
@media(max-width:760px),(max-height:620px){
  #ann{top:38%;width:min(420px,94vw)}
  .ann-item{font-size:.92em;padding:7px 13px}
  #screen-battle.active{display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
  .techwrap{display:flex;flex-direction:column;overflow:visible;min-height:auto}
  .techcol{overflow:visible;min-height:auto}
  .side{overflow:visible;min-height:auto}
  .log{max-height:34vh;min-height:110px}
  .btfoot{position:sticky;bottom:0;background:var(--bg);padding-top:8px;z-index:6;
    box-shadow:0 -8px 14px var(--bg)}
  .tech,.tech.mini{width:100%;max-width:340px}
  .tl-lab{display:none}
}

/* ---------- 지도 ---------- */
.mapgrid{display:flex;flex-direction:column-reverse;gap:13px;padding:6px 0 10px}
.maprow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.mapnode{width:134px;padding:12px 10px;border-radius:var(--r-m);text-align:center;cursor:pointer;background:var(--sf);
  box-shadow:5px 5px 12px var(--sh-d),-5px -5px 12px var(--sh-l);
  transition:transform var(--t) var(--e),box-shadow var(--t) var(--e),opacity var(--t) var(--e)}
.mapnode:hover:not(.locked):not(.done){transform:translateY(-3px)}
.mapnode.locked{opacity:.38;cursor:not-allowed;box-shadow:2px 2px 5px var(--sh-d),-2px -2px 5px var(--sh-l)}
.mapnode.done{box-shadow:inset 4px 4px 9px var(--sh-d),inset -4px -4px 9px var(--sh-l);opacity:.55}
.mapnode.current{box-shadow:6px 6px 14px var(--sh-d),-6px -6px 14px var(--sh-l)}
.mapnode.current .nd-t{color:var(--acc)}
.mapnode.current::after{content:"";display:block;width:26px;height:3px;border-radius:2px;background:var(--acc);opacity:.7;margin:8px auto 0}
.nd-t{font-weight:800;letter-spacing:.03em;margin-bottom:3px}
.nd-d{font-size:.73em;color:var(--ink-3);line-height:1.4}

/* ---------- 모달 ---------- */
.modal{position:absolute;inset:0;background:rgba(255,255,251,.8);backdrop-filter:blur(3px);z-index:60;
  display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex;animation:fade 160ms var(--e)}
.modal-box{width:min(760px,95vw);max-height:88vh;overflow-y:auto;padding:20px 22px;border-radius:var(--r-l);
  background:var(--sf);box-shadow:8px 8px 18px var(--sh-d),-8px -8px 18px var(--sh-l)}
.grid-a{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:11px}

/* ---------- 설정 ---------- */
.set-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.set-row:last-child{border-bottom:0}
.set-row .lab{flex:1;min-width:180px}
.set-row .lab b{display:block;font-weight:750}
.set-row .lab span{font-size:.8em;color:var(--ink-3)}
.seg{display:flex;gap:5px;padding:4px;border-radius:var(--r-m);
  box-shadow:inset 3px 3px 7px var(--sh-d),inset -3px -3px 7px var(--sh-l)}

/* ---------- 상성 표 ---------- */
.mtx{width:100%;border-collapse:separate;border-spacing:4px;font-size:.8em}
.mtx th{font-weight:800;color:var(--ink-3);font-size:.9em;letter-spacing:.05em;padding:4px}
.mtx td{text-align:center;padding:7px 4px;border-radius:8px;font-weight:800;
  box-shadow:inset 2px 2px 4px var(--sh-d),inset -2px -2px 4px var(--sh-l)}
.mtx td.up{color:var(--dang)} .mtx td.dn{color:var(--ok)} .mtx td.eq{color:var(--ink-4)}

/* ---------- 튜토리얼 오버레이 ---------- */
#tutLayer{position:absolute;inset:0;z-index:70;pointer-events:none;display:none}
#tutLayer.on{display:block}
#tutDim{position:absolute;inset:0;background:rgba(255,255,251,.55);transition:opacity var(--t) var(--e)}
#tutRing{position:absolute;border-radius:14px;pointer-events:none;
  box-shadow:0 0 0 3px var(--acc),0 0 0 9px rgba(91,95,151,.16),0 0 26px rgba(91,95,151,.3);
  transition:all 260ms var(--e)}
#tutRing.hide{opacity:0}
/* 설명 대상만 어둠 위로 끌어올려 실제 스포트라이트처럼 보이게 한다 */
.tut-focus{position:relative;z-index:72}
.tut-focus.tech,.tut-focus.snode,.tut-focus.btn{box-shadow:0 0 0 2px var(--acc),5px 5px 12px var(--sh-d),-5px -5px 12px var(--sh-l)}
#tutBox{position:absolute;width:min(430px,88vw);padding:15px 17px;border-radius:var(--r-l);pointer-events:auto;
  background:var(--sf);box-shadow:8px 8px 20px var(--sh-d),-8px -8px 20px var(--sh-l);transition:all 260ms var(--e)}
#tutBox .tt{font-weight:800;letter-spacing:.03em;margin-bottom:6px;display:flex;align-items:center;gap:8px}
#tutBox .tt .num{font-size:.7em;color:var(--ink-4);font-weight:700}
#tutBox .tb{font-size:.88em;color:var(--ink-2);line-height:1.62}
#tutBox .tf{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
#tutBox .lockmsg{font-size:.8em;color:var(--dang);font-weight:750;margin-top:8px;display:none}
#tutBox .lockmsg.on{display:block;animation:pop 260ms var(--e)}
#tutBox .steps{margin-top:9px;padding:9px 11px;border-radius:10px;font-size:.83em;line-height:1.55;
  box-shadow:inset 3px 3px 6px var(--sh-d),inset -3px -3px 6px var(--sh-l)}
#tutBox .steps b{color:var(--acc)}
#tutBox .hintline{font-size:.86em;color:var(--acc);font-weight:800;margin-top:10px;
  padding:8px 11px;border-radius:10px;background:var(--acc-soft);
  box-shadow:inset 2px 2px 5px rgba(91,95,151,.06),inset -2px -2px 5px rgba(255,255,251,.7);
  display:flex;align-items:center;gap:7px}
#tutBox .hintline::before{content:"지금 할 일";font-size:.76em;font-weight:850;letter-spacing:.06em;
  padding:2px 8px;border-radius:999px;background:var(--sf);color:var(--acc);flex:none;
  box-shadow:2px 2px 4px var(--sh-d),-2px -2px 4px var(--sh-l)}
.tutdots{display:flex;gap:4px;margin-left:auto}
.tutdots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.tutdots i.on{background:var(--acc)}

/* ---------- 초기 빌드 구성 ---------- */
.ptbar{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:11px 14px;border-radius:var(--r-m);margin-bottom:12px;background:var(--sf);
  box-shadow:5px 5px 12px var(--sh-d),-5px -5px 12px var(--sh-l)}
.ptbar .pt{font-size:1.15em;font-weight:850;letter-spacing:.02em}
.ptbar .pt b{color:var(--acc)}
.ptbar .pt.over b{color:var(--dang)}
.pick{position:relative;cursor:pointer;transition:transform var(--t) var(--e),opacity var(--t) var(--e)}
.pick:hover{transform:translateY(-3px)}
.pick.on .tech{box-shadow:inset 4px 4px 10px var(--sh-d),inset -4px -4px 10px var(--sh-l)}
.pick.on .tc-name{color:var(--acc)}
.pick.dis{opacity:.42;cursor:not-allowed}
.pick.dis:hover{transform:none}
.pick .cost{position:absolute;top:7px;right:8px;font-size:.66em;font-weight:850;padding:2px 8px;border-radius:999px;
  color:var(--warn);background:var(--sf);box-shadow:2px 2px 4px var(--sh-d),-2px -2px 4px var(--sh-l);z-index:4}
.pick.on .cost{color:var(--acc)}
.stepper{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:var(--r-m);
  box-shadow:inset 3px 3px 7px var(--sh-d),inset -3px -3px 7px var(--sh-l);flex-wrap:wrap}
.stepper .nm{font-weight:800;min-width:78px}
.stepper .val{font-weight:850;min-width:62px;text-align:center}
.stepper .hint{font-size:.78em;color:var(--ink-3)}

/* ---------- 유파 선택 ---------- */
.school{padding:16px 17px;border-radius:var(--r-l);cursor:pointer;display:flex;flex-direction:column;gap:9px;
  background:var(--sf);box-shadow:5px 5px 12px var(--sh-d),-5px -5px 12px var(--sh-l);
  transition:transform var(--t) var(--e),box-shadow var(--t) var(--e)}
.school:hover{transform:translateY(-3px);box-shadow:7px 10px 18px var(--sh-d),-5px -5px 12px var(--sh-l)}
.school.sel{box-shadow:inset 4px 4px 10px var(--sh-d),inset -4px -4px 10px var(--sh-l)}
.school h4{font-size:1.1em;font-weight:800;letter-spacing:.04em}

/* ---------- 중앙 알림 ---------- */
#ann{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);z-index:55;
  pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px;width:min(560px,92vw)}
.ann-item{display:flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;
  background:var(--sf);box-shadow:6px 6px 14px var(--sh-d),-6px -6px 14px var(--sh-l);
  backdrop-filter:blur(2px);opacity:.97;
  font-weight:800;letter-spacing:.01em;white-space:nowrap;max-width:100%;
  animation:annIn 260ms var(--e)}
.ann-item.out{animation:annOut 280ms var(--e) forwards}
.ann-item .who{font-size:.72em;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:999px;
  box-shadow:inset 2px 2px 4px var(--sh-d),inset -2px -2px 4px var(--sh-l)}
.ann-item .who.s{color:var(--self)} .ann-item .who.f{color:var(--foe)}
.ann-item .big{font-size:1.22em;font-weight:850}
.ann-item .sm{font-size:.84em;font-weight:700;color:var(--ink-2)}
.ann-item.dmg{background:linear-gradient(180deg,#fffffb,#fffffb)}
.ann-item.dmg-self{background:linear-gradient(180deg,#fffffb,#fffffb)}
.ann-item.warn{background:linear-gradient(180deg,#f7 efe6,#fffffb);background:linear-gradient(180deg,#fffffb,#fffffb)}
.ann-item.info{background:linear-gradient(180deg,#fffffb,#fffffb)}
.ann-item .mult{font-weight:850}
.ann-item .mult.up{color:var(--dang)} .ann-item .mult.dn{color:var(--ok)}
@keyframes annIn{from{opacity:0;transform:translateY(-10px) scale(.94)}to{opacity:1;transform:none}}
@keyframes annOut{to{opacity:0;transform:translateY(-12px) scale(.97)}}

/* 턴 안내 배너 */
.turnbar{display:flex;align-items:center;gap:9px;padding:8px 13px;border-radius:var(--r-m);
  box-shadow:inset 3px 3px 7px var(--sh-d),inset -3px -3px 7px var(--sh-l);font-size:.86em;flex-wrap:wrap}
.turnbar.you{background:linear-gradient(90deg,#fffffb,#fffffb)}
.turnbar.foe{background:linear-gradient(90deg,#fffffb,#fffffb)}
.turnbar b{font-weight:850}
.turnbar .lead{font-weight:850;letter-spacing:.02em}

/* ---------- 효과 ---------- */
.hit{animation:hit 360ms var(--e)}
@keyframes hit{0%{transform:none}22%{transform:translateX(-5px)}48%{transform:translateX(4px)}74%{transform:translateX(-2px)}100%{transform:none}}
.pop{animation:pop 280ms var(--e)}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.pulse{animation:pulse 1.5s var(--e) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* ---------- 멀티플레이 ---------- */
.multi-shell{width:min(760px,94vw);margin:auto;padding:24px}
.multi-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;align-items:start}
.multi-panel{padding:18px;border-radius:var(--r-m);position:relative}
.multi-panel.create{border-top:4px solid var(--self)}
.multi-panel.join{border-top:4px solid var(--ok)}
.multi-panel-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:.95em;font-weight:850}
.multi-panel-head small{margin-left:auto;color:var(--ink-3);font-size:.72em;font-weight:700}
.multi-panel label{display:block;font-size:.76em;font-weight:800;color:var(--ink-2);margin:10px 0 5px}
.multi-panel input,.multi-panel select{width:100%;border:1px solid transparent;outline:0;padding:11px 13px;border-radius:var(--r-s);
  color:var(--ink);background:var(--sf);font:inherit;box-shadow:inset 3px 3px 7px var(--sh-d),inset -3px -3px 7px var(--sh-l)}
.multi-panel input:focus,.multi-panel select:focus{border-color:var(--acc);box-shadow:inset 2px 2px 5px var(--sh-d),0 0 0 3px var(--acc-soft)}
.form-error{min-height:20px;margin-top:9px;color:var(--dang);font-size:.78em;font-weight:750}
.form-error:empty{visibility:hidden}
.room-code{font-size:clamp(28px,7vw,48px);font-weight:850;letter-spacing:.2em;color:var(--acc);margin:.3em 0}
.net-status{min-height:22px;margin-top:12px;color:var(--ink-3);font-size:.86em}
.net-status.bad{color:var(--dang)} .net-status.ok{color:var(--ok)}
.lobby-players{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}
.lobby-player{padding:9px 12px;border-radius:var(--r-s);background:var(--sf);box-shadow:inset 2px 2px 5px var(--sh-d),inset -2px -2px 5px var(--sh-l)}
@media(max-width:640px){.multi-grid{grid-template-columns:1fr}.multi-shell{padding:14px}}

/* ---------- 휴대기기·태블릿 반응형 보정 ---------- */
html,body{height:100%;height:100dvh;min-height:100%;overscroll-behavior:none}
body{min-width:0}
#app{height:100%;height:100dvh;min-height:0}
#stage,.screen,.page{min-height:0}
.page{-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y}
.topbar{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.multi-shell{width:min(980px,100%);max-width:100%;margin:auto}
.multi-grid{grid-template-columns:minmax(0,1fr) minmax(156px,.55fr) minmax(0,1fr)}
.multi-deck{padding:18px 12px;text-align:center;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:10px}
.multi-deck .btn{white-space:normal}
.invite-actions,.lobby-actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.room-link{display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:9px 11px;margin:8px 0 12px;
  color:var(--ink-2);font-size:.78em;border-radius:var(--r-s);box-shadow:inset 2px 2px 5px var(--sh-d),inset -2px -2px 5px var(--sh-l)}
.lobby-notice{min-height:24px;margin:8px 0;color:var(--acc);font-weight:750}
@media(max-width:1100px),(max-height:820px){
  body{background-attachment:scroll}
  #screen-title{overflow-y:auto;justify-content:flex-start;min-height:100%;padding-top:max(28px,env(safe-area-inset-top))}
  #screen-battle.active{display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;height:100%;-webkit-overflow-scrolling:touch}
  #screen-battle>.duobar,#screen-battle>.tlwrap,#screen-battle>.ringwrap,#screen-battle>.techwrap,#screen-battle>.btfoot{flex:0 0 auto}
  .techwrap{display:flex;flex-direction:column;overflow:visible;min-height:auto}
  .techcol,.side{overflow:visible;min-height:auto}

<script>
/* ==========================================================================================
   ■ 핵심 개발 지침 (절대 원칙):
     1. [하드코딩 절대 금지 및 DB화 위주 개발]:
        - 모든 수치와 비즈니스 로직 파라미터는 전용 DB 테이블에 중앙 집권화하여 관리한다.
        - 로직 및 렌더링 함수 내부에서 임의의 '매직 넘버(Magic Number)'나 인라인 하드코딩을 일체 금지하며,
          데이터 추가 및 밸런스 패치가 DB 수정만으로 완결되도록 구조화한다.
     2. [명칭 정제 및 기본형 중심 현실성 확보]:
        - 과장되거나 작위적인 미사여구 사용은 전면 배제하고, 담백하고 표준적인 기본 용어로 기입한다.
     3. [기존 지침 및 스타일 유지]:
        * 단일 파일 완결성(HTML/CSS/JS), 이모지 사용 전면 배제, 세련된 태그 시스템,
          라이트 테마의 반응형 애니메이션이 포함된 '뉴모피즘 UI'로 개발한다.
        * 또한 해당 지침 주석은 삭제하거나 간략화, 수정, 생략하지 말고 그대로 둔다. 하위의 코드만 수정한다.
     4. [버전 관리 규칙]:
        * 소규모 기능/버그/가시성 패치는 직전 버전에서 +0.1, 대규모 구조/시스템 업데이트는 +1.0으로 버전업한다.
          이번 업데이트 버전은 V0.1부터 시작한다.
     5. [가시성 개선과 시스템 복잡도 분리 원칙]:
        * 모든 편의성 및 가시성, 가독성, 직관성 개선의 목적은 사용자가 정보를 시각적으로 더 직관적이고
          효율적으로 파악하도록 만드는 데 있다.
        * 하지만 이는 로직, 알고리즘, 시스템 자체를 단순화하거나 의사결정 요소를 제거하라는 의미는 아니다.
        * 처음에는 싱글 플레이 먼저 개발 후, 추후 pvp 멀티플레이까지 확장 가능성을 염두에 두고 코드를 작성할 것.
   ========================================================================================== */

/* ==========================================================================================
   [DB] 전역 데이터 테이블 — 모든 수치/문구/규칙의 단일 원천
   ========================================================================================== */
const DB = {

  meta:{
    title:'THE TIMELINE', version:'V5.0', build:'CF',
    footer:'싱글플레이 · PvP 멀티플레이',
    storageKey:'tld_save_v11',
    sides:{ SELF:'P', FOE:'E' },
    sideLabel:{ P:'아군', E:'적군' }
  },

  balance:{
    loop:{ maxIterations:900, aiDelayMs:400, aiDelayFastMs:90 },

    /* 전투 제한 시간 — 도달 시 체력 비율이 높은 쪽이 판정승한다.
       앞선 쪽은 시간을 끌 수 있고 뒤진 쪽은 무리해서라도 피해를 내야 하므로,
       체력 격차 자체가 매 순간의 판단 기준이 된다. */
    tick:{ start:0, maxTickGuard:170, warnRemaining:40 },

    distance:{ min:0, max:4, start:2, labels:['밀착','근접','중거리','원거리','이탈'] },

    resource:{
      staminaStart:7, staminaMax:16, staminaRegenPerTick:2,
      focusStart:0, focusMax:6, focusRegenPerTick:0, hpDefault:70,
      /* 전투가 끝나면 최대 체력의 이 비율만큼을 현재 체력에 더한다 (곱이 아니라 합) */
      postBattleHealRatio:0.80
    },

    /* 자세 바꾸기 — 시간이 아니라 기력을 소모한다.
       전환은 '행동'이 아니므로 시간축이 흐르지 않고, 전환 직후 곧바로 기술을 쓸 수 있다.
       기술마다 사용 후 이동하는 자세가 정해져 있어, 연계가 맞으면 전환 기력을 아끼고
       어긋나면 기력을 태워야 한다. 이것이 이 게임의 빌드 설계 축이다. */
    transition:{
      costPerStep:2, freeSelfLoop:true,
      desc:'자세를 전환합니다. 시간은 흐르지 않고 기력만 소모하며, 먼 자세일수록 비용이 늘어납니다.'
    },

    basic:{
      wait:{ id:'wait', name:'대기', recovery:3, staminaGain:3, focusGain:1,
             desc:'시간축을 3틱 넘깁니다. 기력 3과 집중 1을 회복합니다. 상대의 예고가 3틱 다가옵니다.' },
      approach:{ id:'approach', name:'접근', recovery:2, move:-1, staminaCost:1,
             escalationPerUse:0, escalationDecayTicks:0, escalationMax:0,
             desc:'거리를 1만큼 좁힙니다. 기력 1을 소모하고 빈틈 2틱이 발생합니다.' },
      retreat:{ id:'retreat', name:'이탈', recovery:3, move:1, staminaCost:1,
             escalationPerUse:1, escalationDecayTicks:12, escalationMax:6,
             desc:'거리를 1만큼 벌립니다. 빈틈이 접근보다 1틱 길며, 연속으로 이탈할 때마다 기력 비용이 1씩 누적됩니다.' }
    },

    /* 압박 — 자신이 유효한 피해를 내지 못한 시간이 길어지면 자신에게만 약점이 쌓인다.
       직접 피해가 아니라 약점만 키우므로 승패는 끝까지 기술 전투로 결정되며,
       무한 추격과 무한 회피가 모두 성립하지 않게 된다. */
    pressure:{
      enabled:true, name:'압박', status:'exposed',
      idleTicksBeforeStart:12, stackEveryTicks:3, stacksPerApply:1, maxStacks:10,
      resetOn:{ damageDealt:true, attackResolvedInRange:true, statusDamage:true },
      desc:'자신이 유효한 피해를 내지 못한 시간이 길어지면 약점이 쌓입니다. 공격을 성공시키면 한 번에 사라집니다.'
    },

    /* globalScale — 모든 피해에 곱해지는 단일 조정 계수.
       개별 기술 수치를 건드리지 않고 전투 속도 전체를 조절하기 위한 중앙 손잡이다. */
    damage:{ minimum:0, roundMode:'floor', globalScale:1.50 },
    combat:{ missOnRangeFail:true },
    empower:{ enabled:true, label:'집중 사용' },
    clamp:{ minCast:0, minRecovery:1, minCost:0 },
    slots:{ perStanceBase:3, perStanceMax:5 }
  },

  /* ---------- 공격 방향 ---------- */
  lines:{
    high:{ id:'high', name:'탑', short:'상', tag:'t-high', css:'--L-high',
           desc:'위에서 내리꽂는 궤적입니다. 낮게 버티는 자세를 강하게 타격합니다.' },
    mid:{ id:'mid', name:'미드', short:'중', tag:'t-mid', css:'--L-mid',
           desc:'몸통을 향하는 직선 궤적입니다. 측면에 선 자세를 강하게 파고듭니다.' },
    low:{ id:'low', name:'바텀', short:'하', tag:'t-low', css:'--L-low',
           desc:'아래에서 위로 강하게 쓸어 올리는 궤적입니다. 높은 자세를 강하게 타격합니다.' },
    side:{ id:'side', name:'사이드', short:'측', tag:'t-side', css:'--L-side',
