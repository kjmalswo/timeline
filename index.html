<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151b3d">
  <title>TIMELINE — 두뇌 서바이벌</title>
  <style>
    :root {
      color-scheme:dark;
      --bg:#0c1028; --panel:#151b3d; --panel2:#1b234d; --line:#343f72;
      --text:#f5f6ff; --muted:#b0b9d9; --blue:#a1afff; --indigo:#4355b9;
      --gold:#e8c778; --red:#ff8c9e; --green:#8bd7bd; --radius:18px;
      font-family:Inter,"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
    }
    * { box-sizing:border-box }
    [hidden] { display:none!important }
    body { margin:0; min-height:100vh; background:radial-gradient(ellipse at 50% 0,#242f68 0,var(--bg) 65%); color:var(--text) }
    button,input,select { font:inherit }
    button { color:inherit; cursor:pointer }
    button:disabled { cursor:not-allowed; opacity:.48 }
    button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible { outline:2px solid var(--gold); outline-offset:3px }
    .screen { display:none; min-height:100vh; padding:clamp(20px,5vw,54px) 18px }
    .screen.active { display:flex; align-items:center; justify-content:center }
    .wrap { width:min(980px,100%); margin:auto }
    .hero { text-align:center; margin:0 auto 34px }
    .hero h1 { font-size:clamp(2.4rem,8vw,6rem); letter-spacing:.12em; margin:.28em 0 .1em }
    .hero h1 span { color:var(--gold) }
    .panel { border:1px solid var(--line); border-radius:var(--radius); background:var(--panel); box-shadow:0 18px 60px #05081b55 }
    .home-panel { padding:clamp(20px,4vw,34px); max-width:680px; margin:auto }
    .field { display:grid; gap:8px; margin-bottom:18px }
    .home-section-title { font-size:.95rem; margin:0 0 14px }
    .field label,.label { font-size:.8rem; font-weight:700; color:var(--muted) }
    .input,select { width:100%; min-width:0; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text); padding:13px 14px }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:end }
    .divider { border:0; border-top:1px solid var(--line); margin:26px 0 }
    .btn { min-height:46px; border:1px solid var(--line); border-radius:10px; padding:12px 16px; background:var(--panel2); font-weight:700; transition:background .15s,border-color .15s }
    .btn:hover:not(:disabled) { border-color:var(--blue); background:#29366e }
    .btn.primary { background:var(--gold); border-color:var(--gold); color:#171c37 }
    .btn.primary:hover:not(:disabled) { background:#f4d995; border-color:#f4d995 }
    .btn.blue { background:var(--indigo); border-color:#697bd9 }
    .btn.ghost { background:transparent }
    .btn.danger { color:var(--red) }
    .btn.block { width:100% }
    .hint { font-size:.8rem; line-height:1.6; color:var(--muted) }
    .home-actions { display:grid; grid-template-columns:1fr 1fr; gap:12px }
    .topline { display:flex; align-items:center; gap:14px; margin-bottom:18px }
    .topline h2 { font-size:1.05rem; margin:0 }
    .grow { flex:1 }
    .room-code { font-size:clamp(1.8rem,6vw,3rem); font-weight:800; letter-spacing:.28em; text-align:center; color:var(--gold); margin:12px 0 }
    .center { text-align:center }
    .lobby { width:min(760px,100%); padding:clamp(20px,4vw,34px); margin:auto }
    .lobby-sub { color:var(--muted); text-align:center; margin:0 0 22px }
    .roster { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin:18px 0 24px }
    .seat { display:flex; align-items:center; gap:10px; padding:12px; background:var(--bg); border:1px solid var(--line); border-radius:10px; min-height:54px }
    .seat-name { font-weight:700; overflow-wrap:anywhere }
    .seat-meta { margin-left:auto; color:var(--muted); font-size:.72rem; white-space:nowrap }
    .seat-meta.offline { color:var(--red) }
    .lobby-actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap }
    #arena.screen { align-items:flex-start }
    .arena { width:min(1140px,100%); margin:auto }
    .arena-head { display:flex; align-items:center; gap:12px; margin-bottom:18px; min-height:50px }
    .round-chip { display:inline-flex; align-items:center; border:1px solid #73653e; background:#252a46; border-radius:8px; padding:9px 13px; font-size:.9rem; font-weight:800; color:var(--gold) }
    .phase-label { color:var(--muted); font-size:.8rem }
    .timer-wrap { display:flex; align-items:center; gap:10px; padding-left:14px; border-left:1px solid var(--line) }
    .timer { font-variant-numeric:tabular-nums; font-size:1.5rem; font-weight:800; color:var(--gold); min-width:64px; text-align:right }
    .timer.urgent { color:var(--red) }
    .arena-grid { display:grid; grid-template-columns:minmax(0,1fr) 290px; align-items:start; gap:18px }
    .challenge { min-width:0; padding:clamp(20px,3vw,34px); border-top:3px solid var(--gold) }
    .challenge h2 { font-size:clamp(1.4rem,3vw,2rem); line-height:1.35; margin:0 0 26px; overflow-wrap:anywhere }
    .section-label { display:block; margin:0 0 10px; font-size:.78rem; font-weight:800; letter-spacing:.06em; color:var(--gold) }
    .prompt { font-size:clamp(1.05rem,2vw,1.2rem); font-weight:650; line-height:1.65; margin:0; white-space:pre-line; overflow-wrap:anywhere }
    .question-section { padding-bottom:24px; border-bottom:1px solid var(--line) }
    .condition-section { margin-top:24px }
    .condition-list,.clue-list { list-style:none; padding:0; margin:0; display:grid; gap:10px }
    .condition-list li,.clue-list li { position:relative; padding-left:15px; font-size:.94rem; line-height:1.65; overflow-wrap:anywhere }
    .condition-list li::before,.clue-list li::before { content:""; position:absolute; left:0; top:.7em; width:4px; height:4px; border-radius:50%; background:var(--gold) }
    .puzzle-data { margin-top:18px; padding:18px; border:1px solid var(--line); border-radius:12px; background:var(--bg); overflow-wrap:anywhere }
    .data-lines { display:grid; gap:10px; font-variant-numeric:tabular-nums; line-height:1.6 }
    .data-lines.numbered { margin:0; padding-left:24px }
    .sequence-data { display:flex; flex-wrap:wrap; gap:8px }
    .sequence-number { padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-size:1.15rem; font-variant-numeric:tabular-nums }
    .sequence-number.unknown { color:var(--gold); border-color:var(--gold) }
    .sudoku-grid { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); max-width:360px; margin:auto; border:2px solid var(--blue); background:var(--line); gap:1px }
    .sudoku-cell { display:flex; align-items:center; justify-content:center; aspect-ratio:1; background:var(--panel); font-size:clamp(1rem,4vw,1.4rem); font-variant-numeric:tabular-nums }
    .sudoku-cell.blank { background:#293566; color:var(--gold) }
    .sudoku-cell.box-right { border-right:2px solid var(--blue) }
    .sudoku-cell.box-bottom { border-bottom:2px solid var(--blue) }
    .table-wrap { overflow-x:auto }
    .puzzle-table { width:100%; border-collapse:collapse; font-size:.9rem; font-variant-numeric:tabular-nums }
    .puzzle-table caption { display:table-caption; caption-side:top; text-align:left; padding-bottom:10px }
    .puzzle-table th,.puzzle-table td { padding:10px 8px; border-bottom:1px solid var(--line); text-align:left }
    .puzzle-table th { color:var(--muted); font-size:.76rem }
    .puzzle-table tr:last-child td { border-bottom:0 }
    .private-card,.study-card { margin:24px 0 0; padding:18px; border-radius:12px; border:1px solid #786842; background:#202641 }
    .private-card .section-label { margin-bottom:12px }
    .study-card { text-align:center; border-color:var(--line); background:var(--bg) }
    .study-sequence { display:flex; justify-content:center; flex-wrap:wrap; gap:10px 16px; font-size:clamp(1.4rem,4.6vw,2.4rem); font-variant-numeric:tabular-nums; font-weight:800; letter-spacing:.08em; padding-top:8px }
    .answer-box { margin-top:26px; padding-top:24px; border-top:1px solid var(--line) }
    .answer-row { display:flex; align-items:end; gap:10px }
    .answer-row .input { flex:1 }
    .answer-field { display:grid; flex:1; min-width:0; gap:8px }
    .answer-field label { font-size:.8rem; color:var(--muted); font-weight:700 }
    .candidate-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px }
    .candidate { min-width:0; min-height:52px; display:flex; align-items:center; gap:10px; padding:14px; text-align:left; border:1px solid var(--line); border-radius:10px; background:var(--bg); font-size:.95rem; line-height:1.5; overflow-wrap:anywhere }
    .candidate:hover:not(:disabled) { background:var(--panel2); border-color:var(--blue) }
    .candidate.selected { border-color:var(--gold); background:#2b304b }
    .option-index { display:inline-flex; flex:none; align-items:center; justify-content:center; width:25px; height:25px; border:1px solid var(--line); border-radius:6px; color:var(--muted); font-size:.74rem }
    .candidate.selected .option-index { color:#171c37; background:var(--gold); border-color:var(--gold) }
    .option-text { min-width:0; overflow-wrap:anywhere }
    .candidate-list.long-options { grid-template-columns:1fr }
    .submit-answer { width:100%; margin-top:14px }
    .waiting-box { margin-top:24px; padding:16px; background:var(--bg); border:1px solid var(--line); border-radius:10px; color:var(--muted); line-height:1.5 }
    .result-box { margin-top:24px; padding:18px; border:1px solid #786842; background:#202641; border-radius:12px }
    .result-box h3 { margin:0 0 9px; color:var(--gold) }
    .result-box ul { margin:0; padding-left:20px; line-height:1.8 }
    .result-note { color:var(--muted); line-height:1.65; overflow-wrap:anywhere }
    .arena-side { display:grid; gap:18px; min-width:0 }
    .side-panel { padding:20px; height:max-content }
    .side-panel h3 { font-size:.84rem; color:var(--muted); margin:0 0 16px }
    .score-list { display:grid; gap:8px }
    .score-row { display:grid; grid-template-columns:24px minmax(0,1fr) auto; align-items:center; gap:8px; padding:12px 10px; border:1px solid transparent; border-radius:10px; background:var(--bg) }
    .score-row.me { border-color:#786842; background:#202641 }
    .score-row.out { color:var(--muted) }
    .rank { color:var(--muted); font-weight:800; font-size:.78rem }
    .score-row.me .rank,.score-row.me .score-points { color:var(--gold) }
    .score-name { font-weight:700; overflow-wrap:anywhere; font-size:.87rem; line-height:1.45 }
    .me-tag { display:inline-block; color:var(--gold); font-size:.7rem; margin-left:5px }
    .score-points { font-weight:800; font-size:1.1rem; font-variant-numeric:tabular-nums }
    .score-sub { grid-column:2/4; color:var(--muted); font-size:.72rem; line-height:1.5 }
    .roster-status { margin-top:16px; padding-top:14px; border-top:1px solid var(--line); font-size:.75rem; color:var(--muted) }
    .finish-card { width:min(700px,100%); padding:clamp(25px,6vw,55px); text-align:center; margin:auto }
    .finish-card h1 { font-size:clamp(2rem,6vw,3.6rem); margin:10px 0 }
    .finish-rank { display:grid; gap:8px; max-width:420px; margin:24px auto; text-align:left }
    .toast { position:fixed; z-index:10; left:50%; bottom:20px; transform:translate(-50%,18px); opacity:0; pointer-events:none; padding:11px 16px; border:1px solid var(--line); border-radius:10px; background:var(--panel2); box-shadow:0 10px 40px #0008; transition:.2s; max-width:calc(100vw - 30px); text-align:center }
    .toast.show { opacity:1; transform:translate(-50%,0) }
    .connection { font-size:.74rem; color:var(--green) }
    .connection.offline { color:var(--red) }
    .strategy-board { margin:24px 0 0; padding:18px; border:1px solid var(--line); border-radius:12px; background:var(--bg) }
    .strategy-market { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 16px }
    .strategy-tile { min-width:42px; padding:9px 12px; border:1px solid #786842; border-radius:8px; color:var(--gold); text-align:center; font-weight:800 }
    .strategy-log { margin:8px 0 0; padding-left:20px; color:var(--muted); font-size:.86rem; line-height:1.7 }
    .training-feedback { margin-top:14px; padding:13px; border-radius:10px; border:1px solid var(--line); background:var(--bg); line-height:1.6 }
    .training-feedback strong { color:var(--gold) }
    .training-feedback p { margin:7px 0 0; color:var(--muted) }
    .training-summary { margin:0 0 8px; color:var(--muted); font-size:.8rem; line-height:1.6 }
    .chat-panel { padding:18px; min-width:0 }
    .chat-panel summary { cursor:pointer; color:var(--muted); font-size:.84rem; font-weight:700 }
    .chat-messages { height:180px; overflow:auto; padding:10px; margin:16px 0 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg) }
    .chat-line { padding:6px 0; font-size:.84rem; line-height:1.6; overflow-wrap:anywhere }
    .chat-line strong { color:var(--gold); margin-right:7px }
    .chat-line time { color:var(--muted); font-size:.7rem; margin-right:8px }
    .chat-panel .answer-row { align-items:center }
    .chat-panel .input { padding:12px 10px }
    .chat-panel .btn { padding:12px }
    @media(max-width:860px) {
      .arena-grid { grid-template-columns:1fr }
      .arena-side { grid-template-columns:1fr 1fr; align-items:start }
      .challenge { min-height:0 }
    }
    @media(max-width:560px) {
      .screen { align-items:flex-start!important; padding: max(18px,env(safe-area-inset-top)) 12px max(18px,env(safe-area-inset-bottom)) }
      .arena-head { flex-wrap:wrap; gap:8px }
      .arena-head .connection { display:none }
      .round-chip { font-size:.8rem; padding:8px 10px }
      .timer-wrap { gap:6px; padding-left:8px }
      .timer-wrap .label { display:none }
      .timer { font-size:1.3rem; min-width:58px }
      .arena-side,.roster,.form-row,.home-actions { grid-template-columns:1fr }
      .candidate-list { grid-template-columns:1fr }
      .answer-row { flex-wrap:wrap }
      .answer-row > .btn { flex:1 0 100% }
      .answer-field { flex-basis:calc(50% - 5px) }
      .chat-panel .answer-row { flex-wrap:nowrap }
      .chat-panel .answer-row > .btn { flex:0 0 auto }
      .challenge { padding:22px 18px }
      .puzzle-data { padding:14px }
      .score-list { grid-template-columns:1fr }
    }
  </style>
</head>
<body>
  <main id="app">
    <section id="home" class="screen active">
      <div class="wrap">
        <header class="hero"><h1><span>TIMELINE</span></h1></header>
        <div class="panel home-panel">
          <div class="field"><label for="playerName">닉네임</label><input id="playerName" class="input" maxlength="18" autocomplete="nickname"><p class="hint" style="margin:0">생성과 참가에 공통 사용</p></div>
          <h2 class="home-section-title">새 방 만들기</h2>
          <div class="form-row">
            <div class="field"><label for="maxPlayers">게임 방식</label><select id="maxPlayers" class="input"></select></div>

            <div class="field"><button id="createRoom" class="btn primary block">만들기</button></div>
          </div>
          <hr class="divider">
          <h2 class="home-section-title">코드로 참가</h2>
          <div class="field"><label for="roomCodeInput">초대 코드</label><input id="roomCodeInput" class="input" maxlength="6" autocomplete="off" placeholder="예: 4K8T2M" style="text-transform:uppercase;letter-spacing:.2em"></div>
          <button id="joinRoom" class="btn blue block">참가</button>
        </div>
      </div>
    </section>

    <section id="lobby" class="screen">
      <div class="panel lobby">
        <div class="topline"><button class="btn ghost small" data-home>나가기</button><span class="grow"></span><span id="connectionLobby" class="connection">연결 중</span></div>
        <div class="center label">대기실</div><div id="lobbyCode" class="room-code">------</div>
        <p id="lobbySub" class="lobby-sub">참가자를 기다리는 중</p>
        <div id="roster" class="roster"></div>
        <div class="lobby-actions"><button id="copyCode" class="btn">초대 코드 복사</button><button id="startGame" class="btn primary" hidden>게임 시작</button></div>
        <p id="lobbyHint" class="hint center" style="margin-top:18px"></p>
      </div>
    </section>

    <section id="arena" class="screen">
      <div class="arena">
        <header class="arena-head">
          <span id="roundChip" class="round-chip">1라운드</span><span id="phaseLabel" class="phase-label"></span>
          <span class="grow"></span><span id="connectionArena" class="connection">연결 중</span>
          <div class="timer-wrap"><span class="label">남은 시간</span><span id="timer" class="timer" role="timer" aria-label="남은 시간">--</span></div>
        </header>
        <div class="arena-grid">
          <article class="panel challenge">
            <h2 id="challengeTitle">문제 준비 중</h2>
            <section class="question-section" aria-labelledby="questionLabel">
              <h3 id="questionLabel" class="section-label">문제</h3><p id="challengePrompt" class="prompt"></p>
              <div id="puzzleData" class="puzzle-data" hidden></div>
            </section>
            <section id="conditionsCard" class="condition-section" aria-labelledby="conditionsLabel" hidden>
              <h3 id="conditionsLabel" class="section-label">조건 / 힌트</h3><ul id="conditionList" class="condition-list"></ul>
            </section>
            <div id="strategyBoard" class="strategy-board" hidden></div>
            <section id="privateCard" class="private-card" aria-labelledby="privateHeading" hidden><h3 id="privateHeading" class="section-label">내 단서</h3><ul id="privateText" class="clue-list"></ul></section>
            <div id="studyCard" class="study-card" hidden><div class="section-label">기억할 숫자</div><div id="studySequence" class="study-sequence"></div></div>
            <div id="answerBox" class="answer-box" hidden></div>
            <div id="waitingBox" class="waiting-box" hidden></div>
            <div id="resultBox" class="result-box" hidden></div>
            <button id="nextTraining" class="btn primary" style="margin-top:12px" hidden>다음 문제</button>
          </article>
          <aside class="arena-side">
            <section class="panel side-panel"><h3 id="scoreHeading">현재 승점</h3><div id="scoreList" class="score-list"></div><div id="roomStatus" class="roster-status"></div></section>
            <details id="chatPanel" class="panel chat-panel">
              <summary>공개 대화</summary><div id="chatMessages" class="chat-messages" aria-live="polite"></div>
              <div class="answer-row"><input id="chatInput" class="input" aria-label="공개 대화 메시지" maxlength="240" autocomplete="off" placeholder="메시지"><button id="sendChat" class="btn">전송</button></div>
            </details>
          </aside>
        </div>
      </div>
    </section>

    <section id="finished" class="screen">
      <div class="panel finish-card"><h1 id="winnerName">우승자</h1><div id="finishRank" class="finish-rank"></div><button id="backHome" class="btn primary">타이틀로 돌아가기</button></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
  (() => {
    const $ = selector => document.querySelector(selector);
    const screens = ['home','lobby','arena','finished'];
    const home = $('#home'), nameInput = $('#playerName'), roomInput = $('#roomCodeInput');
    let session = null, snapshot = null, socket = null, reconnectTimer = null, clockTimer = null;
    let reconnectDelay = 700, lastSeq = -1, chosenAnswer = null, chosenPhaseId = null, toastTimer = null, answerViewKey = '', chatPhaseId = null;
    const savedName = localStorage.getItem('timeline.playerName');
    if (savedName) nameInput.value = savedName;
    for (let n=1;n<=8;n++) { const option=document.createElement('option'); option.value=String(n); option.textContent=n===1?'1명 · 개인 훈련':`${n}명 · 생존 대전`; $('#maxPlayers').append(option); }
    $('#maxPlayers').value='2';
    try { const saved = sessionStorage.getItem('timeline.roomSession'); if (saved) { session=JSON.parse(saved); if (session?.code&&session?.token) connect(); else session=null; } } catch { session=null; }

    function showScreen(id) { for (const item of screens) $('#'+item).classList.toggle('active',item===id); }
    function toast(message) { const node=$('#toast'); node.textContent=message; node.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>node.classList.remove('show'),2800); }
    function setConnection(connected) { for (const id of ['connectionLobby','connectionArena']) { const node=$('#'+id); node.textContent=connected?'연결됨':'재접속 중'; node.classList.toggle('offline',!connected); } }
    async function api(path, body) {
      const response=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
      const data=await response.json().catch(()=>({message:'서버 응답을 읽을 수 없습니다.'}));
      if (!response.ok) throw new Error(data.message||'요청을 처리하지 못했습니다.');
      return data;
    }
    function validName() { const name=nameInput.value.trim(); if (!name) { toast('닉네임을 입력해 주세요.'); nameInput.focus(); return null; } localStorage.setItem('timeline.playerName',name); return name; }
    async function createRoom() {
      const name=validName(); if (!name) return;
      $('#createRoom').disabled=true;
      try { const result=await api('/api/rooms',{name,maxPlayers:Number($('#maxPlayers').value)}); enterRoom({...result,name}); }
      catch(error) { toast(error.message); $('#createRoom').disabled=false; }
    }
    async function joinRoom() {
      const name=validName(); if (!name) return;
      const code=roomInput.value.trim().toUpperCase(); if (!/^[A-HJ-NP-Z2-9]{6}$/.test(code)) { toast('초대 코드를 확인해 주세요.'); roomInput.focus(); return; }
      $('#joinRoom').disabled=true;
      try { const result=await api(`/api/rooms/${encodeURIComponent(code)}/join`,{name}); enterRoom({...result,name}); }
      catch(error) { toast(error.message); $('#joinRoom').disabled=false; }

    function enterRoom(data) {
      session={code:data.code,token:data.token,playerId:data.playerId,name:data.name};
      sessionStorage.setItem('timeline.roomSession',JSON.stringify(session)); lastSeq=-1; reconnectDelay=700; snapshot=null; connect();
    }
    function connect() {
      if (!session) return;
      clearTimeout(reconnectTimer);
      const scheme=location.protocol==='https:'?'wss:':'ws:';
      const next=new WebSocket(`${scheme}//${location.host}/ws/${encodeURIComponent(session.code)}?token=${encodeURIComponent(session.token)}`);
      socket=next;
      next.addEventListener('open',()=>{ if(socket!==next)return; reconnectDelay=700; setConnection(true); next.send(JSON.stringify({type:'sync',lastSeq})); });
      next.addEventListener('message',event=>{ if(socket!==next)return; try { handleMessage(JSON.parse(event.data)); } catch { toast('오류가 발생했습니다.'); } });
      next.addEventListener('close',()=>{ if(socket!==next)return; setConnection(false); if(session) { reconnectTimer=setTimeout(connect,reconnectDelay); reconnectDelay=Math.min(5000,reconnectDelay*1.7); } });
      next.addEventListener('error',()=>next.close());
    }
    function send(message) { if(socket?.readyState!==WebSocket.OPEN) { toast('재접속 후 다시 시도해 주세요.'); return false; } socket.send(JSON.stringify(message)); return true; }
    function handleMessage(message) {
      if (message.type==='error') { chosenAnswer=null; answerViewKey=''; toast(message.message||'요청을 처리하지 못했습니다.'); if(snapshot?.game) renderGame(snapshot); return; }
      if (!['room','state'].includes(message.type)) return;
      const sequence=message.game?.seq??message.seq;
      if (sequence!=null && sequence<lastSeq) return;
      snapshot=message; if(sequence!=null) lastSeq=sequence;
      if(message.status==='closed') { if(socket)socket.close(1000,'방 종료'); socket=null; session=null; sessionStorage.removeItem('timeline.roomSession'); showScreen('home'); toast('방이 닫혔습니다.'); return; }

    }

    function renderPuzzleData(content) {
      const escaped=value=>escapeHtml(value), details=content.details;
      if(content.layout==='sequence') {
        return '<div class="sequence-data">'+details.join(' · ').split(' · ').map(value=>
          '<span class="sequence-number '+(value.trim()==='?'?'unknown':'')+'">'+escaped(value.trim())+'</span>').join('')+'</div>';
      }
      if(content.layout==='sudoku') {
        const rows=details.filter(line=>!/^[-+]+$/.test(line.trim())).map(line=>line.replace(/│/g,'').trim().split(/\s+/));
        if(rows.length===6&&rows.every(row=>row.length===6&&row.every(value=>/^[1-6·]$/.test(value)))) {
          return '<div class="sudoku-grid" role="table" aria-label="6행 6열 스도쿠">'+rows.map((row,r)=>
            '<div role="row" style="display:contents">'+row.map((value,c)=>'<span role="cell" aria-label="'+(r+1)+'행 '+(c+1)+'열 '+(value==='·'?'빈칸':value)+'" class="sudoku-cell '+(value==='·'?'blank ':'')+(c===2?'box-right ':'')+(r===1||r===3?'box-bottom':'')+'">'+(value==='·'?'?':escaped(value))+'</span>').join('')+'</div>').join('')+'</div>';
        }
      }
      if(content.layout==='code') {
        const rows=details.map(line=>line.match(/^\d+\. (\d{5}): 자리까지 (\d+) · 숫자만 (\d+)$/));
        if(rows.every(Boolean))return '<div class="table-wrap"><table class="puzzle-table"><caption class="section-label">암호 단서</caption><thead><tr><th scope="col">시도</th><th scope="col">자리까지</th><th scope="col">숫자만</th></tr></thead><tbody>'+rows.map(row=>'<tr><td>'+escaped(row[1])+'</td><td>'+escaped(row[2])+'</td><td>'+escaped(row[3])+'</td></tr>').join('')+'</tbody></table></div>';
      }
      if(content.layout==='projects') {
        const rows=details.join(' · ').split(' · ').map(line=>line.match(/^([A-E]): E(\d+)\/D(\d+), (\d+)점$/));
        if(rows.every(Boolean))return '<div class="table-wrap"><table class="puzzle-table"><caption class="section-label">프로젝트</caption><thead><tr><th scope="col">이름</th><th scope="col">에너지</th><th scope="col">데이터</th><th scope="col">보상</th></tr></thead><tbody>'+rows.map(row=>'<tr>'+row.slice(1).map(value=>'<td>'+escaped(value)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
      }
      const ordered=content.layout==='ordered', tag=ordered?'ol':'div', item=ordered?'li':'div';
      return '<'+tag+' class="data-lines '+(ordered?'numbered':'')+'">'+details.map(line=>'<'+item+'>'+escaped(ordered?line.replace(/^\d+\.\s*/,''):line)+'</'+item+'>').join('')+'</'+tag+'>';
    }

      const active=(data.players||[]).filter(player=>!player.eliminated);
      $('#roomStatus').textContent=game.trainingMode?'1인 훈련':active.length+'명 생존 · '+(data.players||[]).length+'명 참가';

        }
        box.append(list); return;
      }

      if(game.inputKind==='indianPoker') {
        const row=document.createElement('div'); row.className='answer-row';
        const guess=document.createElement('input'); guess.className='input'; guess.type='number';
        guess.min='2'; guess.max='14'; guess.step='1'; guess.inputMode='numeric'; guess.placeholder='예상 2~14';
        guess.autocomplete='off'; guess.id='cardGuess';
        const wager=document.createElement('input'); wager.className='input'; wager.type='number';
        wager.min='0'; wager.max='5'; wager.step='1'; wager.inputMode='numeric'; wager.placeholder='베팅 0~5';
        wager.autocomplete='off'; wager.id='cardWager';
        const submit=document.createElement('button'); submit.type='button'; submit.className='btn primary'; submit.textContent='제출';
        submit.addEventListener('click',()=>submitAnswer({guess:guess.value,wager:wager.value}));
        const guessField=answerField('카드 예상 (2~14)',guess), wagerField=answerField('베팅 (0~5)',wager);
        row.append(guessField,wagerField,submit); box.append(row); return;
      }

      if(game.inputKind==='bid') {
        const row=document.createElement('div'); row.className='answer-row';
        const bid=document.createElement('input'); bid.className='input'; bid.type='number';
        bid.min='0'; bid.max='10'; bid.step='1'; bid.inputMode='numeric'; bid.placeholder='입찰액';
        bid.autocomplete='off'; bid.id='bidInput';
        const submit=document.createElement('button'); submit.type='button'; submit.className='btn primary'; submit.textContent='봉인 입찰';
        submit.addEventListener('click',()=>submitAnswer({bid:bid.value}));
        row.append(answerField('입찰액',bid),submit); box.append(row); return;
      }

      const row=document.createElement('div'); row.className='answer-row';
      const input=document.createElement('input'); input.className='input'; input.id='answerInput';
      input.type='text'; input.autocomplete='off'; input.placeholder=game.placeholder||'답';
      input.maxLength=game.maxLength||4; input.inputMode=game.inputKind==='text'?'text':'numeric';
      input.value=typeof chosenAnswer==='string'?chosenAnswer:'';
      input.addEventListener('input',()=>{chosenAnswer=input.value;});
      const submit=document.createElement('button'); submit.type='button'; submit.className='btn primary';
      submit.textContent='답 제출'; submit.addEventListener('click',()=>submitAnswer(input.value));
      row.append(answerField(game.inputKind==='memory'?'16자리 숫자':game.type==='stateInference'?'8비트 답안':game.inputKind==='number'?'정수 답안':'답안',input),submit); box.append(row);
      input.addEventListener('keydown',event=>{if(event.key==='Enter')submitAnswer(input.value);});
    }
    function submitAnswer(answer) {
      if(!snapshot?.game)return;
      const game=snapshot.game;
      const canAnswer=(game.phase==='answer'&&!game.you?.submitted)||(game.phase==='turn'&&game.type==='strategy'&&game.yourTurn);
      if(!canAnswer)return;
      if(answer==null||String(answer).trim()==='') { toast('답을 입력하거나 선택하세요.'); return; }
      if(game.inputKind==='memory'&&!/^\d{16}$/.test(String(answer).replace(/\s/g,''))) { toast('16자리 숫자를 입력해 주세요.'); return; }
      if(game.type==='stateInference'&&!/^[01]{8}$/.test(String(answer).trim())) { toast('8비트를 입력해 주세요.'); return; }
      if(game.inputKind==='number'&&!/^-?\d{1,4}$/.test(String(answer).trim())) { toast('정수를 입력해 주세요.'); return; }
      if(game.inputKind==='indianPoker') {
        const guess=Number(answer.guess), wager=Number(answer.wager);
        if(!Number.isInteger(guess)||guess<2||guess>14||!Number.isInteger(wager)||wager<0||wager>5) { toast('예상 2~14, 베팅 0~5를 입력해 주세요.'); return; }
      }
      if(game.inputKind==='bid'&&!/^\d{1,2}$/.test(String(answer.bid??''))) { toast('입찰액을 입력해 주세요.'); return; }
      const payload=typeof answer==='object'?answer:String(answer).trim();
      if(!send({type:'action',phaseId:game.phaseId,actionId:crypto.randomUUID(),answer:payload}))return;
      const button=$('#answerBox button'); if(button)button.disabled=true;
    }
    function updateTimer(deadline) {
      clearInterval(clockTimer); const draw=()=>{const remaining=Math.max(0,Math.ceil((Number(deadline)-Date.now())/1000)); $('#timer').classList.toggle('urgent',remaining<=5); $('#timer').textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;}; draw(); clockTimer=setInterval(draw,250);
    }
    function renderFinish(data) {
      clearInterval(clockTimer); showScreen('finished');
      if(data.game.trainingMode) {
        $('#winnerName').textContent='훈련 완료';
        const history=data.game.trainingHistory||[];
        const rows=Object.keys({logic:1,information:1,strategy:1,memory:1}).map(category=>{
          const entries=history.filter(item=>item.category===category);
          if(!entries.length)return '';
          const average=Math.round(entries.reduce((sum,item)=>sum+item.performance,0)/entries.length*100);
          const label=entries[0].categoryLabel;
          return '<div class="score-row"><span class="rank">'+entries.length+'회</span><span class="score-name">'+escapeHtml(label)+'</span><span class="score-points">'+average+'%</span><span class="score-sub">'+entries.map(item=>'문제 '+item.round+' · '+escapeHtml(item.outcome)).join(' / ')+'</span></div>';
        }).filter(Boolean).join('');
        const finalResult=data.game.result||{};
        const lastFeedback=finalResult.trainingFeedback;
        $('#finishRank').innerHTML='<p class="training-summary">정답 비교, 기억 일치율, 최선 점수 대비 달성률로 계산한 이번 세션 결과입니다. 지능을 평가하는 점수는 아닙니다.</p>'+
          (finalResult.subline?'<p class="result-note">마지막 문제 해설: '+escapeHtml(finalResult.subline)+'</p>':'')+
          (lastFeedback?'<div class="training-feedback"><strong>마지막 복기 · '+escapeHtml(lastFeedback.categoryLabel)+' · '+escapeHtml(lastFeedback.outcome)+' ('+lastFeedback.performance+'%)</strong><p>'+escapeHtml(lastFeedback.tip)+'</p></div>':'')+rows;
        return;
      }
      const winner=data.players.find(player=>player.id===data.game.winnerId); $('#winnerName').textContent=winner?.name||'우승자';
      
      const ranked=[...data.players].sort((a,b)=>b.finalScore-a.finalScore||b.score-a.score);
      $('#finishRank').innerHTML=ranked.map((player,index)=>`<div class="score-row ${player.id===data.game.winnerId?'me':''}"><span class="rank">${String(index+1).padStart(2,'0')}</span><span class="score-name">${escapeHtml(player.name)}</span><span class="score-points">${player.finalScore}점</span></div>`).join('');
    }
    $('#createRoom').addEventListener('click',createRoom); $('#joinRoom').addEventListener('click',joinRoom);
    $('#sendChat').addEventListener('click',sendChat); $('#chatInput').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();sendChat();}});
    roomInput.addEventListener('input',()=>roomInput.value=roomInput.value.toUpperCase()); roomInput.addEventListener('keydown',event=>{if(event.key==='Enter')joinRoom();});
    $('#startGame').addEventListener('click',()=>send({type:'start'}));
    $('#copyCode').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(snapshot?.code||'');toast('초대 코드를 복사했습니다.');}catch{toast(`초대 코드: ${snapshot?.code||''}`);}});
    $('#nextTraining').addEventListener('click',()=>send({type:'continueTraining'}));
    $('#backHome').addEventListener('click',()=>{if(socket)socket.close(1000,'완료');socket=null;session=null;snapshot=null;sessionStorage.removeItem('timeline.roomSession');$('#createRoom').disabled=false;$('#joinRoom').disabled=false;showScreen('home');});
    document.querySelectorAll('[data-home]').forEach(button=>button.addEventListener('click',()=>{if(snapshot?.status==='waiting')send({type:'leave'});if(socket)socket.close(1000,'나가기');socket=null;session=null;sessionStorage.removeItem('timeline.roomSession');$('#createRoom').disabled=false;$('#joinRoom').disabled=false;showScreen('home');}));
  })();
  </script>
</body>
</html>
