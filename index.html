<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>THE TIMELINE — Turn Duel</title>
<style>
:root{--soft:#d7c79d;--deep:#263b50;--yellow:#f4bf43;--white:#fff9e8;--coral:#d95745;--sky:#4e9ee8;--shadow:rgba(38,59,80,.28);--r:18px;--ease:cubic-bezier(.33,.9,.32,1)}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{overflow:hidden;color:var(--deep);background:var(--white);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;letter-spacing:-.015em}button{font:inherit;color:inherit;border:0;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}#app{height:100%;position:relative}.screen{position:absolute;inset:0;display:none;flex-direction:column}.screen.active{display:flex;animation:fade .24s var(--ease)}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.nm{background:var(--soft);border-radius:var(--r);box-shadow:6px 6px 14px var(--shadow),-6px -6px 14px #fff}.in{background:color-mix(in srgb,var(--soft) 78%,var(--white));box-shadow:inset 4px 4px 9px var(--shadow),inset -4px -4px 9px #fff;border-radius:14px}.btn{padding:10px 16px;border-radius:13px;background:var(--soft);font-weight:850;box-shadow:4px 4px 9px var(--shadow),-4px -4px 9px #fff;transition:.18s var(--ease)}.btn:hover:not(:disabled){transform:translateY(-2px)}.btn:active:not(:disabled),.btn.on{transform:translateY(1px);box-shadow:inset 3px 3px 7px var(--shadow),inset -3px -3px 7px #fff}.btn.primary{background:var(--yellow)}.btn.danger{color:var(--coral)}.btn.small{padding:7px 11px;font-size:.82rem}.top{display:flex;align-items:center;gap:10px;padding:14px 18px}.top h2{font-size:1rem;letter-spacing:.08em}.grow{flex:1}.muted{opacity:.67}.tiny{font-size:.76rem}.page{flex:1;overflow:auto;padding:6px 18px 24px}.section{padding:18px;margin-bottom:15px}.section h3{font-size:.92rem;letter-spacing:.07em;margin-bottom:12px;display:flex;align-items:center;gap:8px}.section h3:before{content:"";width:4px;height:16px;border-radius:3px;background:var(--yellow)}.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:rgba(255,249,232,.64);font-size:.72rem;font-weight:850}.tag.red{color:var(--coral)}.tag.blue{color:#245c92}.tag.gold{color:#8f6500}.title{align-items:center;justify-content:center;gap:28px;text-align:center;padding:24px}.title h1{font-size:clamp(38px,8vw,72px);letter-spacing:.16em;text-shadow:3px 3px 5px var(--shadow),-3px -3px 5px #fff}.title p{letter-spacing:.28em;font-size:.78rem}.title .menu{display:grid;gap:12px;width:min(340px,86vw)}
.setup-grid{display:grid;grid-template-columns:minmax(250px,.8fr) minmax(400px,1.6fr);gap:15px}.weapon-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.weapon{padding:12px;text-align:left;border:2px solid transparent}.weapon.on{border-color:var(--yellow);transform:translateY(-2px)}.weapon b,.weapon small{display:block}.weapon small{margin-top:3px;opacity:.68}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.stat{text-align:center;padding:9px}.stat b{display:block;font-size:1.2rem}.stat small{font-size:.68rem;opacity:.67}.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.card{position:relative;min-height:148px;padding:13px;text-align:left;border:2px solid transparent;overflow:hidden;transition:.18s var(--ease)}.card.on{border-color:var(--yellow)}.card:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--sky)}.card.attack:before{background:var(--coral)}.card.guard:before{background:var(--deep)}.card h4{padding-right:34px}.card .icon{position:absolute;right:11px;top:9px;font-size:1.35rem}.card p{font-size:.79rem;line-height:1.45;margin:7px 0;min-height:35px}.card-foot{display:flex;gap:5px;flex-wrap:wrap}.deck-count{font-weight:900}.deck-count.bad{color:var(--coral)}.peak-tree{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.peak-col{padding:11px}.peak-col>strong{display:block;text-align:center;margin-bottom:9px}.peak{width:100%;padding:10px;margin-top:8px;text-align:left;border:2px solid transparent}.peak.on{border-color:var(--yellow)}.peak.lock{opacity:.38}.peak b,.peak small{display:block}.peak small{margin-top:3px;line-height:1.35}.setup-foot{position:sticky;bottom:0;display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(255,249,232,.9);backdrop-filter:blur(10px);z-index:5}
.battle{display:grid;grid-template-rows:auto minmax(285px,44vh) auto minmax(0,1fr) auto;height:100%}.battle-head{display:flex;gap:12px;align-items:center;padding:10px 16px}.round{font-weight:950}.intent{flex:1;text-align:center;padding:9px 12px}.intent b{color:var(--coral)}.scene{position:relative;margin:0 14px 8px;overflow:hidden;border:1px solid rgba(38,59,80,.25);border-radius:18px;background:#9ed6ff}.scene-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 62%,rgba(24,39,56,.12));pointer-events:none}.fighter{--x:24%;position:absolute;z-index:2;left:var(--x);bottom:28px;width:clamp(120px,20vw,235px);height:clamp(145px,24vw,275px);transform:translateX(-50%);transition:left .36s var(--ease),filter .18s}.fighter.enemy{--x:76%}.fighter img{width:100%;height:100%;object-fit:contain;object-position:center bottom;image-rendering:pixelated;filter:drop-shadow(5px 7px 4px rgba(38,59,80,.28))}.fighter .plate{position:absolute;left:50%;top:-8px;transform:translate(-50%,-100%);width:170px;padding:7px 9px;background:rgba(255,249,232,.84);border-radius:10px;box-shadow:2px 3px 7px rgba(38,59,80,.24)}.plate-row{display:flex;justify-content:space-between;font-size:.72rem;font-weight:900}.hp{height:8px;margin-top:4px;border-radius:99px;overflow:hidden;background:rgba(38,59,80,.2)}.hp i{display:block;height:100%;background:var(--deep);transition:width .35s}.enemy .hp i{background:var(--coral)}.float{position:absolute;left:50%;top:34%;z-index:8;color:#ff435f;font-size:2rem;font-weight:1000;-webkit-text-stroke:1px #222;text-shadow:2px 3px #222;animation:float .9s forwards}@keyframes float{0%{opacity:0;transform:translate(-50%,12px) scale(.7)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-58px)}}.forecast{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:0 14px 8px;padding:10px 14px}.forecast-side{display:flex;align-items:center;gap:9px}.forecast-side:last-child{justify-content:flex-end;text-align:right}.forecast strong{font-size:.85rem}.forecast .vs{font-weight:1000;color:var(--coral)}.hand{overflow:auto;padding:3px 14px 12px;display:flex;gap:10px;align-items:stretch}.hand .card{flex:0 0 210px;min-height:132px}.hand .card:hover{transform:translateY(-3px)}.hand .card.on{background:color-mix(in srgb,var(--yellow) 24%,var(--soft))}.battle-foot{display:flex;align-items:center;gap:10px;padding:10px 14px 14px}.battle-foot .summary{flex:1}.log{font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result{align-items:center;justify-content:center;text-align:center;gap:18px}.result h2{font-size:2.2rem}.result .menu{display:flex;gap:10px}@keyframes shake{0%,100%{transform:translateX(-50%)}30%{transform:translateX(calc(-50% - 10px))}70%{transform:translateX(calc(-50% + 8px))}}.fighter.hit{animation:shake .32s}
@media(max-width:780px){.setup-grid{grid-template-columns:1fr}.peak-tree{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.battle{grid-template-rows:auto minmax(285px,42vh) auto minmax(0,1fr) auto}.fighter{bottom:20px;width:145px;height:175px}.fighter .plate{width:132px}.intent{font-size:.76rem}.forecast{font-size:.72rem}.forecast-side{gap:4px}.weapon-grid,.card-grid{grid-template-columns:1fr 1fr}.setup-foot{padding-bottom:max(12px,env(safe-area-inset-bottom))}}
</style></head><body><main id="app">
<section id="title" class="screen title active"><div><h1>TIMELINE</h1><p>거리와 예고의 결투</p></div><div class="menu"><button class="btn primary" data-go="setup">새 결투</button><button class="btn" id="quick">추천 덱으로 바로 시작</button></div><small class="muted">완전한 턴제 · 상대 행동 예고 · 거리 중심 카드 전투</small></section>
<section id="setup" class="screen"><header class="top"><button class="btn small" data-go="title">뒤로</button><h2>결투 준비</h2><div class="grow"></div><span class="tag gold">무기 프리셋 + Peak 빌드</span></header><div class="page"><div class="setup-grid"><div><article class="section nm"><h3>무기 프리셋</h3><div id="weapons" class="weapon-grid"></div><div id="stats" class="stats"></div><p id="weaponDesc" class="tiny muted"></p></article><article class="section nm"><h3>Peak 룬</h3><p class="tiny muted">세 갈래 빌드에서 최대 3개를 선택합니다. 아래 단계는 같은 갈래의 앞 단계를 요구합니다.</p><div id="peaks" class="peak-tree"></div></article></div><article class="section nm"><h3>시작 덱 <span class="grow"></span><span id="deckCount" class="deck-count"></span></h3><p class="tiny muted" style="margin-bottom:12px">무기 프리셋을 고르면 추천 8장이 즉시 구성됩니다. 카드를 눌러 교체해 보세요.</p><div id="cards" class="card-grid"></div></article></div></div><footer class="setup-foot"><span class="tiny muted">유파·집중·상태이상·틱을 제거한 간결한 규칙</span><div class="grow"></div><button id="start" class="btn primary">이 덱으로 시작</button></footer></section>
<section id="battle" class="screen battle"><header class="battle-head"><button class="btn small danger" id="quit">포기</button><span id="round" class="round"></span><div id="intent" class="intent in"></div><span id="distance" class="tag blue"></span></header><div class="scene"><img class="scene-bg" src="assets/battle/grassland.png" alt="초원 전투장"><div id="p1" class="fighter"><div class="plate"><div class="plate-row"><span>나</span><span id="pHpText"></span></div><div class="hp"><i id="pHp"></i></div></div><img id="pImg" alt="플레이어"></div><div id="p2" class="fighter enemy"><div class="plate"><div class="plate-row"><span>상대</span><span id="eHpText"></span></div><div class="hp"><i id="eHp"></i></div></div><img id="eImg" alt="상대"></div></div><div id="forecast" class="forecast in"></div><div id="hand" class="hand"></div><footer class="battle-foot"><div class="summary"><div id="selection" class="tiny"></div><div id="log" class="log muted"></div></div><button id="resolve" class="btn primary" disabled>턴 실행</button></footer></section>
<section id="result" class="screen result"><h2 id="resultTitle"></h2><p id="resultText" class="muted"></p><div class="menu"><button class="btn primary" data-go="setup">덱 다시 구성</button><button class="btn" data-go="title">타이틀</button></div></section>
</main><script>
const W={shortblade:{name:'단검',folder:'shortblade',desc:'한 번에 거리를 좁혀 빈틈을 찌르는 초근접 프리셋.',hp:82,power:8,guard:3,start:4,deck:['shadow','dash','step','jab','jab','guardStep','retreat','chase']},twinblade:{name:'쌍검',folder:'twinblade',desc:'빠른 왕복 이동과 연속 압박에 특화된 프리셋.',hp:86,power:7,guard:4,start:4,deck:['dash','dash','cross','cross','sideStep','guardStep','retreat','chase']},standard:{name:'직도',folder:'standard',desc:'접근·후퇴·공수가 균형 잡힌 표준 프리셋.',hp:92,power:7,guard:5,start:5,deck:['step','step','retreat','guardStep','slash','slash','lunge','chase']},longblade:{name:'장검',folder:'longblade',desc:'중거리를 지키며 상대 접근을 받아치는 프리셋.',hp:96,power:8,guard:6,start:6,deck:['back2','back2','keep','keep','sweep','sweep','guardStep','lunge']},greatblade:{name:'대검',folder:'greatblade',desc:'느리지만 강한 일격과 견고한 방어를 엮는 프리셋.',hp:106,power:10,guard:7,start:6,deck:['step','back2','brace','brace','cleave','cleave','charge','keep']},polearm:{name:'장병기',folder:'polearm',desc:'거리를 벌리고 2~4칸 사거리로 통제하는 프리셋.',hp:98,power:8,guard:6,start:7,deck:['back2','back2','vault','keep','thrust','thrust','sweep','brace']}};
const C={step:{name:'접근',icon:'→',type:'move',text:'상대 쪽으로 1칸 이동.',move:-1,speed:3},dash:{name:'질주 접근',icon:'⇉',type:'move',text:'상대 쪽으로 2칸 이동.',move:-2,speed:2},shadow:{name:'그림자 붙기',icon:'↠',type:'move',text:'현재 거리와 무관하게 근접 거리(1)가 된다.',set:1,speed:3},chase:{name:'추격',icon:'↝',type:'attack',text:'2칸 접근 후 근접했다면 공격.',move:-2,range:[1,1],dmg:8,speed:2},retreat:{name:'거리 조절',icon:'←',type:'move',text:'상대에게서 1칸 후퇴.',move:1,speed:3},back2:{name:'큰 후퇴',icon:'⇇',type:'move',text:'상대에게서 2칸 후퇴.',move:2,speed:2},vault:{name:'도약 후퇴',icon:'↞',type:'move',text:'상대에게서 3칸 후퇴.',move:3,speed:1},sideStep:{name:'흘려 이동',icon:'◇',type:'guard',text:'피해 4를 막고 1칸 후퇴.',block:4,move:1,speed:4},guardStep:{name:'방어 접근',icon:'◆',type:'guard',text:'피해 5를 막고 1칸 접근.',block:5,move:-1,speed:4},brace:{name:'굳건한 방어',icon:'⬟',type:'guard',text:'이번 턴 피해 9를 막는다.',block:9,speed:5},keep:{name:'거리 유지',icon:'↔',type:'guard',text:'상대가 접근하면 2칸 밀어내고 피해 4를 막는다.',block:4,keep:2,speed:5},jab:{name:'급소 찌르기',icon:'†',type:'attack',text:'거리 1에서 빠르게 공격.',range:[1,1],dmg:13,speed:5},cross:{name:'교차 베기',icon:'×',type:'attack',text:'거리 1~2에서 공격.',range:[1,2],dmg:12,speed:4},slash:{name:'가로 베기',icon:'╱',type:'attack',text:'거리 1~2에서 안정적으로 공격.',range:[1,2],dmg:11,speed:3},lunge:{name:'찌르기',icon:'➤',type:'attack',text:'1칸 접근 후 거리 1~2에서 공격.',move:-1,range:[1,2],dmg:12,speed:3},sweep:{name:'긴 횡베기',icon:'⌁',type:'attack',text:'거리 2~3에서 공격.',range:[2,3],dmg:13,speed:2},thrust:{name:'장병 찌르기',icon:'━━',type:'attack',text:'거리 2~4에서 공격.',range:[2,4],dmg:12,speed:3},cleave:{name:'대검 내려치기',icon:'↓',type:'attack',text:'거리 1~2에서 강하게 공격.',range:[1,2],dmg:17,speed:1},charge:{name:'돌진 참격',icon:'⇥',type:'attack',text:'2칸 접근 후 거리 1~2에서 공격.',move:-2,range:[1,2],dmg:15,speed:1}};
const PEAKS=[{branch:'기동',items:[{id:'stride',name:'긴 보폭',text:'모든 이동량 +1',mod:{move:1}},{id:'tempo',name:'선수',text:'첫 3턴 속도 +2',req:'stride',mod:{early:2}}]},{branch:'공세',items:[{id:'edge',name:'예리함',text:'공격 피해 +2',mod:{power:2}},{id:'finish',name:'결정타',text:'체력 40% 이하 상대에게 피해 +4',req:'edge',mod:{finish:4}}]},{branch:'수비',items:[{id:'vital',name:'생명력',text:'최대 체력 +12',mod:{hp:12}},{id:'wall',name:'철벽',text:'방어 카드의 방어 +3',req:'vital',mod:{guard:3}}]}];
const AI=['step','dash','back2','brace','keep','jab','slash','lunge','sweep','thrust','charge'],state={weapon:'standard',deck:[],peaks:[],battle:null},$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function go(id){$$('.screen').forEach(x=>x.classList.toggle('active',x.id===id));if(id==='setup')renderSetup()}
function cardHTML(id,selected=false,side=null){const c=side?effective(id,side):C[id],cls=c.type==='attack'?'attack':c.type==='guard'?'guard':'';return `<button class="card in ${cls} ${selected?'on':''}" data-card="${id}"><span class="icon">${c.icon}</span><h4>${c.name}</h4><p>${c.text}</p><div class="card-foot"><span class="tag">${c.range?`거리 ${c.range[0]}–${c.range[1]}`:'이동'}</span>${c.dmg?`<span class="tag red">피해 ${c.dmg}</span>`:''}${c.block?`<span class="tag blue">방어 ${c.block}</span>`:''}<span class="tag gold">속도 ${c.speed}</span></div></button>`}
function mods(){const out={hp:0,power:0,guard:0,move:0,early:0,finish:0};PEAKS.flatMap(x=>x.items).filter(x=>state.peaks.includes(x.id)).forEach(x=>Object.keys(x.mod).forEach(k=>out[k]+=x.mod[k]));return out}
function renderSetup(){if(!state.deck.length)state.deck=W[state.weapon].deck.slice();$('#weapons').innerHTML=Object.entries(W).map(([id,w])=>`<button class="weapon in ${id===state.weapon?'on':''}" data-weapon="${id}"><b>${w.name}</b><small>HP ${w.hp} · 공격 ${w.power} · 방어 ${w.guard}</small></button>`).join('');const w=W[state.weapon],m=mods();$('#stats').innerHTML=[['체력',w.hp+m.hp],['공격',w.power+m.power],['방어',w.guard+m.guard],['권장 거리',w.start]].map(x=>`<div class="stat in"><b>${x[1]}</b><small>${x[0]}</small></div>`).join('');$('#weaponDesc').textContent=w.desc;const ids=[...new Set([...w.deck,...Object.keys(C)])];$('#cards').innerHTML=ids.map(id=>cardHTML(id,state.deck.includes(id))).join('');$('#deckCount').textContent=`${state.deck.length} / 8`;$('#deckCount').classList.toggle('bad',state.deck.length!==8);$('#start').disabled=state.deck.length!==8;$('#peaks').innerHTML=PEAKS.map(b=>`<div class="peak-col in"><strong>${b.branch}</strong>${b.items.map(p=>{const lock=p.req&&!state.peaks.includes(p.req);return `<button class="peak ${state.peaks.includes(p.id)?'on':''} ${lock?'lock':''}" data-peak="${p.id}" ${lock?'disabled':''}><b>${p.name}</b><small>${p.text}</small></button>`}).join('')}</div>`).join('');bindSetup()}
function bindSetup(){$$('[data-weapon]').forEach(x=>x.onclick=()=>{state.weapon=x.dataset.weapon;state.deck=W[state.weapon].deck.slice();state.peaks=[];renderSetup()});$$('[data-card]').forEach(x=>x.onclick=()=>{const id=x.dataset.card,i=state.deck.indexOf(id);if(i>=0)state.deck.splice(i,1);else if(state.deck.length<8)state.deck.push(id);renderSetup()});$$('[data-peak]').forEach(x=>x.onclick=()=>{const id=x.dataset.peak,i=state.peaks.indexOf(id);if(i>=0){const deps=PEAKS.flatMap(b=>b.items).filter(p=>p.req===id).map(p=>p.id);state.peaks=state.peaks.filter(p=>p!==id&&!deps.includes(p))}else if(state.peaks.length<3)state.peaks.push(id);renderSetup()})}
function startBattle(){const w=W[state.weapon],m=mods(),hp=w.hp+m.hp;state.battle={round:1,distance:w.start,p:{hp,max:hp,block:0},e:{hp:92,max:92,block:0},selected:null,intent:pickIntent(w.start),busy:false,log:'상대의 예고를 읽고 한 장을 선택하세요.'};$('#pImg').src=`assets/battle/${w.folder}/idle.png`;$('#eImg').src='assets/battle/p2/standard/idle.png';go('battle');renderBattle()}
function pickIntent(distance){const pool=AI.filter(id=>{const c=C[id];if(c.range&&distance<c.range[0]&&!c.move)return false;if(c.range&&distance>c.range[1]+2&&!c.move)return false;return true});return pool[Math.floor(Math.random()*pool.length)]||'step'}
function effective(id,side){const c={...C[id]},m=side==='p'?mods():{power:0,guard:0,move:0,early:0,finish:0},weapon=side==='p'?W[state.weapon]:{power:7,guard:5};if(c.dmg)c.dmg+=weapon.power+m.power;if(c.block)c.block+=weapon.guard+m.guard;if(c.move)c.move+=Math.sign(c.move)*m.move;c.speed+=(side==='p'&&state.battle.round<=3?m.early:0);return c}
function outcomeText(id,side){const c=effective(id,side),x=[];if(c.move)x.push(`${c.move<0?'접근':'후퇴'} ${Math.abs(c.move)}칸`);if(c.set)x.push('근접 고정');if(c.dmg)x.push(`피해 ${c.dmg}`);if(c.block)x.push(`방어 ${c.block}`);return x.join(' · ')||'대기'}
function renderBattle(){const b=state.battle;if(!b)return;$('#round').textContent=`ROUND ${b.round}`;$('#distance').textContent=`거리 ${b.distance}`;$('#intent').innerHTML=`상대 예고 · <b>${C[b.intent].icon} ${C[b.intent].name}</b> <span class="tiny">${outcomeText(b.intent,'e')}</span>`;$('#pHpText').textContent=`${b.p.hp}/${b.p.max}`;$('#eHpText').textContent=`${b.e.hp}/${b.e.max}`;$('#pHp').style.width=`${b.p.hp/b.p.max*100}%`;$('#eHp').style.width=`${b.e.hp/b.e.max*100}%`;placeFighters();$('#hand').innerHTML=state.deck.map(id=>cardHTML(id,b.selected===id,'p')).join('');$$('#hand [data-card]').forEach(x=>x.onclick=()=>{if(b.busy)return;b.selected=x.dataset.card;renderBattle()});$('#resolve').disabled=!b.selected||b.busy;$('#selection').textContent=b.selected?`선택: ${C[b.selected].name} · ${outcomeText(b.selected,'p')}`:'카드를 선택하세요.';$('#log').textContent=b.log;const mine=b.selected?`<div class="forecast-side"><span>${C[b.selected].icon}</span><div><strong>${C[b.selected].name}</strong><br><small>${outcomeText(b.selected,'p')}</small></div></div>`:'<div class="forecast-side muted">내 행동을 선택하세요</div>';$('#forecast').innerHTML=`${mine}<span class="vs">VS</span><div class="forecast-side"><div><strong>${C[b.intent].name}</strong><br><small>${outcomeText(b.intent,'e')}</small></div><span>${C[b.intent].icon}</span></div>`}
function placeFighters(){const d=state.battle.distance,p=clamp(43-(d-1)*4.2,13,43);$('#p1').style.left=p+'%';$('#p2').style.left=(100-p)+'%'}
function applyMove(c,side){const b=state.battle,before=b.distance;if(c.set)b.distance=c.set;if(c.move)b.distance=clamp(b.distance+c.move,1,8);const defender=side==='p'?b.e:b.p;if((c.move<0||c.set)&&defender.keep){b.distance=clamp(b.distance+defender.keep,1,8);defender.keep=0}return before!==b.distance}
function resolveAction(side,id){const b=state.battle,c=effective(id,side),actor=side==='p'?b.p:b.e,target=side==='p'?b.e:b.p;actor.block=c.block||0;actor.keep=c.keep||0;const moved=applyMove(c,side);let hit=0;if(c.dmg&&b.distance>=c.range[0]&&b.distance<=c.range[1]){let raw=c.dmg;if(side==='p'&&mods().finish&&target.hp<=target.max*.4)raw+=mods().finish;hit=Math.max(0,raw-(target.block||0));target.hp=clamp(target.hp-hit,0,target.max);animateStrike(side,hit)}return{moved,hit,name:c.name}}
async function resolveTurn(){const b=state.battle;if(!b.selected||b.busy)return;b.busy=true;renderBattle();const p=b.selected,e=b.intent,pc=effective(p,'p'),ec=effective(e,'e');b.p.block=0;b.e.block=0;b.p.keep=0;b.e.keep=0;const order=pc.speed>=ec.speed?[['p',p],['e',e]]:[['e',e],['p',p]],notes=[];for(const a of order){if(b.p.hp<=0||b.e.hp<=0)break;const r=resolveAction(...a);notes.push(`${a[0]==='p'?'나':'상대'}: ${r.name}${r.hit?` (${r.hit} 피해)`:C[a[1]].dmg?' (빗나감)':''}`);renderBattle();await wait(520)}b.log=notes.join(' · ');if(b.p.hp<=0||b.e.hp<=0){await wait(450);finish(b.e.hp<=0);return}b.round++;b.selected=null;b.intent=pickIntent(b.distance);b.busy=false;renderBattle()}
function animateStrike(side,damage){const atk=side==='p'?$('#p1'):$('#p2'),hit=side==='p'?$('#p2'):$('#p1'),w=side==='p'?W[state.weapon].folder:'standard',ap=side==='p'?'assets/battle/':'assets/battle/p2/',ai=atk.querySelector('img'),hi=hit.querySelector('img'),hitW=side==='p'?'standard':W[state.weapon].folder,hp=side==='p'?'assets/battle/p2/':'assets/battle/';ai.src=`${ap}${w}/attack-1.png`;hi.src=`${hp}${hitW}/hit-1.png`;hit.classList.add('hit');if(damage){const f=document.createElement('b');f.className='float';f.textContent='-'+damage;hit.appendChild(f);setTimeout(()=>f.remove(),900)}setTimeout(()=>{ai.src=`${ap}${w}/attack-2.png`;hi.src=`${hp}${hitW}/hit-2.png`},160);setTimeout(()=>{ai.src=`${ap}${w}/idle.png`;hi.src=`${hp}${hitW}/idle.png`;hit.classList.remove('hit')},390)}
const wait=ms=>new Promise(r=>setTimeout(r,ms));function finish(win){$('#resultTitle').textContent=win?'승리':'패배';$('#resultTitle').style.color=win?'var(--deep)':'var(--coral)';$('#resultText').textContent=`${state.battle.round}라운드 · 최종 거리 ${state.battle.distance}`;go('result')}$$('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));$('#quick').onclick=()=>{state.weapon='standard';state.deck=W.standard.deck.slice();state.peaks=['stride','edge','vital'];startBattle()};$('#start').onclick=startBattle;$('#resolve').onclick=resolveTurn;$('#quit').onclick=()=>finish(false);renderSetup();
</script></body></html>
